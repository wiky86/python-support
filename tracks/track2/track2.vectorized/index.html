"Navbar\"]\nd:I[1060,[],\"\"]\n5:T655,## 벡터 연산이란?\n\n벡터 연산은 배열 전체에 계산을 한 번에 적용하는 것입니다. 반복문 없이 모든 값에 동시에 연산이 이루어져, 코드가 짧고 계산도 빠릅니다. NumPy를 쓰는 가장 큰 이유입니다.\n\n## 배열과 숫자의 연산\n\n배열에 숫자를 연산하면 모든 값에 똑같이 적용됩니다.\n\n```python\nimport numpy as np\narr = np.array([1, 2, 3, 4])\n\narr + 10     # [11 12 13 14]\narr * 2      # [2 4 6 8]\narr - 1      # [0 1 2 3]\narr / 2      # [0.5 1.  1.5 2. ]\n```\n\n## 반복문과 비교\n\n리스트로 같은 일을 하려면 반복문이 필요합니다.\n\n```python\n# 리스트 방식\nnums = [1, 2, 3, 4]\nresult = []\nfor n in nums:\n    result.append(n * 2)\n# result = [2, 4, 6, 8]\n\n# 배열 방식 — 한 줄\narr = np.array([1, 2, 3, 4])\nresult = arr * 2\n```\n\n배열 방식이 훨씬 간결합니다. 데이터가 많을수록 속도 차이도 커집니다.\n\n## 배열끼리의 연산\n\n같은 크기의 배열끼리 연산하면, 같은 위치의 값끼리 계산됩니다.\n\n```python\na = np.array([1, 2, 3])\nb = np.array([10, 20, 30])\n\na + b     # [11 22 33]\na * b     # [10 40 90]\n```\n\n`a + b`는 1+10, 2+20, 3+30처럼"])</script><script>self.__next_f.push([1," 짝을 지어 계산합니다.\n\n## 실전 예시 — 단위 변환\n\n섭씨 온도 배열을 화씨로 한 번에 변환할 수 있습니다.\n\n```python\ncelsius = np.array([0, 20, 37, 100])\nfahrenheit = celsius * 9 / 5 + 32\nprint(fahrenheit)    # [ 32.  68.  98.6 212. ]\n```\n\n모든 값에 같은 공식이 한 번에 적용됩니다. 데이터 분석에서 컬럼 전체를 계산할 때 이런 방식을 자주 씁니다.7:[\"trackId\",\"track2\",\"d\"]\n8:[\"topicId\",\"track2.vectorized\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track2\",\"track2.vectorized\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"children\":[[\"topicId\",\"track2.vectorized\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track2\\\",\\\"topicId\\\":\\\"track2.vectorized\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"children\":[[\"topicId\",\"track2.vectorized\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null, \\na = np.array([2, 4, 6])\\nb = np.array([1, 2, 3])\\nprint(a * b)\",\"answers\":[\"[ 2  8 18]\",\"[2 8 18]\"],\"output\":\"[ 2  8 18]\",\"explain\":\"같은 위치의 값끼리 곱합니다(2x1, 4x2, 6x3 = 2, 8, 18). 배열의 곱셈은 행렬 곱이 아니라 요소별 곱이라는 점을 기억하세요. 같은 자리 값끼리 짝지어 계산됩니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"arr = np.array([1, 2, 3])일 때 arr + 10의 결과는?\",\"options\":[\"[10 20 30]\",\"[11 12 13]\",\"[1 2 3 10]\",\"에러\"],\"answer\":1,\"explain\":\"모든 값에 10이 더해집니다(1+10, 2+10, 3+10). 벡터 연산은 배열 전체에 같은 숫자를 한 번에 적용합니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"벡터 연산의 가장 큰 장점은?\",\"options\":[\"값을 정렬해준다\",\"반복문 없이 전체에 계산을 적용한다\",\"자료형을 바꿔준다\",\"배열을 리스트로 만든다\"],\"answer\":1,\"explain\":\"반복문을 쓰지 않고 배열 전체에 연산을 적용해 코드가 간결하고 속도도 빠릅니다. 이것이 NumPy를 쓰는 핵심 이유입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"다음 코드의 결과는?\\n`a = np.array([1, 2, 3])`\\n`b = np.array([10, 20, 30])`\\n`print(a + b)`\",\"options\":[\"[11 22 33]\",\"[10 20 30 1 2 3]\",\"[66]\",\"에러\"],\"answer\":0,\"explain\":\"같은 위치끼리 더합니다(1+10, 2+20, 3+30). 배열끼리의 연산은 짝을 지어 계산하는 요소별 연산입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"arr = np.array([4, 8, 12])에서 arr / 4의 결과는?\",\"options\":[\"[1 2 3]\",\"[1. 2. 3.]\",\"[4 8 12]\",\"에러\"],\"answer\":1,\"explain\":\"나눗셈 결과는 실수가 되어 1. 2. 3.처럼 소수점이 붙습니다. 나누어떨어져도 NumPy는 나눗셈 결과를 float으로 표현합니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"다음 중 배열 a * b(둘 다 크기 3)에 대한 설명으로 옳은 것은?\",\"options\":[\"두 배열을 이어 붙인다\",\"같은 위치의 값끼리 곱한다\",\"행렬 곱을 한다\",\"첫 값끼리만 곱한다\"],\"answer\":1,\"explain\":\"배열의 *는 같은 위치끼리 곱하는 요소별 곱입니다. 행렬 곱(내적)이 아니라는 점을 주의하세요. 행렬 곱은 별도의 연산(@ 또는 np.dot)을 씁니다.\"}]},\"faq\":[{\"q\":\"벡터 연산이 반복문보다 왜 빠른가요?\",\"a\":\"NumPy가 내부적으로 최적화된 코드로 한꺼번에 계산하기 때문이에요. 파이썬 반복문은 값을 하나씩 처리하지만, 벡터 연산은 전체를 한 번에 처리해 데이터가 많을수록 훨씬 빠릅니다.\"},{\"q\":\"배열 크기가 다르면 연산이 되나요?\",\"a\":\"기본적으로는 같은 크기끼리 연산해요. 크기가 다르면 에러가 나거나, 특정 조건에서 브로드캐스팅이라는 규칙이 적용됩니다(다음 토픽에서 배웁니다).\"},{\"q\":\"a * b가 행렬 곱인가요?\",\"a\":\"아니에요. 같은 위치끼리 곱하는 요소별 곱입니다. 수학의 행렬 곱을 하려면 a @ b나 np.dot(a, b)를 써야 해요.\"},{\"q\":\"나눗셈만 왜 소수점이 붙나요?\",\"a\":\"나눗셈은 결과가 소수가 될 수 있어서 NumPy가 항상 실수형으로 처리해요. 그래서 나누어떨어져도 2.처럼 표시됩니다. 덧셈·뺄셈·곱셈은 정수끼리면 정수로 유지됩니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray\",\"track2.indexing\",\"track2.vectorized\",\"track2.broadcasting\",\"track2.statistics\",\"track2.boolean\"],\"topicFiles\":[\"topics/t1-ndarray.json\",\"topics/t2-indexing.json\",\"topics/t3-vectorized.json\",\"topics/t4-broadcasting.json\",\"topics/t5-statistics.json\",\"topics/t6-boolean.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track3\",\"order\":3,\"title\":\"pandas 핵심 - 데이터 구조\",\"description\":\"데이터 분석의 중심 도구인 pandas의 Series와 DataFrame을 익힙니다.\",\"topicOrder\":[\"track3.series\",\"track3.dataframe\",\"track3.loading\",\"track3.selection\",\"track3.filtering\",\"track3.columns\",\"track3.sorting\"],\"topicFiles\":[\"topics/t1-series.json\",\"topics/t2-dataframe.json\",\"topics/t3-loading.json\",\"topics/t4-selection.json\",\"topics/t5-filtering.json\",\"topics/t6-columns.json\",\"topics/t7-sorting.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track4\",\"order\":4,\"title\":\"pandas 실전 - 데이터 가공\",\"description\":\"실제 분석에서 가장 많이 쓰는 데이터 정제와 가공 기법을 익힙니다.\",\"topicOrder\":[\"track4.missing\",\"track4.duplicates\",\"track4.dtype\",\"track4.string\",\"track4.apply\",\"track4.newcolumns\"],\"topicFiles\":[\"topics/t1-missing.json\",\"topics/t2-duplicates.json

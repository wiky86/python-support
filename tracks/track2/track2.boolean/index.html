"Navbar\"]\nd:I[1060,[],\"\"]\n5:T6a9,## 조건으로 값 골라내기\n\nboolean indexing은 조건에 맞는 값만 배열에서 골라내는 기능입니다. \"60점 이상만\", \"0보다 큰 값만\"처럼 데이터를 걸러낼 때 핵심적으로 쓰입니다.\n\n## 배열에 조건을 걸면 True/False 배열이 나온다\n\n```python\nimport numpy as np\nscores = np.array([90, 50, 80, 40])\nscores \u003e= 60\n# [ True False  True False]\n```\n\n각 값이 조건을 만족하는지 하나씩 판단해, 같은 크기의 True/False 배열이 나옵니다. 90은 60 이상이라 True, 50은 아니라 False입니다.\n\n## True/False 배열로 값 걸러내기\n\n이 True/False 배열을 대괄호에 넣으면, True인 위치의 값만 골라냅니다.\n\n```python\nscores = np.array([90, 50, 80, 40])\nscores[scores \u003e= 60]\n# [90 80]\n```\n\n`scores[scores \u003e= 60]`은 \"scores 중 60 이상인 값만\"이라고 읽으면 됩니다. 데이터 분석에서 가장 자주 쓰는 패턴 중 하나입니다.\n\n## 다양한 조건\n\n```python\narr = np.array([1, -2, 3, -4, 5])\n\narr[arr \u003e 0]      # [1 3 5]   (양수만)\narr[arr \u003c 0]      # [-2 -4]   (음수만)\narr[arr != 0]     # [ 1 -2  3 -4  5]  (0이 아닌 값)\n```\n\n## 조건을 만족하는 개수 세기\n"])</script><script>self.__next_f.push([1,"\nTrue는 1, False는 0으로 취급되므로, 조건 배열에 `sum()`을 쓰면 조건을 만족하는 개수를 셀 수 있습니다.\n\n```python\nscores = np.array([90, 50, 80, 40])\n(scores \u003e= 60).sum()    # 2  (60 이상인 값이 2개)\n```\n\n## 조건으로 값 바꾸기\n\n조건에 맞는 위치의 값만 한 번에 바꿀 수도 있습니다.\n\n```python\nscores = np.array([90, 50, 80, 40])\nscores[scores \u003c 60] = 0\nprint(scores)     # [90  0 80  0]\n```\n\n60 미만인 값(50, 40)만 0으로 바뀝니다.7:[\"trackId\",\"track2\",\"d\"]\n8:[\"topicId\",\"track2.boolean\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track2\",\"track2.boolean\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"children\":[[\"topicId\",\"track2.boolean\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track2\\\",\\\"topicId\\\":\\\"track2.boolean\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"chi  배열에 sum()을 하면 True의 개수가 나옵니다. 60 이상인 값(90, 80, 70)이 3개이므로 3입니다. 조건을 만족하는 데이터가 몇 개인가를 셀 때 매우 유용한 패턴입니다.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요.\",\"code\":\"import numpy as np\\narr = np.array([10, 20, 30, 40])\\nprint(arr[arr \u003e 25])\",\"answers\":[\"[30 40]\"],\"output\":\"[30 40]\",\"explain\":\"arr \u003e 25 조건은 [False, False, True, True]가 되고, True인 위치의 값(30, 40)만 골라냅니다. 25보다 큰 값만 남는 것입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"arr = np.array([1, 2, 3])에서 arr \u003e 1의 결과는?\",\"options\":[\"[2 3]\",\"[False True True]\",\"[True True True]\",\"[1 2 3]\"],\"answer\":1,\"explain\":\"조건만 걸면 값이 아니라 True/False 배열이 나옵니다. 1은 조건 미달(False), 2와 3은 충족(True)입니다. 값을 골라내려면 이 조건을 대괄호 안에 넣어야 합니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"60점 이상만 골라내는 올바른 코드는? (s = np.array([...]))\",\"options\":[\"s \u003e= 60\",\"s[60]\",\"s[s \u003e= 60]\",\"s.max(60)\"],\"answer\":2,\"explain\":\"s[s \u003e= 60] 형태가 조건에 맞는 값을 골라냅니다. s \u003e= 60은 True/False 배열만 만들고, s[60]은 60번 인덱스 접근(에러), s.max(60)은 존재하지 않는 사용법입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"다음 코드의 결과는?\\n`arr = np.array([5, 10, 15, 20])`\\n`print(arr[arr \u003c 15])`\",\"options\":[\"[15 20]\",\"[5 10]\",\"[5 10 15]\",\"[True True False False]\"],\"answer\":1,\"explain\":\"15보다 작은 값(5, 10)만 골라냅니다. 15는 미만 조건에 포함되지 않습니다(\u003c는 같은 값 제외).\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"(arr \u003e= 60).sum()이 세는 것은?\",\"options\":[\"전체 값의 합\",\"60 이상인 값의 개수\",\"최댓값\",\"평균\"],\"answer\":1,\"explain\":\"조건 배열에서 True(=1)의 합이므로 조건을 만족하는 값의 개수가 됩니다. True는 1, False는 0으로 계산되기 때문입니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"다음 코드 실행 후 arr의 값은?\\n`arr = np.array([10, 20, 30])`\\n`arr[arr \u003e 15] = 0`\\n`print(arr)`\",\"options\":[\"[0 0 0]\",\"[10 0 0]\",\"[10 20 30]\",\"[0 20 30]\"],\"answer\":1,\"explain\":\"15보다 큰 값(20, 30)의 위치에 0이 대입됩니다. 10은 조건에 안 맞아 그대로 남고, 20과 30이 0으로 바뀝니다. 조건 필터링과 값 대입을 결합한 형태입니다.\"}]},\"faq\":[{\"q\":\"arr \u003e 5랑 arr[arr \u003e 5]가 왜 다른가요?\",\"a\":\"arr \u003e 5는 각 값이 조건에 맞는지 True/False로 알려주는 배열이에요. arr[arr \u003e 5]는 그 True/False를 이용해 실제 값만 골라낸 거고요. 조건을 대괄호에 넣어야 값이 걸러집니다.\"},{\"q\":\"조건을 두 개 이상 걸 수 있나요?\",\"a\":\"네, \u0026(그리고)와 |(또는)로 연결할 수 있어요. 예: arr[(arr \u003e 10) \u0026 (arr \u003c 50)]. 각 조건을 괄호로 감싸야 하는 점만 주의하세요.\"},{\"q\":\"True/False로 어떻게 개수를 세나요?\",\"a\":\"True는 1, False는 0으로 취급돼요. 그래서 조건 배열에 .sum()을 하면 True의 개수, 즉 조건을 만족하는 값의 개수가 나옵니다.\"},{\"q\":\"이게 데이터 분석에서 왜 중요한가요?\",\"a\":\"매출이 100 이상인 날만, 불량품만, 특정 지역만처럼 조건에 맞는 데이터만 뽑는 일이 분석의 핵심이거든요. pandas에서도 똑같은 방식으로 행을 걸러내기 때문에 지금 익혀두면 그대로 이어집니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray\",\"track2.indexing\",\"track2.vectorized\",\"track2.broadcasting\",\"track2.statistics\",\"track2.boolean\"],\"topicFiles\":[\"topics/t1-ndarray.json\",\"topics/t2-indexing.json\",\"topics/t3-vectorized.json\",\"topics/t4-broadcasting.json\",\"topics/t5-statistics.json\",\"topics/t6-boolean.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track3\",\"order\":3,\"title\":\"pandas 핵심 - 데이터 구조\",\"description\":\"데이터 분석의 중심 도구인 pandas의 Series와 DataFrame을 익힙니다.\",\"topicOrder\":[\"track3.series\",\"track3.dataframe\",\"track3.loading\",\"track3.selection\",\"track3.filtering\",\"track3.columns\",\"track3.sorting\"],\"topicFiles\":[\"topics/t1-series.json\",\"topics/t2-dataframe.json\",\"topics/t3-loading.json\",\"topics/t4-selection.json\",\"t

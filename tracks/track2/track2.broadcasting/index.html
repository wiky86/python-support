"Navbar\"]\nd:I[1060,[],\"\"]\n5:T799,## 브로드캐스팅이란?\n\n브로드캐스팅은 크기가 다른 배열(또는 배열과 숫자) 사이의 연산을, NumPy가 자동으로 크기를 맞춰 처리해주는 기능입니다. 앞에서 본 `arr + 10`도 사실 브로드캐스팅입니다. 숫자 10이 배열의 모든 값에 퍼져서(broadcast) 적용된 것이죠.\n\n## 숫자가 배열로 퍼진다\n\n```python\nimport numpy as np\narr = np.array([1, 2, 3])\narr + 10\n```\n\n여기서 `10`은 내부적으로 `[10, 10, 10]`처럼 배열 크기에 맞춰 늘어나, `[1+10, 2+10, 3+10]`이 됩니다. 실제로 큰 배열을 만들진 않지만, 개념적으로 이렇게 이해하면 쉽습니다.\n\n## 왜 편리한가\n\n브로드캐스팅 덕분에 \"모든 값에 같은 값을 더하기/곱하기\" 같은 작업을 반복문 없이, 크기를 일일이 맞추지 않고 쓸 수 있습니다.\n\n```python\nprices = np.array([1000, 2000, 3000])\n# 모든 가격에 10% 부가세 추가\nwith_tax = prices * 1.1\nprint(with_tax)    # [1100. 2200. 3300.]\n```\n\n`1.1`이라는 숫자 하나가 배열 전체에 퍼져 적용됩니다.\n\n## 슬라이스에 값 대입도 브로드캐스팅\n\n앞 토픽에서 본 `arr[1:4] = 0`도 브로드캐"])</script><script>self.__next_f.push([1,"스팅입니다. 숫자 0이 슬라이스 범위 전체로 퍼진 것입니다.\n\n```python\narr = np.array([1, 2, 3, 4, 5])\narr[1:4] = 7\nprint(arr)     # [1 7 7 7 5]\n```\n\n## 규칙의 핵심\n\n브로드캐스팅의 가장 기본 형태는 \"배열 - 숫자\"입니다. 숫자가 배열의 모든 값에 적용됩니다. (배열 - 배열의 복잡한 브로드캐스팅은 2차원 이상에서 다루며, 여기서는 이 기본형만 확실히 익히면 됩니다.)\n\n## 주의 — 크기가 안 맞으면 에러\n\n배열끼리는 크기가 맞거나 브로드캐스팅 규칙에 맞아야 합니다. 그렇지 않으면 에러가 납니다.\n\n```python\na = np.array([1, 2, 3])\nb = np.array([1, 2])\na + b     # 에러 (크기 3 vs 2, 맞출 수 없음)\n```7:[\"trackId\",\"track2\",\"d\"]\n8:[\"topicId\",\"track2.broadcasting\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track2\",\"track2.broadcasting\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"children\":[[\"topicId\",\"track2.broadcasting\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track2\\\",\\\"topicId\\\":\\\"track2.broadcasting\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"children\":[[\"topicId\",\"track2.broadcasting\",\"d\"],{\"children\":[\"__ 니다. 크기 3과 2는 호환되지 않습니다.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요.\",\"code\":\"import numpy as np\\narr = np.array([10, 20, 30])\\nprint(arr - 5)\",\"answers\":[\"[ 5 15 25]\",\"[5 15 25]\"],\"output\":\"[ 5 15 25]\",\"explain\":\"숫자 5가 브로드캐스팅되어 모든 값에서 빠집니다(10-5, 20-5, 30-5). 정수끼리의 뺄셈이라 결과도 정수로 유지되어 소수점이 붙지 않습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"브로드캐스팅을 가장 잘 설명한 것은?\",\"options\":[\"배열을 정렬하는 것\",\"크기가 다른 값들의 연산을 자동으로 크기를 맞춰 처리하는 것\",\"배열을 복사하는 것\",\"배열을 화면에 출력하는 것\"],\"answer\":1,\"explain\":\"브로드캐스팅은 숫자를 배열 전체에 퍼뜨리는 것처럼, 크기가 다른 대상의 연산을 자동으로 맞춰줍니다. arr + 10이 대표적인 예입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"arr = np.array([1, 2, 3])에서 arr * 100의 결과는?\",\"options\":[\"[100 200 300]\",\"[1 2 3 100]\",\"[100]\",\"에러\"],\"answer\":0,\"explain\":\"숫자 100이 모든 값에 곱해집니다. 이것도 브로드캐스팅이며, 숫자 하나가 배열 크기에 맞춰 퍼진 것입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"다음 중 브로드캐스팅으로 볼 수 있는 것은?\",\"options\":[\"arr[0]\",\"arr + 5\",\"len(arr)\",\"arr.shape\"],\"answer\":1,\"explain\":\"arr + 5는 숫자 5가 배열 전체에 퍼지는 브로드캐스팅입니다. 나머지는 인덱싱, 길이 확인, 모양 확인으로 연산이 아닙니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"다음 코드의 결과는?\\n`arr = np.array([1, 2, 3, 4])`\\n`arr[0:2] = 9`\\n`print(arr)`\",\"options\":[\"[9 9 9 9]\",\"[9 9 3 4]\",\"[1 2 9 9]\",\"에러\"],\"answer\":1,\"explain\":\"0~1번 위치에 9가 브로드캐스팅되어 두 자리가 9가 되고, 나머지(3, 4)는 유지됩니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"크기가 3인 배열과 크기가 2인 배열을 더하면?\",\"options\":[\"자동으로 크기가 맞춰진다\",\"앞의 2개만 계산된다\",\"에러가 난다\",\"크기가 5인 배열이 된다\"],\"answer\":2,\"explain\":\"크기 3과 2는 호환되지 않아 브로드캐스팅이 실패하고 에러가 납니다. 브로드캐스팅은 크기가 호환될 때(한쪽이 숫자이거나 특정 조건을 만족할 때)만 작동합니다.\"}]},\"faq\":[{\"q\":\"브로드캐스팅이란 말이 어렵게 느껴져요.\",\"a\":\"숫자 하나가 배열 전체에 퍼진다로 기억하면 쉬워요. arr + 10은 10이 모든 값에 퍼져서 더해지는 거예요. 이미 앞에서 써온 것이라 새로운 게 아닙니다.\"},{\"q\":\"왜 크기가 다르면 어떤 건 되고 어떤 건 안 되나요?\",\"a\":\"한쪽이 숫자(크기 1)면 배열 전체에 퍼질 수 있어 됩니다. 하지만 크기 3과 크기 2처럼 둘 다 여러 개인데 서로 안 맞으면 어떻게 짝지을지 정할 수 없어 에러가 나요.\"},{\"q\":\"실전에서 브로드캐스팅을 언제 쓰나요?\",\"a\":\"모든 값에 부가세 10% 적용, 모

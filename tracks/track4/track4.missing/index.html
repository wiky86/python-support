"Navbar\"]\nd:I[1060,[],\"\"]\n5:T78f,## 결측치란?\n\n결측치(missing value)는 값이 비어 있는 칸입니다. 실제 데이터에는 설문 미응답, 기록 누락 등으로 빈 칸이 흔하게 생깁니다. pandas는 이런 빈 값을 `NaN`(Not a Number)으로 표시하며, 분석 전에 이를 확인하고 처리하는 것이 데이터 정제의 첫걸음입니다.\n\n예제 데이터 (일부 값이 비어 있음):\n\n```python\nimport pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"이름\": [\"김철수\", \"이영희\", \"박민수\"],\n    \"점수\": [90, np.nan, 70]\n})\nprint(df)\n```\n\n출력:\n```\n    이름    점수\n0  김철수  90.0\n1  이영희   NaN\n2  박민수  70.0\n```\n\n이영희의 점수가 `NaN`(결측치)입니다.\n\n## 결측치 확인 — isna()\n\n`isna()`는 각 칸이 결측치인지 True/False로 보여줍니다.\n\n```python\ndf[\"점수\"].isna()\n```\n\n출력:\n```\n0    False\n1     True\n2    False\nName: 점수, dtype: bool\n```\n\n## 결측치 개수 세기\n\n`isna()`에 `sum()`을 붙이면 결측치 개수를 셀 수 있습니다(True=1).\n\n```python\ndf[\"점수\"].isna().sum()     # 1\n```\n\n전체 표의 열별 결측치 개수도 한 번에 볼 수 있습니다.\n\n```python\ndf.isna().sum()\n```\n\n## "])</script><script>self.__next_f.push([1,"결측치 채우기 — fillna()\n\n`fillna(값)`은 결측치를 지정한 값으로 채웁니다.\n\n```python\ndf[\"점수\"].fillna(0)        # NaN을 0으로\n```\n\n평균으로 채우는 것도 흔한 방법입니다.\n\n```python\ndf[\"점수\"].fillna(df[\"점수\"].mean())\n```\n\n## 결측치 있는 행 삭제 — dropna()\n\n`dropna()`는 결측치가 있는 행을 통째로 지웁니다.\n\n```python\ndf.dropna()\n```\n\n출력:\n```\n    이름    점수\n0  김철수  90.0\n2  박민수  70.0\n```\n\n## 채울까 지울까?\n\n결측치가 적고 값을 추정할 수 있으면 `fillna`로 채우고, 결측치가 많거나 그 행 자체가 신뢰하기 어려우면 `dropna`로 지웁니다. 정답은 없고 데이터 상황에 따라 판단합니다.7:[\"trackId\",\"track4\",\"d\"]\n8:[\"topicId\",\"track4.missing\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track4\",\"track4.missing\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track4\",\"d\"],{\"children\":[[\"topicId\",\"track4.missing\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track4\\\",\\\"topicId\\\":\\\"track4.missing\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"

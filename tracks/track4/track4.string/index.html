rs\":[\"contains\"],\"output\":\"0     True\\n1    False\\nName: 이메일, dtype: bool\",\"explain\":\".str.contains(\\\"@\\\")는 각 문자열에 @가 들어 있는지 True/False로 알려줍니다. \\\"kim@a.com\\\"은 포함(True), \\\"invalid\\\"는 미포함(False)입니다. 이 결과를 df[...]에 넣으면 조건에 맞는 행만 필터링할 수 있습니다.\"},{\"id\":\"fb4\",\"prompt\":\"각 이름의 글자 수를 세세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"이름\\\": [\\\"김철수\\\", \\\"이영희\\\"]})\\nprint(df[\\\"이름\\\"].str.______())\",\"answers\":[\"len\"],\"output\":\"0    3\\n1    3\\nName: 이름, dtype: int64\",\"explain\":\".str.len()은 각 문자열의 글자 수를 셉니다. 두 이름 모두 3글자이므로 3이 나옵니다. 일반 len()이 아니라 .str.len()을 써야 열의 각 문자열마다 길이를 재는 점에 주의하세요.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요. (리스트 형태로)\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"도시\\\": [\\\"Seoul\\\", \\\"BUSAN\\\", \\\"daegu\\\"]})\\nprint(list(df[\\\"도시\\\"].str.upper()))\",\"answers\":[\"['SEOUL', 'BUSAN', 'DAEGU']\",\"[\\\"SEOUL\\\", \\\"BUSAN\\\", \\\"DAEGU\\\"]\",\"['SEOUL','BUSAN','DAEGU']\"],\"output\":\"['SEOUL', 'BUSAN', 'DAEGU']\",\"explain\":\".str.upper()는 모든 글자를 대문자로 바꿉니다. \\\"Seoul\\\"-\u003e\\\"SEOUL\\\", 이미 대문자인 \\\"BUSAN\\\"은 그대로, \\\"daegu\\\"-\u003e\\\"DAEGU\\\"가 됩니다. list()로 감싸 값만 리스트로 확인한 것입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"문자열 열 전체에 문자열 처리를 적용할 때 붙이는 것은?\",\"options\":[\".string\",\".str\",\".text\",\".chars\"],\"answer\":1,\"explain\":\".str 접근자를 붙이면 파이썬 문자열 메서드를 열 전체에 적용할 수 있습니다. 예: df[\\\"이름\\\"].str.strip().\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"앞뒤 공백을 제거하는 것은?\",\"options\":[\".str.lower()\",\".str.strip()\",\".str.len()\",\".str.replace()\"],\"answer\":1,\"explain\":\".str.strip()이 앞뒤 공백을 제거합니다. 데이터 입력 시 들어간 불필요한 공백을 정리하는 데 씁니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"df[\\\"메일\\\"].str.contains(\\\"@\\\")의 결과는?\",\"options\":[\"개수\",\"각 값에 @가 있는지 True/False\",\"@를 제거한 값\",\"에러\"],\"answer\":1,\"explain\":\".str.contains(\\\"@\\\")는 각 문자열에 @가 포함됐는지를 True/False Series로 알려줍니다. 필터링 조건으로 자주 씁니다.

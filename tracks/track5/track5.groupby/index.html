"Navbar\"]\nd:I[1060,[],\"\"]\n5:T7c0,## 그룹화란?\n\n그룹화(groupby)는 같은 값을 가진 행끼리 묶어서 그룹별로 계산하는 것입니다. \"지점별 매출 합계\", \"부서별 평균 연봉\", \"요일별 방문자 수\"처럼 \"~별\"로 요약하는 모든 분석의 핵심입니다. 엑셀의 피벗 테이블과 비슷한 역할을 합니다.\n\n예제 데이터:\n\n```python\nimport pandas as pd\ndf = pd.DataFrame({\n    \"지점\": [\"서울\", \"부산\", \"서울\", \"부산\", \"서울\"],\n    \"매출\": [100, 80, 120, 90, 110]\n})\n```\n\n서울과 부산 데이터가 섞여 있습니다. 이걸 지점별로 묶어 계산하려는 것입니다.\n\n## groupby의 기본 구조\n\n`groupby(\"기준열\")`로 묶고, 그 뒤에 어떤 계산을 할지 정합니다.\n\n```python\ndf.groupby(\"지점\")[\"매출\"].sum()\n```\n\n출력:\n```\n지점\n부산    170\n서울    330\nName: 매출, dtype: int64\n```\n\n읽는 방법: \"지점으로 묶어서(groupby), 매출 열을([\\\"매출\\\"]), 합계 내라(sum())\". 서울(100+120+110=330)과 부산(80+90=170)이 각각 계산됐습니다.\n\n## 세 부분으로 나눠 이해하기\n\n```\ndf.groupby(\"지점\")   [\"매출\"]   .sum()\n   무엇으로 묶나     어느 열을   어떤 계산\n```\n\n이 세 부"])</script><script>self.__next_f.push([1,"분(묶을 기준 -\u003e 계산할 열 -\u003e 집계 함수)이 groupby의 기본 골격입니다.\n\n## 결과의 인덱스는 그룹 이름\n\ngroupby 결과는 그룹 기준 값(부산, 서울)이 인덱스가 됩니다. 그래서 왼쪽에 지점 이름이 오고, 가나다순으로 정렬되어 나옵니다.\n\n## 그룹 크기 세기 — size()\n\n각 그룹에 행이 몇 개인지 셀 때는 `size()`를 씁니다.\n\n```python\ndf.groupby(\"지점\").size()\n```\n\n출력:\n```\n지점\n부산    2\n서울    3\ndtype: int64\n```\n\n서울 3건, 부산 2건입니다.\n\n## 왜 groupby가 강력한가\n\ngroupby가 없다면 서울만 필터링해서 합계 내고, 부산만 필터링해서 합계 내고... 그룹마다 반복해야 합니다. groupby는 이 모든 그룹을 한 번에 계산해줍니다.7:[\"trackId\",\"track5\",\"d\"]\n8:[\"topicId\",\"track5.groupby\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track5\",\"track5.groupby\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track5\",\"d\"],{\"children\":[[\"topicId\",\"track5.groupby\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track5\\\",\\\"topicId\\\":\\\"track5.groupby\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track5\",\"d\ \\"지점별 거래 건수\\\" 같은 걸 구할 때 유용합니다.\"},{\"id\":\"fb4\",\"prompt\":\"매출 열을 골라 그룹별 평균을 구하세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"지점\\\": [\\\"A\\\", \\\"B\\\", \\\"A\\\"], \\\"매출\\\": [100, 80, 200]})\\nprint(df.groupby(\\\"지점\\\")[______].mean())\",\"answers\":[\"\\\"매출\\\"\",\"'매출'\"],\"output\":\"지점\\nA    150.0\\nB     80.0\\nName: 매출, dtype: float64\",\"explain\":\"groupby 뒤에 대괄호로 계산할 열(\\\"매출\\\")을 지정합니다. A의 평균은 (100+200)/2=150, B는 80입니다. 평균은 나눗셈을 포함하므로 결과가 실수형으로 나옵니다. \\\"묶을 기준 -\u003e 계산할 열 -\u003e 집계 함수\\\"의 세 부분 구조를 기억하세요.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요. (1반의 값)\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"반\\\": [\\\"1반\\\", \\\"2반\\\", \\\"1반\\\", \\\"2반\\\"], \\\"점수\\\": [90, 70, 80, 60]})\\nresult = df.groupby(\\\"반\\\")[\\\"점수\\\"].sum()\\nprint(result[\\\"1반\\\"])\",\"answers\":[\"170\"],\"output\":\"170\",\"explain\":\"반으로 묶어 점수 합계를 냅니다. 1반은 90+80=170입니다. 결과의 인덱스는 그룹 이름(1반, 2반)이 되므로 result[\\\"1반\\\"]으로 해당 그룹 값을 꺼낼 수 있습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"groupby가 하는 일은?\",\"options\":[\"데이터를 정렬\",\"같은 값을 가진 행끼리 묶어 그룹별로 계산\",\"결측치 제거\",\"열 삭제\"],\"answer\":1,\"explain\":\"groupby는 기준 열의 값이 같은 행끼리 묶어 그룹별로 집계합니다. \\\"~별\\\" 요약의 핵심 도구입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"df.groupby(\\\"지점\\\")[\\\"매출\\\"].sum()을 바르게 읽은 것은?\",\"options\":[\"매출로 묶어 지점 합계\",\"지점으로 묶어 매출 합계\",\"지점과 매출을 더함\",\"매출을 정렬\"],\"answer\":1,\"explain\":\"\\\"지점으로 묶어서(groupby), 매출 열을, 합계 낸다\\\"로 읽습니다. 묶는 기준이 지점, 계산 대상이 매출입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"groupby 결과에서 인덱스가 되는 것은?\",\"options\":[\"0, 1, 2 번호\",\"그룹 기준 값(예: 지점 이름)\",\"매출 값\",\"없음\"],\"answer\":1,\"explain\":\"groupby 결과는 그룹 기준 값(부산, 서울 등)이 인덱스가 되어 왼쪽에 표시됩니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"각 그룹의 행 개수를 세는 것은?\",\"options\":[\"sum()\",\"mean()\",\"size()\",\"max()\"],\"answer\":2,\"explain\":\"size()가 각 그룹에 속한 행의 개수를 셉니다. sum은 합계, mean은 평균, max는 최댓값입니다.\"},{\"id\":\"q5\",\"type\":\

"Navbar\"]\nd:I[1060,[],\"\"]\n5:T845,"])</script><script>self.__next_f.push([1,"## 두 개 이상의 기준으로 묶기\n\n지금까지는 한 열(\"지점\")로만 묶었지만, 여러 열을 동시에 기준으로 삼을 수 있습니다. \"지점별, 그리고 그 안에서 다시 상품별\"처럼 계층적으로 묶는 것입니다. 더 세밀한 요약이 가능해집니다.\n\n예제 데이터:\n\n```python\nimport pandas as pd\ndf = pd.DataFrame({\n    \"지점\": [\"서울\", \"서울\", \"부산\", \"부산\"],\n    \"상품\": [\"A\", \"B\", \"A\", \"B\"],\n    \"매출\": [100, 150, 80, 90]\n})\n```\n\n## 여러 열로 묶기 — 리스트로 전달\n\ngroupby에 열 이름 리스트를 넣습니다.\n\n```python\ndf.groupby([\"지점\", \"상품\"])[\"매출\"].sum()\n```\n\n출력:\n```\n지점  상품\n부산  A      80\n     B      90\n서울  A     100\n     B     150\nName: 매출, dtype: int64\n```\n\n지점으로 먼저 묶고, 그 안에서 상품으로 다시 묶어 각 조합의 매출 합계가 나옵니다. 왼쪽 인덱스가 지점·상품 두 단계로 표시됩니다.\n\n## 결과 읽는 법\n\n`부산-A`는 80, `서울-B`는 150처럼 두 기준의 조합마다 값이 하나씩 나옵니다. 4개 조합(부산A, 부산B, 서울A, 서울B)이 각각 계산된 것입니다.\n\n## 순서가 중요하다\n\n`[\"지점\", \"상품\"]`과 `[\"상품\", \"지점\"]`은 묶는 순서가 달라 결과 표의 구조가 달라집니다. 앞에 온 기준이 바깥쪽(큰 묶음), 뒤가 안쪽(작은 묶음)이 됩니다.\n\n## 표 형태로 바꾸기 — unstack()\n\n여러 열로 묶은 세로로 긴 결과를, `unstack()`으로 2차원 표로 펼칠 수 있습니다.\n\n```python\ndf.groupby([\"지점\", \"상품\"])[\"매출\"].sum().unstack()\n```\n\n출력:\n```\n상품     A    B\n지점\n부산    80   90\n서울   100  150\n```\n\n안쪽 기준(상품)이 열로 올라가 피벗 테이블과 비슷한 형태가 됩니다. 사실 이것은 앞 토픽의 pivot_table과 같은 결과입니다. 두 방법 모두 두 기준 교차 집계를 만들 수 있습니다.\n\n## 언제 여러 열로 묶나?\n\n\"부서별·직급별 평균 연봉\", \"지역별·연령대별 인구\"처럼 두 가지 이상의 기준으로 세분화해 볼 때 씁니다."])</script><script>self.__next_f.push([1,"7:[\"trackId\",\"track5\",\"d\"]\n8:[\"topicId\",\"track5.multigroup\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track5\",\"track5.multigroup\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track5\",\"d\"],{\"children\":[[\"topicId\",\"track5.multigroup\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track5\\\",\\\"topicId\\\":\\\"track5.multigroup\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true  as pd\\ndf = pd.DataFrame({\\\"지점\\\": [\\\"A\\\", \\\"A\\\", \\\"B\\\"], \\\"상품\\\": [\\\"가\\\", \\\"나\\\", \\\"가\\\"], \\\"매출\\\": [100, 150, 80]})\\nprint(df.groupby([\\\"지점\\\", \\\"상품\\\"])[\\\"매출\\\"].sum().______())\",\"answers\":[\"unstack\"],\"output\":\"상품      가      나\\n지점\\nA    100.0  150.0\\nB     80.0    NaN\",\"explain\":\"unstack()은 여러 단계로 묶인 세로 결과를 2차원 표로 펼칩니다. 안쪽 기준(상품)이 열로 올라가 피벗 테이블 같은 형태가 됩니다. B-나 조합은 데이터가 없어 NaN이 됩니다.\"},{\"id\":\"fb4\",\"prompt\":\"부서와 직급으로 묶어 인원수를 세세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"부서\\\": [\\\"영업\\\", \\\"영업\\\", \\\"개발\\\"], \\\"직급\\\": [\\\"사원\\\", \\\"사원\\\", \\\"대리\\\"], \\\"이름\\\": [\\\"A\\\", \\\"B\\\", \\\"C\\\"]})\\nprint(df.groupby([\\\"부서\\\", \\\"직급\\\"]).______())\",\"answers\":[\"size\"],\"output\":\"부서  직급\\n개발  대리    1\\n영업  사원    2\\ndtype: int64\",\"explain\":\"size()는 각 그룹 조합의 행 개수를 셉니다. 영업-사원은 2명, 개발-대리는 1명입니다. 여러 열로 묶으면 두 기준의 조합별 건수를 셀 수 있어, 교차 빈도표를 만들 때 유용합니다.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력에서 서울-B의 값을 예측하세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"지점\\\": [\\\"서울\\\", \\\"서울\\\", \\\"서울\\\"], \\\"상품\\\": [\\\"A\\\", \\\"B\\\", \\\"B\\\"], \\\"매출\\\": [100, 50, 70]})\\nresult = df.groupby([\\\"지점\\\", \\\"상품\\\"])[\\\"매출\\\"].sum()\\nprint(result[\\\"서울\\\", \\\"B\\\"])\",\"answers\":[\"120\"],\"output\":\"120\",\"explain\":\"서울-B 조합은 매출 50과 70이 있으므로 합계는 120입니다. 여러 열로 묶은 결과는 result[\\\"서울\\\", \\\"B\\\"]처럼 두 기준 값을 함께 지정해 특정 조합의 값을 꺼낼 수 있습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"여러 열로 그룹화하려면 groupby에 무엇을 넣나요?\",\"options\":[\"문자열 하나\",\"열 이름 리스트\",\"숫자\",\"딕셔너리\"],\"answer\":1,\"explain\":\"groupby([\\\"지점\\\", \\\"상품\\\"])처럼 열 이름 리스트를 넣으면 여러 기준으로 묶습니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"groupby([\\\"지점\\\", \\\"상품\\\"])에서 바깥쪽(큰 묶음) 기준은?\",\"options\":[\"상품\",\"지점\",\"둘 다 같음\",\"매출\"],\"answer\":1,\"explain\":\"리스트에서 앞에 온 기준(지점)이 바깥쪽 큰 묶음, 뒤(상품)가 안쪽 작은 묶음이 됩니다. 순서에 따라 표 구조가 달라집니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"여러 열로 묶은 세로 결과를 2차원 표로 펼치는 것은?\",\"options\":[\"stack()\",\"unstack()\",\"pivot() 만\",\"reset()\"],\"answer\":1,\"explain\":\"unstack()은 안쪽 기준을 열로 올려 2차원 표로 펼칩니다. 결과는 피벗 테이블과 비슷한 형태가 됩니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"groupby([\\\"부서\\\", \\\"직급\\\"]).size()가 세는 것은?\",\"options\":[\"부서 수\",\"부서·직급 조합별 행 개수\",\"전체 인원\",\"직급 수\"],\"answer\":1,\"explain\":\"여러 열로 묶은 뒤 size()는 각 조합(부서·직급)의 행 개수를 셉니다. 교차 빈도를 구할 때 유용합니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"여러 열 그룹화가 유용한 경우는?\",\"options\":[\"단일 기준 요약\",\"두 가지 이상 기준으로 세분화\",\"결측치 제거\",\"정렬\"],\"answer\":1,\"explain\":\"\\\"부서별·직급별\\\", \\\"지역별·연령대별\\\"처럼 두 가지 이상의 기준으로 데이터를 세분화해 볼 때 여러 열 그룹화를 씁니다.\"}]},\"faq\":[{\"q\":\"왜 대괄호로 열을 묶어 넣나요?\",\"a\":\"여러 열을 기준으로 쓰려면 열 이름들을 리스트로 전달해야 해요. 그래서 groupby([\\\"지점\\\", \\\"상품\\\"])처럼 대괄호로 감쌉니다. 하나면 groupby(\\\"지점\\\")처럼 대괄호 없이도 됩니다.\"},{\"q\":\"결과가 계단처럼 들여쓰기돼서 나와요.\",\"a\":\"여러 단계로 묶여서 그래요. 바깥 기준(지점)이 같은 행은 이름을 생략하고, 안쪽 기준(상품)만 나열돼 계단처럼 보입니다. unstack()으로 펼치면 깔끔한 2차원 표가 됩니다.\"},{\"q\":\"unstack이랑 pivot_table이랑 같은 건가요?\",\"a\":\"결과가 비슷해요. groupby + unstack과 pivot_table 둘 다 두 기준 교차 집계표를 만들 수 있어요. 상황에 따라 편한 걸 쓰면 됩니다.\"},{\"q\":\"기준 열을 3개 이상 넣어도 되나요?\",\"a\":\"네, groupby([\\\"지점\\\", \\\"상품\\\", \\\"월\\\"])처럼 더 넣을 수 있어요. 다만 기준이 많아질수록 결과가 복잡해지니, 보통 2~3개 정도가 읽기 좋습니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray

"Navbar\"]\nd:I[1060,[],\"\"]\n5:T981,"])</script><script>self.__next_f.push([1,"## 탐색에서 발견한 문제를 고친다\n\n탐색 단계에서 결측치, 잘못된 타입, 중복 같은 문제를 발견했다면, 이제 정제 단계에서 실제로 고칩니다. 트랙4에서 배운 기술들을 실전 데이터에 적용하는 단계입니다.\n\n이 트랙의 카페 데이터인데, 이번엔 일부러 문제를 심어둔 버전입니다.\n\n```python\nimport pandas as pd\nimport numpy as np\n\ndf = pd.DataFrame({\n    \"요일\": [\"월\", \"화\", \"수\", \"목\", \"금\"],\n    \"메뉴\": [\"아메리카노\", \"라떼\", \"아메리카노\", \"라떼\", \"아메리카노\"],\n    \"판매량\": [\"50\", \"45\", \"55\", \"48\", \"60\"],   # 문자열로 들어옴!\n    \"매출\": [150000, 180000, np.nan, 192000, 180000]   # 결측치 있음!\n})\n```\n\n탐색해 보면 두 가지 문제가 보입니다: 판매량이 문자열이고, 매출에 결측치가 있습니다.\n\n## 문제 1 해결: 판매량 타입 변환\n\n판매량이 문자열(\"50\")이라 계산이 안 됩니다. 정수로 바꿉니다.\n\n```python\ndf[\"판매량\"] = df[\"판매량\"].astype(int)\n```\n\n이제 판매량으로 합계·평균을 낼 수 있습니다.\n\n## 문제 2 해결: 매출 결측치 처리\n\n매출에 빈 값(NaN)이 있습니다. 여기서는 평균으로 채워 보겠습니다.\n\n```python\n매출평균 = df[\"매출\"].mean()\ndf[\"매출\"] = df[\"매출\"].fillna(매출평균)\n```\n\n결측치를 그 열의 평균으로 채우면, 전체 경향을 크게 왜곡하지 않으면서 빈 값을 메울 수 있습니다. (0으로 채우거나 행을 삭제할 수도 있으며, 상황에 따라 선택합니다.)\n\n## 정제 후 확인\n\n정제가 잘 됐는지 다시 확인합니다.\n\n```python\ndf.info()          # 타입과 결측치 재확인\ndf.isna().sum()    # 결측치가 0이 됐는지\n```\n\n정제 후에는 항상 결과를 다시 점검하는 것이 좋습니다.\n\n## 새 열 만들기 — 파생 변수\n\n정제된 데이터로 분석에 도움이 될 새 열을 만들 수 있습니다. 예를 들어 잔당 평균 매출(매출/판매량)을 계산합니다.\n\n```python\ndf[\"잔당매출\"] = df[\"매출\"] / df[\"판매량\"]\n```\n\n이렇게 만든 파생 변수는 다음 집계·분석 단계에서 활용됩니다.\n\n## 정제의 핵심\n\n정제는 \"분석 가능한 상태로 데이터를 다듬는 것\"입니다. 타입을 맞추고, 결측치를 처리하고, 필요한 열을 만들어 두면 이후 집계와 시각화가 매끄럽게 진행됩니다."])</script><script>self.__next_f.push([1,"7:[\"trackId\",\"track7\",\"d\"]\n8:[\"topicId\",\"track7.cleaning\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track7\",\"track7.cleaning\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track7\",\"d\"],{\"children\":[[\"topicId\",\"track7.cleaning\",\"d\"],{\"children\":[\"__PAGE__?{\\\"track )\\n매출평균 = df[\\\"매출\\\"].mean()\\ndf[\\\"매출\\\"] = df[\\\"매출\\\"].______(매출평균)\\nprint(df[\\\"매출\\\"].isna().sum())\",\"answers\":[\"fillna\"],\"output\":\"0\",\"explain\":\"fillna(매출평균)으로 결측치를 평균값으로 채웁니다. 채운 뒤 isna().sum()이 0이 되어 결측치가 모두 처리됐음을 확인할 수 있습니다. 평균으로 채우면 전체 경향을 크게 바꾸지 않으면서 빈 값을 메울 수 있습니다.\"},{\"id\":\"fb4\",\"prompt\":\"매출을 판매량으로 나눠 잔당매출 열을 만드세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"매출\\\": [150000, 180000], \\\"판매량\\\": [50, 45]})\\ndf[\\\"잔당매출\\\"] = df[\\\"매출\\\"] ______ df[\\\"판매량\\\"]\\nprint(list(df[\\\"잔당매출\\\"]))\",\"answers\":[\"/\"],\"output\":\"[3000.0, 4000.0]\",\"explain\":\"매출을 판매량으로 나누면 잔당 평균 매출이 나옵니다(150000/50=3000, 180000/45=4000). 기존 열을 조합해 새 지표(파생 변수)를 만드는 작업으로, 분석에 유용한 새 관점을 제공합니다.\"},{\"id\":\"fb5\",\"prompt\":\"정제 후 결측치가 모두 사라졌는지 확인하세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"매출\\\": [150000, 180000, 174000]})\\nprint(df.isna().______())\",\"answers\":[\"sum\"],\"output\":\"매출    0\\ndtype: int64\",\"explain\":\"isna().sum()으로 각 열의 결측치 개수를 셉니다. 정제가 잘 됐다면 0이 나옵니다. 정제 작업 후에는 항상 이렇게 결과를 다시 점검해, 문제가 제대로 해결됐는지 확인하는 것이 좋습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"정제 단계에서 하는 일이 아닌 것은?\",\"options\":[\"결측치 처리\",\"타입 변환\",\"파생 열 만들기\",\"문제 정의\"],\"answer\":3,\"explain\":\"문제 정의는 분석의 첫 단계입니다. 정제 단계에서는 결측치 처리, 타입 변환, 파생 열 생성 등 데이터를 분석 가능한 상태로 다듬는 작업을 합니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"문자열 \\\"50\\\"을 계산 가능한 숫자로 바꾸려면?\",\"options\":[\"fillna(int)\",\"astype(int)\",\"mean()\",\"dropna()\"],\"answer\":1,\"explain\":\"astype(int)로 문자열을 정수로 변환합니다. 이후 합계·평균 등의 계산이 가능해집니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"결측치를 평균으로 채우는 코드는?\",\"options\":[\"df[\\\"매출\\\"].dropna()\",\"df[\\\"매출\\\"].fillna(df[\\\"매출\\\"].mean())\",\"df[\\\"매출\\\"].astype(float)\",\"df[\\\"매출\\\"].sum()\"],\"answer\":1,\"explain\":\"fillna()에 평균값을 넣으면 결측치가 평균으로 채워집니다. 전체 경향을 크게 왜곡하지 않는 결측치 처리 방법입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"df[\\\"잔당매출\\\"] = df[\\\"매출\\\"] / df[\\\"판매량\\\"]가 만드는 것은?\",\"options\":[\"결측치\",\"매출과 판매량으로 계산한 파생 열\",\"그래프\",\"그룹\"],\"answer\":1,\"explain\":\"기존 두 열을 나눠 새로운 지표(잔당 매출)를 만드는 파생 변수입니다. 분석에 유용한 새 관점을 더해줍니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"정제 작업 후 권장되는 것은?\",\"options\":[\"바로 발표한다\",\"결과를 다시 확인(info, isna 등)한다\",\"데이터를 삭제한다\",\"아무것도 안 한다\"],\"answer\":1,\"explain\":\"정제 후에는 info()나 isna().sum() 등으로 문제가 제대로 해결됐는지 다시 점검하는 것이 좋습니다. 정제가 잘못되면 이후 분석이 모두 틀어질 수 있기 때문입니다.\"}]},\"faq\":[{\"q\":\"결측치를 평균으로 채우는 게 항상 맞나요?\",\"a\":\"아니에요. 상황에 따라 0으로 채우거나, 행을 아예 삭제하기도 해요. 평균으로 채우는 건 전체 경향을 유지하면서 빈 값을 메우고 싶을 때 쓰는 방법 중 하나예요. 정답은 데이터와 목적에 따라 달라집니다.\"},{\"q\":\"왜 판매량이 문자열로 들어오나요?\",\"a\":\"CSV 파일이나 외부 데이터를 읽을 때 숫자가 문자열로 저장돼 오는 경우가 흔해요. 그래서 탐색 단계에서 dtype을 확인하고, 문자열이면 정제 단계에서 astype으로 바꿔주는 거예요.\"},{\"q\":\"파생 변수는 꼭 만들어야 하나요?\",\"a\":\"필수는 아니에요. 하지만 잔당 매출처럼 기존 열만으로는 안 보이는 새 관점을 주는 파생 변수는 분석을 훨씬 풍부하게 해줘요. 필요할 때 만들면 됩니다.\"},{\"q\":\"정제 순서가 정해져 있나요?\",\"a\":\"엄격한 규칙은 없지만, 보통 타입을 맞추고 -\u003e 결측치를 처리하고 -\u003e 파생 열을 만드는 흐름이 자연스러워요. 계산이 필요한 작업 전에 타입과 결측치를 먼저 정리한다고 생각하면 됩니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray\",\"track2.indexing\",\"track2.vectorized\",\"track2.broadcasting\",\"track2.statistics\",\"track2.boolean\"],\"topicFiles\":[\"topics/t1-ndarray.json\",\"topics/t2-indexing.json\",\"topics/t3-vectorized.json\",\"topics/t4-broadcasting.json\",\"topics/t5-statistics.json\"

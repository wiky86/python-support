"Navbar\"]\nd:I[1060,[],\"\"]\n5:T99b,"])</script><script>self.__next_f.push([1,"## 분석의 마지막: 의미를 끌어내기\n\n데이터를 정제하고, 집계하고, 시각화했다면, 마지막으로 \"그래서 무엇을 알게 됐는가?\"를 정리해야 합니다. 숫자와 그래프 자체가 결론이 아니라, 거기서 끌어낸 의미와 제안이 분석의 진짜 결과물입니다.\n\n## 해석이란?\n\n해석은 집계·시각화 결과를 사람의 언어로 설명하는 것입니다.\n- (집계 결과) 주말 평균 매출 307,500 vs 평일 173,400\n- (해석) \"주말 매출이 평일의 약 1.8배로, 매출이 주말에 집중된다\"\n\n숫자를 \"그래서 이것이 의미하는 바는~\"으로 바꾸는 것이 해석입니다.\n\n## 좋은 해석의 조건\n\n1. **데이터에 근거한다**: 추측이 아니라 집계 결과에 기반해야 합니다.\n2. **구체적이다**: \"매출이 좋다\"가 아니라 \"주말 매출이 평일의 1.8배\"처럼 구체적으로.\n3. **행동으로 연결된다**: \"그러니 주말에 인력을 늘리자\" 같은 제안으로 이어지면 좋습니다.\n\n## 분석 결과 정리 예시\n\n카페 데이터 분석을 정리하면 이렇습니다.\n\n```\n[카페 판매 데이터 분석 결과]\n\n1. 주말 효과\n   - 주말 평균 매출(307,500)이 평일(173,400)의 약 1.8배\n   - 토요일이 판매량·매출 모두 최고\n\n2. 판매량과 매출의 관계\n   - 판매량이 많은 날은 매출도 높음 (양의 관계)\n\n3. 제안\n   - 주말에 재고와 인력을 더 확보\n   - 평일 매출을 높일 프로모션 검토\n```\n\n## 상관관계 != 인과관계 (주의)\n\n\"판매량과 매출이 함께 오른다\"는 관계는 보이지만, 이것이 반드시 \"판매량이 매출의 원인\"이라는 뜻은 아닙니다. 데이터로는 관계(함께 움직임)까지 볼 수 있고, 원인은 더 신중히 따져야 합니다. 성급한 결론을 경계하는 것이 좋은 분석가의 태도입니다.\n\n## 분석 보고서의 기본 구조\n\n1. 무엇을 분석했나 (문제 정의)\n2. 어떻게 했나 (데이터·방법)\n3. 무엇을 발견했나 (인사이트)\n4. 그래서 무엇을 하면 좋은가 (제안)\n\n이 흐름으로 정리하면 누구나 이해할 수 있는 분석 결과가 됩니다.\n\n## 전체 흐름 되돌아보기\n\n문제 정의 -\u003e 탐색 -\u003e 정제 -\u003e 집계 -\u003e 시각화 -\u003e 해석. 이 여섯 단계를 모두 거치면 하나의 완결된 데이터 분석이 됩니다. 이 트랙에서 그 전 과정을 카페 데이터로 밟아왔습니다."])</script><script>self.__next_f.push([1,"7:[\"trackId\",\"track7\",\"d\"]\n8:[\"topicId\",\"track7.interpretation\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track7\",\"track7.interpretation\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track7\",\"d\"],{\"children\":[[\"topicId\",\"track7.interpretation\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track7\\\",\\\"topicId\\\":\\\"track7.interpretation\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"childre ndf = pd.DataFrame({\\\"매출\\\": [150000, 180000, 360000, 255000]})\\nprint(df[\\\"매출\\\"].______())\",\"answers\":[\"sum\"],\"output\":\"945000\",\"explain\":\"sum()으로 전체 매출 합계를 구합니다. 분석 결과를 정리할 때 \\\"총 매출 얼마\\\" 같은 요약 수치는 전체 규모를 보여주는 기본 지표입니다.\"},{\"id\":\"fb5\",\"prompt\":\"다음 중 \\\"좋은 해석\\\"에 해당하는 것은? (번호로: 1 또는 2)\",\"code\":\"# 1: \\\"매출이 그냥 좋다\\\"\\n# 2: \\\"주말 매출이 평일의 1.8배로, 매출이 주말에 집중된다\\\"\\n# 더 좋은 해석은?\",\"answers\":[\"2\"],\"output\":\"2\",\"explain\":\"좋은 해석은 데이터에 근거해 구체적입니다. \\\"그냥 좋다\\\"(1)는 막연하지만, \\\"주말이 평일의 1.8배\\\"(2)는 수치로 뒷받침된 구체적 결론입니다. 구체적이고 근거 있는 해석이 설득력을 가집니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"데이터 분석에서 \\\"해석\\\"이란?\",\"options\":[\"데이터를 삭제하는 것\",\"집계·시각화 결과에서 의미를 끌어내는 것\",\"그래프를 그리는 것\",\"결측치를 채우는 것\"],\"answer\":1,\"explain\":\"해석은 숫자와 그래프에서 \\\"그래서 무엇을 알게 됐는가\\\"라는 의미를 끌어내는 것입니다. 분석의 진짜 결과물입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"좋은 해석의 조건이 아닌 것은?\",\"options\":[\"데이터에 근거한다\",\"구체적이다\",\"행동으로 연결된다\",\"추측에 의존한다\"],\"answer\":3,\"explain\":\"좋은 해석은 추측이 아니라 데이터에 근거해야 합니다. 구체적이고 행동 제안으로 이어지면 더 좋습니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"\\\"상관관계 != 인과관계\\\"가 뜻하는 것은?\",\"options\":[\"둘은 항상 같다\",\"함께 움직인다고 원인-결과인 것은 아니다\",\"관계는 볼 수 없다\",\"인과가 항상 맞다\"],\"answer\":1,\"explain\":\"두 값이 함께 움직여도(상관), 하나가 다른 것의 원인(인과)이라는 보장은 없습니다. 성급한 인과 결론을 경계해야 합니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"분석 보고서의 일반적 흐름으로 옳은 것은?\",\"options\":[\"제안 -\u003e 문제 정의 -\u003e 발견\",\"문제 정의 -\u003e 방법 -\u003e 발견 -\u003e 제안\",\"발견 -\u003e 제안 -\u003e 문제 정의\",\"방법 -\u003e 제안만\"],\"answer\":1,\"explain\":\"무엇을 분석했나(문제) -\u003e 어떻게(방법) -\u003e 무엇을 발견(인사이트) -\u003e 그래서 무엇을(제안) 순서가 이해하기 좋은 보고서 구조입니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"데이터 분석의 전체 6단계 순서로 옳은 것은?\",\"options\":[\"정제 -\u003e 문제 정의 -\u003e 해석\",\"문제 정의 -\u003e 탐색 -\u003e 정제 -\u003e 집계 -\u003e 시각화 -\u003e 해석\",\"시각화 -\u003e 집계 -\u003e 탐색\",\"해석 -\u003e 정제 -\u003e 탐색\"],\"answer\":1,\"explain\":\"문제 정의 -\u003e 탐색 -\u003e 정제 -\u003e 집계 -\u003e

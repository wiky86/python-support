\\", \\\"90\\\", \\\"85\\\"],\\n    \\\"매출\\\": [150000, 180000, 165000, 192000, np.nan, 360000, 255000]\\n})\"},\"missions\":[{\"id\":\"m1\",\"prompt\":\"[탐색] 데이터 크기 확인하기\",\"code\":\"print(df.______)\",\"answers\":[\"shape\"],\"output\":\"(7, 4)\",\"explain\":\"분석 첫 단계로 데이터 크기를 확인합니다. 7일치, 4개 열입니다. 탐색으로 데이터 규모를 먼저 파악합니다.\"},{\"id\":\"m2\",\"prompt\":\"[탐색] 매출 열의 결측치 개수 확인하기\",\"code\":\"print(df[\\\"매출\\\"].isna().______())\",\"answers\":[\"sum\"],\"output\":\"1\",\"explain\":\"매출 열에 결측치가 1개(금요일) 있음을 확인합니다. 탐색에서 발견한 이 문제를 다음 정제 단계에서 해결합니다.\"},{\"id\":\"m3\",\"prompt\":\"[정제] 판매량을 정수로 변환하기\",\"code\":\"df[\\\"판매량\\\"] = df[\\\"판매량\\\"].astype(______)\\nprint(df[\\\"판매량\\\"].dtype)\",\"answers\":[\"int\"],\"output\":\"int64\",\"explain\":\"문자열로 들어온 판매량을 정수로 변환합니다. 이제 판매량으로 합계·평균 계산이 가능해집니다. 정제 단계의 타입 정리 작업입니다.\"},{\"id\":\"m4\",\"prompt\":\"[정제] 매출 결측치를 평균으로 채우기\",\"code\":\"매출평균 = df[\\\"매출\\\"].mean()\\ndf[\\\"매출\\\"] = df[\\\"매출\\\"].______(매출평균)\\nprint(df[\\\"매출\\\"].isna().sum())\",\"answers\":[\"fillna\"],\"output\":\"0\",\"explain\":\"매출 결측치를 평균으로 채웁니다. 결측치를 제외한 6일 평균은 217000으로, 금요일의 빈 값이 이 값으로 채워집니다. 채운 뒤 결측치가 0이 되어 정제가 완료됩니다. 이제 매출 데이터를 온전히 분석에 쓸 수 있습니다.\"},{\"id\":\"m5\",\"prompt\":\"[집계] 평일/주말 구분별 평균 매출 구하기\",\"code\":\"print(df.groupby(\\\"구분\\\")[\\\"매출\\\"].______())\",\"answers\":[\"mean\"],\"output\":\"구분\\n주말    307500.0\\n평일    180800.0\\nName: 매출, dtype: float64\",\"explain\":\"구분별 평균 매출을 구해 평일과 주말을 비교합니다. 주말 평균(307500)이 평일(180800)보다 높다는 핵심 인사이트를 집계로 도출합니다. (평일 평균은 금요일 결측치를 전체 평균 217000으로 채운 값이 반영된 결과입니다.) 문제 정의(주말 효과 확인)에 대한 답입니다.\"},{\"id\":\"m6\",\"prompt\":\"[집계] 가장 매출이 높은 요일 찾기\",\"code\":\"top = df.sort_values(\\\"매출\\\", ascending=False)\\nprint(top.iloc[0][______])\",\"answers\":[\"\\\"요일\\\"\",\"'요일'\"],\"output\":\"토\",\"explain\":\"매출 내림차순 정렬 후 1위 요일을 찾습니다. 토요일(360000)이 최고 매출 요일입니다. 정렬과 행 선택을 조합해 핵심 결론을 뽑아냅니다.\"},{\"id\":\"m7\",\"prompt\":\"[시각화] 요일별 매출을 선 그래프로 그리기\",\"code\":\"import matplotlib.pyplot as plt\\nplt.______(df[\\\"요일\\\"

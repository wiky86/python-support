"Navbar\"]\nd:I[1060,[],\"\"]\n5:T97f,"])</script><script>self.__next_f.push([1,"## 인사이트를 그래프로 보여주기\n\n집계로 찾은 인사이트를 그래프로 표현하면, 발견한 패턴이 훨씬 설득력 있게 전달됩니다. 트랙6에서 배운 시각화를, 앞서 집계한 카페 데이터 결과에 적용하는 단계입니다. \"무엇을 보여줄지\"에 따라 그래프 종류를 고르는 것이 핵심입니다.\n\n카페 데이터입니다.\n\n```python\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\ndf = pd.DataFrame({\n    \"요일\": [\"월\", \"화\", \"수\", \"목\", \"금\", \"토\", \"일\"],\n    \"판매량\": [50, 45, 55, 48, 60, 90, 85],\n    \"매출\": [150000, 180000, 165000, 192000, 180000, 360000, 255000]\n})\n```\n\n## 요일별 매출 추세 -\u003e 선 그래프\n\n요일 순서에 따른 매출 변화를 봅니다.\n\n```python\nplt.plot(df[\"요일\"], df[\"매출\"], marker=\"o\")\nplt.title(\"요일별 매출 추이\")\nplt.xlabel(\"요일\")\nplt.ylabel(\"매출\")\nplt.show()\n```\n\n월요일부터 금요일까지 완만하다가 토·일에 크게 오르는 흐름이 나타나, \"주말에 매출이 급증\"하는 패턴이 한눈에 보입니다.\n\n## 요일별 판매량 비교 -\u003e 막대 그래프\n\n각 요일의 판매량 크기를 비교합니다.\n\n```python\nplt.bar(df[\"요일\"], df[\"판매량\"])\nplt.title(\"요일별 판매량\")\nplt.xlabel(\"요일\")\nplt.ylabel(\"판매량\")\nplt.show()\n```\n\n토요일 막대가 가장 높아 판매량이 주말에 몰린다는 걸 보여줍니다.\n\n## 집계 결과를 바로 그리기\n\ngroupby 결과도 바로 그래프로 그릴 수 있습니다.\n\n```python\n구분별매출 = df.groupby(\"구분\")[\"매출\"].mean()\nplt.bar(구분별매출.index, 구분별매출.values)\nplt.show()\n```\n\n집계(평일/주말 평균)를 막대로 그려 그룹 간 차이를 시각적으로 대비합니다.\n\n## 판매량과 매출의 관계 -\u003e 산점도\n\n두 값의 관계를 봅니다.\n\n```python\nplt.scatter(df[\"판매량\"], df[\"매출\"])\nplt.xlabel(\"판매량\")\nplt.ylabel(\"매출\")\nplt.show()\n```\n\n판매량이 많은 날은 매출도 높은, 오른쪽 위로 향하는 점 배치가 나타나 양의 관계를 확인할 수 있습니다.\n\n## 목적에 맞는 그래프 선택 (복습)\n\n| 보고 싶은 것 | 그래프 |\n|---|---|\n| 시간/순서에 따른 변화 | 선 그래프 |\n| 항목 간 비교 | 막대 그래프 |\n| 값의 분포 | 히스토그램 |\n| 두 값의 관계 | 산점도 |\n\n무엇을 보여주고 싶은지 정하면 그래프가 정해집니다."])</script><script>self.__next_f.push([1,"7:[\"trackId\",\"track7\",\"d\"]\n8:[\"topicId\",\"track7.visualization\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track7\",\"track7.visualization\",\"\"],\"initialTree\":[\"\",{\"childre  비교는 막대 그래프(bar)가 적합합니다. 막대 높이를 비교해 어느 요일에 많이 팔렸는지 한눈에 파악할 수 있습니다.\"},{\"id\":\"fb3\",\"prompt\":\"그래프에 요일별 매출 추이 제목을 붙이세요.\",\"code\":\"import matplotlib.pyplot as plt\\nplt.plot([150000, 180000, 165000])\\nplt.______(\\\"요일별 매출 추이\\\")\\nplt.show()\",\"answers\":[\"title\"],\"output\":\"\\\"요일별 매출 추이\\\"라는 제목이 붙은 선 그래프가 그려집니다.\",\"explain\":\"title()로 그래프에 제목을 붙여 무엇을 보여주는 그래프인지 명확히 합니다. 분석 결과를 남에게 전달할 때는 제목·축 이름을 갖추는 것이 중요합니다.\"},{\"id\":\"fb4\",\"prompt\":\"판매량과 매출의 관계를 산점도로 그리세요.\",\"code\":\"import matplotlib.pyplot as plt\\n판매량 = [50, 45, 55, 90, 85]\\n매출 = [150000, 180000, 165000, 360000, 255000]\\nplt.______(판매량, 매출)\\nplt.show()\",\"answers\":[\"scatter\"],\"output\":\"판매량(x)과 매출(y)의 관계를 보여주는 산점도가 그려집니다. 판매량이 많은 점일수록 매출도 높아 오른쪽 위로 향하는 배치가 나타납니다.\",\"explain\":\"두 값(판매량, 매출)의 관계는 산점도(scatter)로 봅니다. 점들이 오른쪽 위로 향하면 판매량이 많을수록 매출도 높은 양의 관계입니다. 두 변수가 함께 움직이는지 확인할 때 씁니다.\"},{\"id\":\"fb5\",\"prompt\":\"평일과 주말의 평균 매출을 비교하려면 어떤 그래프가 적합할까요? (한 단어: 선, 막대, 산점도)\",\"code\":\"# 인사이트: \\\"평일과 주말의 평균 매출을 비교하고 싶다\\\"\\n# (두 항목의 크기 비교)\\n# 적합한 그래프는?\",\"answers\":[\"막대\",\"막대 그래프\"],\"output\":\"막대\",\"explain\":\"평일과 주말이라는 두 항목의 크기(평균 매출)를 비교하는 것이므로 막대 그래프가 적합합니다. 두 막대의 높이 차이로 주말이 평일보다 얼마나 높은지 시각적으로 대비할 수 있습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"집계로 찾은 인사이트를 시각화하는 이유는?\",\"options\":[\"데이터를 지우려고\",\"발견한 패턴을 설득력 있게 전달하려고\",\"계산을 다시 하려고\",\"결측치를 만들려고\"],\"answer\":1,\"explain\":\"시각화는 집계로 찾은 패턴을 한눈에 보이게 해 설득력 있게 전달합니다. 숫자보다 그래프가 이해와 전달에 효과적입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"요일 순서에 따른 매출 변화를 보기에 적합한 그래프는?\",\"options\":[\"산점도\",\"히스토그램\",\"선 그래프\",\"원 그래프\"],\"answer\":2,\"explain\":\"시간·순서에 따른 변화(추세)는 선 그래프가 적합합니다. 주말에 매출이 오르는 흐름이 선으로 드러납니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"평일 vs 주말 평균 매출 비교에 적합한 그래프는?\",\"options\":[\"선 그래프\",\"막대 그래프\",\"산점도\",\"히스토그램\"],\"answer\":1,\"explain\":\"두 항목(평일/주말)의 크기 비교는 막대 그래프가 적합합니다. 막대 높이로 차이를 대비합니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"판매량과 매출의 관계를 보기에 적합한

"Navbar\"]\nd:I[1060,[],\"\"]\n5:T9b1,"])</script><script>self.__next_f.push([1,"## 데이터 분석은 순서가 있다\n\n지금까지 파이썬 기초, NumPy, pandas, 그룹화, 시각화를 하나씩 배웠습니다. 실제 분석에서는 이것들을 정해진 흐름으로 엮어 씁니다. 이 트랙에서는 그 전체 흐름을 하나의 데이터로 처음부터 끝까지 경험합니다.\n\n## 데이터 분석의 6단계\n\n| 단계 | 하는 일 | 사용 기술 |\n|---|---|---|\n| 1. 문제 정의 | 무엇을 알고 싶은지 정하기 | (생각) |\n| 2. 탐색 | 데이터가 어떻게 생겼는지 살피기 | shape, head, info |\n| 3. 정제 | 결측치·중복·타입 정리 | fillna, drop_duplicates, astype |\n| 4. 집계 | 그룹별로 요약해 패턴 찾기 | groupby, agg, pivot_table |\n| 5. 시각화 | 그래프로 표현 | plot, bar, hist |\n| 6. 해석 | 결과에서 의미 끌어내기 | (생각) |\n\n이 순서가 데이터 분석의 기본 뼈대입니다.\n\n## 1단계: 문제 정의가 가장 중요하다\n\n분석을 시작하기 전에 \"무엇을 알고 싶은가?\"를 먼저 정해야 합니다. 목표가 없으면 데이터를 봐도 무엇을 찾아야 할지 막막합니다. 좋은 분석은 좋은 질문에서 시작합니다.\n\n## 이 트랙의 데이터: 가상 카페 판매 기록\n\n```python\nimport pandas as pd\ndf = pd.DataFrame({\n    \"날짜\": [\"1일\", \"2일\", \"3일\", \"4일\", \"5일\", \"6일\", \"7일\"],\n    \"요일\": [\"월\", \"화\", \"수\", \"목\", \"금\", \"토\", \"일\"],\n    \"메뉴\": [\"아메리카노\", \"라떼\", \"아메리카노\", \"라떼\", \"아메리카노\", \"라떼\", \"아메리카노\"],\n    \"판매량\": [50, 45, 55, 48, 60, 90, 85],\n    \"매출\": [150000, 180000, 165000, 192000, 180000, 360000, 255000]\n})\n```\n\n이 카페 사장님이 알고 싶은 것은 이런 질문들일 수 있습니다.\n- \"어느 요일에 가장 많이 팔릴까?\" (요일별 패턴)\n- \"주말이 평일보다 매출이 높을까?\"\n- \"판매량이 많은 날은 매출도 높을까?\"\n\n## 질문에 따라 쓰는 기술이 달라진다\n\n- \"요일별 매출\" -\u003e groupby (집계)\n- \"매출 추세\" -\u003e 선 그래프 (시각화)\n- \"판매량과 매출의 관계\" -\u003e 산점도 (시각화)\n\n문제를 정의하면, 어떤 기술을 써야 할지 자연스럽게 정해집니다. 그래서 문제 정의가 먼저입니다.\n\n## 분석의 목표 문장 만들기\n\n좋은 분석 목표는 구체적입니다. \"카페를 분석한다\"가 아니라 \"요일별 매출을 비교해 가장 매출이 높은 요일을 찾는다\"처럼 명확하게 정합니다."])</script><script>self.__next_f.push([1,"7:[\"trackId\",\"track7\",\"d\"]\n8:[\"topicId\",\"track7.workflow\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track7\",\"track7.workflow\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track7\",\"d\"],{\"children\":[[\ )\",\"code\":\"# 질문: 어느 요일에 매출이 가장 높을까?\\n# 어떤 기술이 적합할까?\",\"answers\":[\"groupby\"],\"output\":\"groupby\",\"explain\":\"\\\"요일별\\\"처럼 특정 기준으로 묶어 비교하는 질문에는 groupby(그룹 집계)가 적합합니다. 문제(요일별 매출)를 정의하면 써야 할 기술(groupby)이 자연스럽게 정해집니다. 이것이 문제 정의를 먼저 하는 이유입니다.\"},{\"id\":\"fb4\",\"prompt\":\"매출 열의 자료형을 확인하세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"매출\\\": [150000, 180000, 165000]})\\nprint(df[\\\"매출\\\"].______)\",\"answers\":[\"dtype\"],\"output\":\"int64\",\"explain\":\"탐색 단계에서 각 열의 자료형을 확인하는 것도 중요합니다. 매출이 int64(정수)로 잘 들어와 있으면 바로 계산할 수 있고, 만약 문자열(object)이면 정제 단계에서 변환이 필요합니다.\"},{\"id\":\"fb5\",\"prompt\":\"데이터 분석의 6단계 중 가장 먼저 오는 단계는? (한 단어: 문제정의, 시각화, 집계)\",\"code\":\"# 데이터 분석에서 가장 먼저 해야 할 단계는?\",\"answers\":[\"문제정의\",\"문제 정의\"],\"output\":\"문제정의\",\"explain\":\"데이터 분석은 \\\"무엇을 알고 싶은가?\\\"를 정하는 문제 정의에서 시작합니다. 목표가 명확해야 어떤 데이터를 어떻게 다룰지 정할 수 있습니다. 탐색·정제·집계·시각화·해석은 모두 그 다음 단계입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"데이터 분석에서 가장 먼저 해야 할 일은?\",\"options\":[\"그래프 그리기\",\"무엇을 알고 싶은지 문제 정의\",\"결측치 제거\",\"그룹 집계\"],\"answer\":1,\"explain\":\"분석은 문제 정의에서 시작합니다. 목표가 있어야 어떤 데이터를 어떻게 분석할지 정할 수 있습니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"데이터 분석의 일반적인 순서로 옳은 것은?\",\"options\":[\"시각화 -\u003e 정제 -\u003e 탐색\",\"문제 정의 -\u003e 탐색 -\u003e 정제 -\u003e 집계 -\u003e 시각화 -\u003e 해석\",\"집계 -\u003e 문제 정의 -\u003e 탐색\",\"정제 -\u003e 해석 -\u003e 탐색\"],\"answer\":1,\"explain\":\"문제 정의 -\u003e 탐색 -\u003e 정제 -\u003e 집계 -\u003e 시각화 -\u003e 해석이 기본 흐름입니다. 각 단계가 다음 단계의 토대가 됩니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"데이터를 처음 열어 크기와 내용을 파악하는 단계는?\",\"options\":[\"문제 정의\",\"탐색\",\"시각화\",\"해석\"],\"answer\":1,\"explain\":\"탐색 단계에서 shape, head, info 등으로 데이터가 어떻게 생겼는지 살핍니다. 본격 분석 전 데이터를 이해하는 과정입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"\\\"요일별 매출을 비교하고 싶다\\\"에 가장 적합한 기술은?\",\"options\":[\"scatter(산점도)\",\"groupby(그룹 집계)\",\"fillna(결측치 채우기)\",\"astype(타입 변환)\"],\"answer\":1,\"explain\":\"\\\"~별 비교\\\"는 groupby로 그룹을 묶어 집계하는 것이 적합합니다. 문제를 정

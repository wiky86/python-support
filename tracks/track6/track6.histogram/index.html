"Navbar\"]\nc:I[1060,[],\"\"]\n6:[\"trackId\",\"track6\",\"d\"]\n7:[\"topicId\",\"track6.histogram\",\"d\"]\nd:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track6\",\"track6.histogram\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"track6.histogram\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track6\\\",\\\"topicId\\\":\\\"track6.histogram\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"track6.histogram\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"track\":{\"id\":\"track6\",\"order\":6,\"title\":\"데이터 시각화\",\"description\":\"분석 결과를 그래프로 표현하는 방법을 익힙니다. 목적에 맞는 그래프 선택이 핵심입니다.\",\"topicOrder\":[\"track6.why\",\"track6.line\",\"track6.bar\",\"track6.histogram\",\"track6.scatter\",\"track6.decorate\"],\"topicFiles\":[\"topics/t1-why.json\",\"topics/t2-line.json\",\"topics/t3-bar.json\",\"topics/t4-histogram.json\",\"topics/t5-scatter.json\",\"topics/t6-decorate.json\"],\"projectFile\":\"project.json\"},\"topic\":{\"id\":\"track6.histogram\",\"trackId\":\"track6\",\"order\":4,\"title\":\"히스토그램 (분포)\",\"content\":\"## 히스토그램은 언제?\\n\\n히스토그램은 값이 어떤 구간에 얼마나 몰려 있는지(분포)를 볼 때 씁니다. \\\"학생들의 점수가 주로 어디에 몰려 있나\\\", \\\"고객 나이대가 어떻게 퍼져 있나\\\"처럼 하나의 값이 어떻게 분포하는지 파악할 때 적합합니다.\\n\\n## 막대 그래프와 다르다\\n\\n막대 그래프는 \\\"항목별 값\\\"을 비교하지만, 히스토그램은 \\\"값의 범위별 개수\\\"를 보여줍니다. 히스토그램의 막대는 \\\"이 구간에 데이터가 몇 개 있는지\\\"를 나타냅니다.\\n\\n## 기본 히스토그램 — plt.hist()\\n\\n```python\\nimport matplotlib.pyplot as plt\\n\\n점수 = [55, 60, 62, 70, 72, 75, 78, 80, 85, 90]\\nplt.hist(점수)\\nplt.show()\\n```\\n\\n`plt.hist(데이터)`는 값들을 자동으로 몇 개의 구간으로 나누고, 각 구간에 몇 개의 값이 들어가는지 막대로 보여줍니다. 점수가 70~80 구간에 몰려 있다면 그 구간의 막대가 가장 높게 나타납니다.\\n\\n## 구간 개수 조절 — bins\\n\\n`bins`로 구간을 몇 개로 나눌지 정합니다. 값이 클수록 더 잘게 나뉩니다.\\n\\n```python\\nplt.hist(점수, bins=5)      # 5개 구간으로 나눔\\n```\\n\\nbins를 크게 하면 세밀하게, 작게 하면 큰 덩어리로 분포를 봅니다.\\n\\n## 히스토그램 읽는 법\\n\\n- x축: 값의 구간 (예: 50~60, 60~70...)\\n- y축: 그 구간에 속한 데이터의 개수(빈도)\\n- 막대가 높은 구간 = 데이터가 많이 몰린 곳\\n\\n## 어디에 쓰나?\\n\\n시험 점수 분포로 \\\"대부분 몇 점대인가\\\", 나이 분포로 \\\"주 고객층이 몇 살대인가\\\"를 볼 때 씁니다. 평균만으로는 안 보이는 \\\"퍼짐\\\"과 \\\"치우침\\\"을 확인할 수 있습니다.\\n\\n## 색과 구간 함께 지정\\n\\n```python\\nplt.hist(점수, bins=5, color=\\\"green\\\")\\n```\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"점수 데이터의 분포를 히스토그램으로 그리세요.\",\"code\":\"import matplotlib.pyplot as plt\\n점수 = [55, 62, 70, 72, 75, 78, 85, 90]\\nplt.______(점수)\\nplt.show()\",\"answers\":[\"hist\"],\"output\":\"점수 값들이 여러 구간으로 나뉘어, 각 구간에 몇 개의 점수가 있는지 막대 높이로 표시된 히스토그램이 그려집니다. 70대 구간에 값이 몰려 그 부분 막대가 높게 나타납니다.\",\"explain\":\"plt.hist(데이터)는 값들을 자동으로 구간으로 나누고 각 구간의 개수를 막대로 보여줍니다. 값의 분포(어디에 몰려 있는지)를 파악할 때 쓰는 그래프입니다.\"},{\"id\":\"fb2\",\"prompt\":\"구간을 5개로 나누세요.\",\"code\":\"import matplotlib.pyplot as plt\\n점수 = [55, 62, 70, 72, 75, 78, 85, 90]\\nplt.hist(점수, ______=5)\\nplt.show()\",\"answers\":[\"bins\"],\"output\":\"점수 범위가 5개의 구간으로 나뉜 히스토그램이 그려집니다. 구간이 5개로 정해져 각 구간의 데이터 개수를 막대로 보여줍니다.\",\"explain\":\"bins=5는 값의 범위를 5개 구간으로 나눕니다. bins를 크게 하면 더 세밀하게, 작게 하면 큰 덩어리로 분포를 봅니다. 지정하지 않으면 matplotlib이 자동으로 구간 수를 정합니다.\"},{\"id\":\"fb3\",\"prompt\":\"히스토그램의 x축이 나타내는 것은? (한 단어: 구간, 개수)\",\"code\":\"# plt.hist(점수)로 그린 히스토그램에서\\n# x축은 무엇을 나타낼까?\",\"answers\":[\"구간\"],\"output\":\"구간\",\"explain\":\"히스토그램의 x축은 값의 구간(예: 50~60, 60~70)을, y축은 그 구간에 속한 데이터의 개수(빈도)를 나타냅니다. 막대가 높은 구간일수록 그 범위에 데이터가 많이 몰려 있다는 뜻입니다.\"},{\"id\":\"fb4\",\"prompt\":\"히스토그램 색을 초록색으로 지정하세요.\",\"code\":\"import matplotlib.pyplot as plt\\n점수 = [55, 70, 72, 85]\\nplt.hist(점수, bins=4, ______=\\\"green\\\")\\nplt.show()\",\"answers\":[\"color\"],\"output\":\"초록색 막대로 그려진 히스토그램이 나타납니다.\",\"explain\":\"color=\\\"green\\\"은 히스토그램 막대의 색을 초록색으로 지정합니다. plot, bar와 동일한 color 옵션이 히스토그램에도 똑같이 적용됩니다.\"},{\"id\":\"fb5\",\"prompt\":\"학생 점수가 주로 몇 점대에 몰려 있는지 보려면? (한 단어: 선, 막대, 히스토그램)\",\"code\":\"# 우리 반 학생들의 시험 점수가\\n# 주로 몇 점대에 몰려 있는지 보고 싶다\\n# 적합한 그래프는?\",\"answers\":[\"히스토그램\"],\"output\":\"히스토그램\",\"explain\":\"값(점수)이 어떤 구간에 얼마나 몰려 있는지(분포)를 보는 것이므로 히스토그램이 적합합니다. 항목 비교(막대)나 시간 변화(선)가 아니라, 하나의 값이 어떻게 퍼져 있는지를 보는 상황입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"히스토그램이 보여주는 것은?\",\"options\":[\"시간에 따른 변화\",\"값의 분포(구간별 개수)\",\"항목 간 비교\",\"두 변수의 관계\"],\"answer\":1,\"explain\":\"히스토그램은 값이 어떤 구간에 얼마나 몰려 있는지(분포)를 보여줍니다. 각 막대는 그 구간에 속한 데이터 개수입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"히스토그램을 그리는 함수는?\",\"options\":[\"plt.bar()\",\"plt.hist()\",\"plt.plot()\",\"plt.scatter()\"],\"answer\":1,\"explain\":\"plt.hist()가 히스토그램을 그립니다. bar는 막대 그래프로, 둘은 다릅니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"히스토그램의 y축이 나타내는 것은?\",\"options\":[\"값 자체\",\"그 구간에 속한 데이터 개수(빈도)\",\"평균\",\"시간\"],\"answer\":1,\"explain\":\"히스토그램의 y축은 각 구간에 속한 데이터의 개수(빈도)입니다. x축이 구간, y축이 개수입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"bins 옵션이 정하는 것은?\",\"options\":[\"색\",\"구간의 개수\",\"그래프 크기\",\"제목\"],\"answer\":1,\"explain\":\"bins는 값의 범위를 몇 개 구간으로 나눌지 정합니다. 크게 하면 세밀하게, 작게 하면 큰 덩어리로 분포를 봅니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"막대 그래프와 히스토그램의 차이로 옳은 것은?\",\"options\":[\"완전히 같다\",\"막대는 항목별 값, 히스토그램은 구간별 개수\",\"히스토그램은 선으로 그린다\",\"막대는 분포를 본다\"],\"answer\":1,\"explain\":\"막대 그래프는 서로 다른 항목의 값을 비교하고, 히스토그램은 하나의 값이 구간별로 얼마나 분포하는지(개수)를 보여줍니다.\"}]},\"faq\":[{\"q\":\"막대 그래프랑 히스토그램이 비슷해 보여요.\",\"a\":\"생김새는 비슷하지만 목적이 달라요. 막대는 서울 vs 부산 같은 항목 비교, 히스토그램은 점수가 어느 구간에 몰렸나 같은 분포를 봐요. 히스토그램의 막대는 개수를 나타냅니다.\"},{\"q\":\"bins를 몇 개로 해야 하나요?\",\"a\":\"정답은 없어요. 너무 적으면 뭉뚱그려지고, 너무 많으면 들쭉날쭉해져요. 데이터가 적으면 5~10개 정도로 시작해 보면서 조절하는 게 좋습니다.\"},{\"q\":\"왜 평균 대신 히스토그램을 보나요?\",\"a\":\"평균은 하나의 숫자라 퍼짐이나 치우침을 못 보여줘요. 예를 들어 평균 70점이어도, 다 70점 근처인지 아니면 50점과 90점으로 갈렸는지는 히스토그램을 봐야 알 수 있어요.\"},{\"q\":\"히스토그램에 넣는 데이터는 어떤 형태인가요?\",\"a\":\"숫자 값들의 리스트나 열 하나예요. 예를 들어 학생 점수 리스트, DataFrame의 나이 열 같은 것을 넣으면 그 값들의 분포를 그려줍니다.\"}]},\"allT

"Navbar\"]\nc:I[1060,[],\"\"]\n6:[\"trackId\",\"track6\",\"d\"]\n7:[\"topicId\",\"track6.scatter\",\"d\"]\nd:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track6\",\"track6.scatter\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"track6.scatter\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track6\\\",\\\"topicId\\\":\\\"track6.scatter\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"track6.scatter\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"track\":{\"id\":\"track6\",\"order\":6,\"title\":\"데이터 시각화\",\"description\":\"분석 결과를 그래프로 표현하는 방법을 익힙니다. 목적에 맞는 그래프 선택이 핵심입니다.\",\"topicOrder\":[\"track6.why\",\"track6.line\",\"track6.bar\",\"track6.histogram\",\"track6.scatter\",\"track6.decorate\"],\"topicFiles\":[\"topics/t1-why.json\",\"topics/t2-line.json\",\"topics/t3-bar.json\",\"topics/t4-histogram.json\",\"topics/t5-scatter.json\",\"topics/t6-decorate.json\"],\"projectFile\":\"project.json\"},\"topic\":{\"id\":\"track6.scatter\",\"trackId\":\"track6\",\"order\":5,\"title\":\"산점도 (관계)\",\"content\":\"## 산점도는 언제?\\n\\n산점도(scatter plot)는 두 변수 사이의 관계를 볼 때 씁니다. \\\"공부 시간과 점수는 관계가 있을까?\\\", \\\"광고비와 매출은?\\\"처럼 두 값이 함께 어떻게 움직이는지 점으로 찍어 확인합니다. 각 점 하나가 데이터 하나(예: 학생 한 명)를 나타냅니다.\\n\\n## 기본 산점도 — plt.scatter()\\n\\n```python\\nimport matplotlib.pyplot as plt\\n\\n공부시간 = [1, 2, 3, 4, 5]\\n점수 = [50, 55, 65, 75, 90]\\nplt.scatter(공부시간, 점수)\\nplt.show()\\n```\\n\\n`plt.scatter(x, y)` 형태로 두 데이터를 줍니다. 각 점은 (공부시간, 점수) 짝을 나타냅니다. 위 데이터는 공부시간이 늘수록 점수도 오르는 점들의 배치가 나타나, 두 값이 양의 관계임을 보여줍니다.\\n\\n## 산점도로 관계 읽기\\n\\n- 점들이 오른쪽 위로 향하면 -\u003e 양의 관계 (하나가 크면 다른 것도 큼)\\n- 점들이 오른쪽 아래로 향하면 -\u003e 음의 관계 (하나가 크면 다른 것은 작음)\\n- 점들이 흩어져 규칙이 없으면 -\u003e 관계가 약함\\n\\n## 점 크기·색 지정\\n\\n```python\\nplt.scatter(공부시간, 점수, color=\\\"red\\\")     # 빨간 점\\nplt.scatter(공부시간, 점수, s=100)            # 점 크기 키우기\\n```\\n\\n`s`는 점의 크기(size)를 정합니다.\\n\\n## 선 그래프와 다르다\\n\\n선 그래프는 점들을 순서대로 이어 \\\"흐름\\\"을 보지만, 산점도는 점을 잇지 않고 흩뿌려 \\\"관계\\\"를 봅니다. 시간 순서가 중요하면 선, 두 값의 관계가 궁금하면 산점도입니다.\\n\\n## pandas와 함께\\n\\n```python\\nplt.scatter(df[\\\"공부시간\\\"], df[\\\"점수\\\"])\\nplt.show()\\n```\\n\\n두 열을 각각 x, y로 넣으면 두 열의 관계를 산점도로 볼 수 있습니다.\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"공부시간과 점수의 관계를 산점도로 그리세요.\",\"code\":\"import matplotlib.pyplot as plt\\n공부시간 = [1, 2, 3, 4, 5]\\n점수 = [50, 55, 65, 75, 90]\\nplt.______(공부시간, 점수)\\nplt.show()\",\"answers\":[\"scatter\"],\"output\":\"다섯 개의 점이 흩뿌려진 산점도가 그려집니다. 공부시간이 늘수록 점수도 높아져 점들이 오른쪽 위로 향하는 배치가 나타납니다.\",\"explain\":\"plt.scatter(x, y)는 두 값의 짝을 점으로 찍어 산점도를 그립니다. 각 점이 (공부시간, 점수) 하나를 나타냅니다. 점들이 오른쪽 위로 향하면 두 값이 함께 커지는 양의 관계입니다.\"},{\"id\":\"fb2\",\"prompt\":\"산점도의 x축 데이터를 채우세요.\",\"code\":\"import matplotlib.pyplot as plt\\n광고비 = [10, 20, 30, 40]\\n매출 = [100, 150, 220, 300]\\nplt.scatter(______, 매출)\\nplt.show()\",\"answers\":[\"광고비\"],\"output\":\"광고비(x축)와 매출(y축)의 관계를 보여주는 산점도가 그려집니다. 광고비가 늘수록 매출도 오르는 점 배치가 나타납니다.\",\"explain\":\"scatter(x, y)에서 첫 번째 인자가 x축입니다. 광고비를 x, 매출을 y로 두면 \\\"광고비에 따라 매출이 어떻게 변하는지\\\"를 점으로 볼 수 있습니다.\"},{\"id\":\"fb3\",\"prompt\":\"점의 색을 빨간색으로 지정하세요.\",\"code\":\"import matplotlib.pyplot as plt\\nx = [1, 2, 3]\\ny = [4, 5, 6]\\nplt.scatter(x, y, ______=\\\"red\\\")\\nplt.show()\",\"answers\":[\"color\"],\"output\":\"빨간색 점으로 그려진 산점도가 나타납니다.\",\"explain\":\"color=\\\"red\\\"는 점의 색을 빨간색으로 지정합니다. 여러 그룹의 데이터를 다른 색으로 구분해 한 산점도에 그릴 때 특히 유용합니다.\"},{\"id\":\"fb4\",\"prompt\":\"점의 크기를 키우세요.\",\"code\":\"import matplotlib.pyplot as plt\\nx = [1, 2, 3]\\ny = [4, 5, 6]\\nplt.scatter(x, y, ______=100)\\nplt.show()\",\"answers\":[\"s\"],\"output\":\"점이 크게 표시된 산점도가 그려집니다.\",\"explain\":\"s는 점의 크기(size)를 정합니다. 값이 클수록 점이 커집니다. 점이 너무 작아 안 보이거나, 특정 데이터를 강조하고 싶을 때 크기를 조절합니다.\"},{\"id\":\"fb5\",\"prompt\":\"키와 몸무게 사이에 관계가 있는지 보려면? (한 단어: 선, 산점도)\",\"code\":\"# 키와 몸무게 사이에 관계가 있는지 보고 싶다\\n# 적합한 그래프는?\",\"answers\":[\"산점도\"],\"output\":\"산점도\",\"explain\":\"두 변수(키, 몸무게) 사이의 관계를 보는 것이므로 산점도가 적합합니다. 각 사람을 점 하나로 찍어 키가 클수록 몸무게도 느는지 등의 관계를 확인합니다. 시간에 따른 변화가 아니므로 선 그래프는 맞지 않습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"산점도가 가장 적합한 경우는?\",\"options\":[\"시간에 따른 변화\",\"두 변수 사이의 관계\",\"항목 간 비교\",\"값의 분포\"],\"answer\":1,\"explain\":\"산점도는 두 변수가 함께 어떻게 움직이는지(관계)를 봅니다. 변화는 선, 비교는 막대, 분포는 히스토그램입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"산점도를 그리는 함수는?\",\"options\":[\"plt.plot()\",\"plt.bar()\",\"plt.scatter()\",\"plt.hist()\"],\"answer\":2,\"explain\":\"plt.scatter()가 산점도를 그립니다. 두 값의 짝을 점으로 찍습니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"산점도에서 점들이 오른쪽 위로 향하면?\",\"options\":[\"음의 관계\",\"양의 관계\",\"관계 없음\",\"에러\"],\"answer\":1,\"explain\":\"점들이 오른쪽 위로 향하면 하나가 커질 때 다른 것도 커지는 양의 관계입니다. 오른쪽 아래면 음의 관계입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"산점도에서 점 하나가 나타내는 것은?\",\"options\":[\"전체 평균\",\"데이터 하나(두 값의 짝)\",\"구간\",\"항목 이름\"],\"answer\":1,\"explain\":\"산점도의 점 하나는 (x, y) 두 값의 짝, 즉 데이터 하나(예: 학생 한 명의 공부시간과 점수)를 나타냅니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"점의 크기를 조절하는 옵션은?\",\"options\":[\"color\",\"s\",\"bins\",\"marker\"],\"answer\":1,\"explain\":\"s가 점의 크기(size)를 정합니다. color는 색, bins는 히스토그램 구간 수입니다.\"}]},\"faq\":[{\"q\":\"산점도랑 선 그래프는 뭐가 다른가요?\",\"a\":\"선 그래프는 점들을 순서대로 이어 흐름을 보고, 산점도는 점을 잇지 않고 흩뿌려 관계를 봐요. 시간 순서가 중요하면 선, 두 값의 관계가 궁금하면 산점도입니다.\"},{\"q\":\"관계가 있는지 어떻게 판단하나요?\",\"a\":\"점들이 일정한 방향(오른쪽 위나 아래)으로 모여 있으면 관계가 있는 거예요. 아무 규칙 없이 흩어져 있으면 관계가 약하다고 봅니다. 눈으로 대략적인 경향을 읽는 거죠.\"},{\"q\":\"양의 관계, 음의 관계가 뭔가요?\",\"a\":\"양의 관계는 하나가 커지면 다른 것도 커지는 것(공부시간 늘면 점수 늘고), 음의 관계는 하나가 커지면 다른 것은 작아지는 것(가격 오르면 판매량 줄고)이에요.\"},{\"q\":\"관계가 있다고 원인-결과인가요?\",\"a\":\"아니에요. 산점도로 관계(같이 움직임)는 볼 수 있지만, 그게 원인과 결과라는 뜻은 아니에요. 이건 데이터 분석에서 아주 중요한 구분인데, 더 깊은 통계에서 다룹니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기

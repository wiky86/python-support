"Navbar\"]\nc:I[1060,[],\"\"]\n6:[\"trackId\",\"track6\",\"d\"]\n7:[\"topicId\",\"track6.bar\",\"d\"]\nd:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track6\",\"track6.bar\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"track6.bar\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track6\\\",\\\"topicId\\\":\\\"track6.bar\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"track6.bar\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"track\":{\"id\":\"track6\",\"order\":6,\"title\":\"데이터 시각화\",\"description\":\"분석 결과를 그래프로 표현하는 방법을 익힙니다. 목적에 맞는 그래프 선택이 핵심입니다.\",\"topicOrder\":[\"track6.why\",\"track6.line\",\"track6.bar\",\"track6.histogram\",\"track6.scatter\",\"track6.decorate\"],\"topicFiles\":[\"topics/t1-why.json\",\"topics/t2-line.json\",\"topics/t3-bar.json\",\"topics/t4-histogram.json\",\"topics/t5-scatter.json\",\"topics/t6-decorate.json\"],\"projectFile\":\"project.json\"},\"topic\":{\"id\":\"track6.bar\",\"trackId\":\"track6\",\"order\":3,\"title\":\"막대 그래프 (비교)\",\"content\":\"## 막대 그래프는 언제?\\n\\n막대 그래프는 항목 간 크기를 비교할 때 씁니다. \\\"지점별 매출\\\", \\\"제품별 판매량\\\", \\\"부서별 인원\\\"처럼 서로 다른 항목의 값을 나란히 놓고 어느 것이 크고 작은지 볼 때 적합합니다. 선 그래프가 \\\"흐름\\\"이라면 막대 그래프는 \\\"비교\\\"입니다.\\n\\n## 기본 막대 그래프 — plt.bar()\\n\\n```python\\nimport matplotlib.pyplot as plt\\n\\n지점 = [\\\"서울\\\", \\\"부산\\\", \\\"대구\\\"]\\n매출 = [330, 240, 180]\\nplt.bar(지점, 매출)\\nplt.show()\\n```\\n\\n`plt.bar(항목, 값)` 형태로, 첫 번째가 x축 항목(막대 이름), 두 번째가 막대 높이(값)입니다. 서울·부산·대구 세 개의 막대가 높이 차이로 나타나, 서울이 가장 높다는 걸 바로 알 수 있습니다.\\n\\n## 가로 막대 그래프 — plt.barh()\\n\\n`barh`를 쓰면 막대가 가로로 눕습니다. 항목 이름이 길 때 읽기 편합니다.\\n\\n```python\\nplt.barh(지점, 매출)\\nplt.show()\\n```\\n\\n## 막대 색 지정\\n\\n```python\\nplt.bar(지점, 매출, color=\\\"skyblue\\\")\\n```\\n\\n`color`로 막대 색을 지정할 수 있습니다.\\n\\n## 정렬해서 그리면 더 보기 좋다\\n\\n막대 그래프는 값 순으로 정렬하면 비교가 더 쉽습니다. 앞 트랙에서 배운 정렬을 활용합니다.\\n\\n```python\\ndf_sorted = df.sort_values(\\\"매출\\\", ascending=False)\\nplt.bar(df_sorted[\\\"지점\\\"], df_sorted[\\\"매출\\\"])\\nplt.show()\\n```\\n\\n높은 순으로 정렬된 막대는 순위를 한눈에 보여줍니다.\\n\\n## 선 그래프와 헷갈리지 않기\\n\\n시간 순서 데이터(월별 변화)는 선, 서로 다른 항목 비교(지점별)는 막대입니다. 예를 들어 \\\"1월~5월 매출 변화\\\"는 선, \\\"서울·부산·대구 매출\\\"은 막대가 맞습니다.\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"지점별 매출을 막대 그래프로 그리세요.\",\"code\":\"import matplotlib.pyplot as plt\\n지점 = [\\\"서울\\\", \\\"부산\\\", \\\"대구\\\"]\\n매출 = [330, 240, 180]\\nplt.______(지점, 매출)\\nplt.show()\",\"answers\":[\"bar\"],\"output\":\"서울·부산·대구 세 개의 세로 막대가 그려집니다. 서울(330)이 가장 높고 대구(180)가 가장 낮은 형태로, 지점 간 매출 차이가 한눈에 보입니다.\",\"explain\":\"plt.bar(항목, 값)은 세로 막대 그래프를 그립니다. 첫 번째 인자가 x축 항목(막대 이름), 두 번째가 막대 높이입니다. 서로 다른 항목의 크기를 비교할 때 씁니다.\"},{\"id\":\"fb2\",\"prompt\":\"막대 그래프의 첫 번째 인자(x축 항목)를 채우세요.\",\"code\":\"import matplotlib.pyplot as plt\\n제품 = [\\\"A\\\", \\\"B\\\", \\\"C\\\"]\\n판매량 = [50, 80, 30]\\nplt.bar(______, 판매량)\\nplt.show()\",\"answers\":[\"제품\"],\"output\":\"A·B·C 세 제품의 판매량 막대가 그려지며, B(80)가 가장 높습니다.\",\"explain\":\"bar의 첫 번째 인자는 x축에 놓일 항목 이름입니다. 제품을 넣으면 각 막대 아래에 A·B·C가 표시되고, 두 번째 인자인 판매량이 막대 높이가 됩니다.\"},{\"id\":\"fb3\",\"prompt\":\"가로 막대 그래프를 그리세요.\",\"code\":\"import matplotlib.pyplot as plt\\n지점 = [\\\"서울\\\", \\\"부산\\\"]\\n매출 = [330, 240]\\nplt.______(지점, 매출)\\nplt.show()\",\"answers\":[\"barh\"],\"output\":\"서울·부산의 매출이 가로로 누운 막대로 그려집니다. 항목 이름이 세로축(왼쪽)에, 값이 가로 길이로 표시됩니다.\",\"explain\":\"plt.barh()는 가로 막대 그래프를 그립니다(h는 horizontal). 항목 이름이 길거나 개수가 많을 때 세로 막대보다 읽기 편합니다. 값이 클수록 막대가 오른쪽으로 길어집니다.\"},{\"id\":\"fb4\",\"prompt\":\"막대 색을 하늘색으로 지정하세요.\",\"code\":\"import matplotlib.pyplot as plt\\n지점 = [\\\"서울\\\", \\\"부산\\\"]\\n매출 = [330, 240]\\nplt.bar(지점, 매출, ______=\\\"skyblue\\\")\\nplt.show()\",\"answers\":[\"color\"],\"output\":\"하늘색 막대로 그려진 막대 그래프가 나타납니다.\",\"explain\":\"color=\\\"skyblue\\\"는 막대 색을 하늘색으로 지정합니다. 선 그래프의 color 옵션과 동일하게 작동하며, 색 이름이나 색 코드를 넣을 수 있습니다. 강조하고 싶은 막대의 색만 다르게 줄 수도 있습니다.\"},{\"id\":\"fb5\",\"prompt\":\"세 도시의 인구를 비교하려면 어떤 그래프가 적합할까요? (한 단어: 선, 막대)\",\"code\":\"# 서울, 부산, 대구 세 도시의 인구를 비교하고 싶다\\n# 적합한 그래프는?\",\"answers\":[\"막대\",\"막대 그래프\"],\"output\":\"막대\",\"explain\":\"서로 다른 항목(세 도시)의 크기를 비교하는 것이므로 막대 그래프가 적합합니다. 시간에 따른 변화가 아니라 항목 간 비교이기 때문입니다. 시간 흐름(예: 서울 인구의 연도별 변화)이라면 선 그래프가 맞습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"막대 그래프가 가장 적합한 경우는?\",\"options\":[\"시간에 따른 변화\",\"항목 간 크기 비교\",\"두 변수의 관계\",\"값의 분포\"],\"answer\":1,\"explain\":\"막대 그래프는 서로 다른 항목의 크기를 비교할 때 적합합니다. 시간 변화는 선, 관계는 산점도, 분포는 히스토그램입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"세로 막대 그래프를 그리는 함수는?\",\"options\":[\"plt.plot()\",\"plt.bar()\",\"plt.hist()\",\"plt.scatter()\"],\"answer\":1,\"explain\":\"plt.bar()가 세로 막대 그래프를 그립니다. plot은 선, hist는 히스토그램, scatter는 산점도입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"plt.barh()가 그리는 것은?\",\"options\":[\"세로 막대\",\"가로 막대\",\"선\",\"점\"],\"answer\":1,\"explain\":\"barh는 가로 막대 그래프를 그립니다. h는 horizontal(수평)을 뜻하며, 항목 이름이 길 때 읽기 편합니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"plt.bar(지점, 매출)에서 막대의 높이가 되는 것은?\",\"options\":[\"지점\",\"매출\",\"둘 다\",\"순서 번호\"],\"answer\":1,\"explain\":\"bar(항목, 값)에서 두 번째 인자(매출)가 막대 높이가 됩니다. 첫 번째(지점)는 x축 항목 이름입니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"막대 그래프를 더 보기 좋게 만드는 방법으로 옳은 것은?\",\"options\":[\"값 순으로 정렬해서 그리기\",\"값을 모두 같게 만들기\",\"항목을 지우기\",\"선으로 바꾸기\"],\"answer\":0,\"explain\":\"값 순으로 정렬하면 어느 항목이 크고 작은지 순위가 한눈에 보여 비교가 쉬워집니다. sort_values로 정렬한 뒤 그리면 됩니다.\"}]},\"faq\":[{\"q\":\"선 그래프랑 막대 그래프, 헷갈려요.\",\"a\":\"시간 흐름의 변화면 선(1월-\u003e5월 매출 변화), 서로 다른 항목 비교면 막대(서울·부산·대구 매출)예요. \\\"흐름이냐 비교냐\\\"로 구분하면 쉽습니다.\"},{\"q\":\"bar랑 barh 중 뭘 쓰나요?\",\"a\":\"항목 개수가 적으면 세로(bar), 항목 이름이 길거나 개수가 많으면 가로(barh)가 읽기 편해요. 예를 들어 긴 제품명이 여러 개면 barh가 낫습니다.\"},{\"q\":\"막대마다 색을 다르게 할 수 있나요?\",\"a\":\"네, color=[\\\"red\\\", \\\"blue\\\", \\\"green\\\"]처럼 색 리스트를 주면 막대마다 다른 색이 돼요. 특정 막대만 강조하고 싶을 때 유용합니다.\"},{\"q\":\"정렬은 꼭 해야 하나요?\",\"a\":\"필수는 아니지만, 값 순으로 정렬하면 비교가 훨씬 쉬워요. 특히 순위를 보여주고 싶을 때는 내림차순 정렬 후 그리는 게 좋습니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray\",\"track2.indexing\",\"track2.vectorized\",\"track2.broadcasting\",\"track2.statistics\",\"track2.boolean\"],\"topicFiles\":[\"topics/t1-ndarray.json\",\"topics/t2-indexing.json\",\"topics/t3-vectorized.json\",\"topics/t4-broadcasting.json\",\"topics/t5-statistics.json\",\"topics/t6-boolean.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track3\",\"order\":3,\"title\":\"pandas 핵심 - 데이터 구조\",\"description\":\"데이터 분석의 중심 도구인 pandas의 Series와 DataFrame을 익힙니다.\",\"topicOrder\":[\"track3.series\",\"track3.dataframe\",\"track3.loading\",\"track3.selection\",\"track3.filtering\",\"track3.columns\",\"track3.sorting\"],\"topicFiles\":[\"topics/t1-series.json\",\"topics/t2-dataframe.json\",\"topics/t3-loading.json\",\"topics/t4-selection.json\",\"topics/t5-filtering.json\",\"topics/t6-columns.json\",\"topics/t7-sorting.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track4\",\"order\":4,\"title\":\"pandas 실전 - 데이터 가공\",\"description\":\"실제 분석에서 가장 많이 쓰는 데이터 정제와 가공 기법을 익힙니다.\",\"topicOrder\":[\"track4.missing\",\"track4.duplicates\",\"track4.dtype\",\"track4.string\",\"track4.apply\",\"track4.newcolumns\"],\"topicFile

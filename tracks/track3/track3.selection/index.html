"Navbar\"]\nd:I[1060,[],\"\"]\n5:T724,## 표에서 원하는 부분만 꺼내기\n\nDataFrame에서 특정 열, 특정 행, 또는 특정 칸을 꺼내는 방법을 배웁니다. 이것은 데이터 분석에서 가장 기본이 되는 동작입니다. 세 가지 도구를 씁니다: `[]`(열 선택), `loc`(라벨 기준), `iloc`(위치 기준).\n\n예제 데이터:\n\n```python\nimport pandas as pd\ndf = pd.DataFrame({\n    \"이름\": [\"김철수\", \"이영희\", \"박민수\"],\n    \"점수\": [90, 85, 70]\n})\n```\n\n## 열 선택 — 대괄호 []\n\n열 이름을 대괄호에 넣으면 그 열(Series)이 나옵니다.\n\n```python\ndf[\"이름\"]        # 이름 열\n```\n\n여러 열을 뽑을 때는 열 이름 리스트를 넣습니다. 이때는 결과가 DataFrame입니다.\n\n```python\ndf[[\"이름\", \"점수\"]]     # 두 열 (대괄호 두 겹)\n```\n\n## 행 선택 — loc (라벨 기준)\n\n`loc`는 행의 라벨(인덱스)로 행을 꺼냅니다.\n\n```python\ndf.loc[0]         # 0번 행 전체\n```\n\n출력:\n```\n이름    김철수\n점수     90\nName: 0, dtype: object\n```\n\n## 행 선택 — iloc (위치 기준)\n\n`iloc`는 행의 순서 위치(0부터)로 꺼냅니다. 지금 예제는 인덱스가 0,1,2라 loc와 결과가 같아 보이지만, "])</script><script>self.__next_f.push([1,"인덱스가 라벨(예: 이름)일 때 차이가 납니다.\n\n```python\ndf.iloc[0]        # 첫 번째 행 (위치 0)\n```\n\n## 특정 칸 하나 꺼내기 — loc[행, 열]\n\n행과 열을 함께 지정하면 특정 칸의 값을 꺼냅니다.\n\n```python\ndf.loc[1, \"점수\"]      # 1번 행의 점수 = 85\n```\n\n## loc와 iloc의 차이 정리\n\n| | 기준 | 예 |\n|---|---|---|\n| `loc` | 라벨(인덱스 이름) | `df.loc[1, \"점수\"]` |\n| `iloc` | 위치 번호(0부터) | `df.iloc[1, 1]` |\n\n`loc`는 이름표로, `iloc`는 순서 번호로 접근한다고 기억하면 됩니다. (i는 integer, 즉 숫자 위치를 뜻합니다.)7:[\"trackId\",\"track3\",\"d\"]\n8:[\"topicId\",\"track3.selection\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track3\",\"track3.selection\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track3\",\"d\"],{\"children\":[[\"topicId\",\"track3.selection\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track3\\\",\\\"topicId\\\":\\\"track3.selection\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track3\",\"d\"],{\"children\":[[\"topicId\",\"track3.sel 표현되기 때문입니다.\"},{\"id\":\"fb4\",\"prompt\":\"loc로 1번 행의 점수 값을 꺼내세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"이름\\\": [\\\"A\\\", \\\"B\\\"], \\\"점수\\\": [90, 80]})\\nprint(df.loc[1, ______])\",\"answers\":[\"\\\"점수\\\"\",\"'점수'\"],\"output\":\"80\",\"explain\":\"loc[행, 열] 형태로 행과 열을 함께 지정하면 특정 칸 하나의 값을 꺼냅니다. 1번 행의 점수는 80입니다. 콤마 앞은 행 라벨, 뒤는 열 이름입니다.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요.\",\"code\":\"import pandas as pd\\ndf = pd.DataFrame({\\\"이름\\\": [\\\"A\\\", \\\"B\\\", \\\"C\\\"], \\\"점수\\\": [90, 80, 70]})\\nprint(df.iloc[2])\",\"answers\":[\"이름     C\\n점수    70\\nName: 2, dtype: object\"],\"output\":\"이름     C\\n점수    70\\nName: 2, dtype: object\",\"explain\":\"iloc[2]는 위치상 세 번째(0부터 세어 2번) 행을 꺼냅니다. 이름 C, 점수 70인 행 전체가 세로로 표시됩니다. iloc는 인덱스 이름과 무관하게 순서 번호로 접근합니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"df[\\\"점수\\\"]처럼 열 하나를 꺼내면 결과의 형태는?\",\"options\":[\"DataFrame\",\"Series\",\"리스트\",\"딕셔너리\"],\"answer\":1,\"explain\":\"열 하나를 꺼내면 Series가 나옵니다. 여러 열(df[[\\\"a\\\",\\\"b\\\"]])을 꺼내야 DataFrame이 됩니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"여러 열을 선택할 때 대괄호가 두 겹인 이유는?\",\"options\":[\"오타 방지\",\"안쪽 대괄호가 열 이름 리스트이기 때문\",\"규칙상 항상 두 겹\",\"행을 함께 선택하려고\"],\"answer\":1,\"explain\":\"바깥 대괄호는 선택 기호, 안쪽 대괄호는 열 이름들의 리스트입니다. 그래서 df[[\\\"이름\\\", \\\"점수\\\"]]처럼 두 겹이 됩니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"loc와 iloc의 차이로 옳은 것은?\",\"options\":[\"둘이 같다\",\"loc는 위치, iloc는 라벨\",\"loc는 라벨, iloc는 위치 번호\",\"iloc는 열만 선택한다\"],\"answer\":2,\"explain\":\"loc는 인덱스 라벨(이름)로, iloc는 순서 위치(0부터)로 접근합니다. iloc의 i는 integer(정수 위치)를 뜻합니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"df.loc[2, \\\"이름\\\"]이 꺼내는 것은?\",\"options\":[\"2번 열 전체\",\"2번 행의 이름 값 하나\",\"이름 열 전체\",\"에러\"],\"answer\":1,\"explain\":\"loc[행, 열]은 특정 칸의 값을 꺼냅니다. 2번 행의 이름 칸 값 하나가 반환됩니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"인덱스가 [\\\"a\\\", \\\"b\\\", \\\"c\\\"]인 DataFrame에서 첫 번째 행을 위치로 꺼내려면?\",\"options\":[\"df.loc[0]\",\"df.iloc[0]\",\"df[\\\"a\\\"]\",\"df[0]\"],\"answer\":1,\"explain\":\"인덱스가 라벨(a, b, c)이므로 위치로 꺼내려면 iloc를 써야 합니다. df.loc[\\\"a\\\"]는 되지만 df.loc[0]은 0이라는 라벨이 없어 에러가 납니다. iloc[0]은 위치 기준이라 항상 첫 행을 가져옵니다.\"}]},\"faq\":[{\"q\":\"loc랑 iloc, 매번 헷갈려요.\",\"a\":\"loc는 라벨(이름)로, iloc는 위치 번호(0부터)로 접근한다고 외우면 돼요. iloc의 i가 integer(정수)라서 숫자 위치라고 연결하면 기억하기 쉽습니다.\"},{\"q\":\"인덱스가 0,1,2면 loc랑 iloc가 같은 거 아닌가요?\",\"a\":\"그럴 땐 결과가 같아 보여요. 하지만 인덱스를 국어, 영어 같은 라벨로 바꾸면 loc는 그 라벨로, iloc는 여전히 0,1,2 위치로 접근해서 차이가 드러납니다.\"},{\"q\":\"df[\\\"점수\\\"]랑 df[[\\\"점수\\\"]]는 뭐가 다른가요?\",\"a\":\"앞은 Series(1차원), 뒤는 열이 하나뿐인 DataFrame(표 형태)이에요. 대괄호를 두 겹으로 쓰면 표 형태로 유지됩니다.\"},{\"q\":\"특정 칸 하나만 꺼내려면요?\",\"a\":\"df.loc[행, 열] 또는 df.iloc[행위치, 열위치]를 쓰면 돼요. 예를 들어 df.loc[0, \\\"점수\\\"]는 0번 행의 점수 칸 값 하나를 가져옵니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray\",\"track2.indexing\",\"track2.vectorized\",\"track2.broadcasting\",\"track2.statistics\",\"track2.boolean\"],\"topicFiles\":[\"topics/t1-ndarray.json\",\"topics/t2-indexing.json\",\"topics/t3-vectorized.json\",\"topics/t4-broadcasting.json\",\"topics/t5-statistics.json\",\"topics/t6-boolean.json\"],\"projectFile\":\"project.json\"},{\"id\":\"track3\",\"order\":3,\"title\":\"pandas 핵심 - 데이터 구조\",\"description\":\"데이터 분석의 중심 도구인 pandas의 Series와 DataFrame을 익힙니다.\",\"topicOrder\":[\"track3.series\",\"track3.dataframe\",\"track3.loading\",\"track3.selection\",\"track3.filtering

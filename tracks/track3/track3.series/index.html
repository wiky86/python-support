을 예측하세요.\",\"code\":\"import pandas as pd\\ns = pd.Series([5, 10, 15], index=[\\\"x\\\", \\\"y\\\", \\\"z\\\"])\\nprint(s[\\\"z\\\"])\",\"answers\":[\"15\"],\"output\":\"15\",\"explain\":\"인덱스 z는 세 번째 값 15에 연결되어 있습니다. 인덱스를 라벨로 지정하면, 딕셔너리에서 키로 값을 꺼내듯 라벨로 값에 접근할 수 있습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"pandas를 불러오는 관례적인 코드는?\",\"options\":[\"import pandas\",\"import pandas as pd\",\"import pd\",\"from pandas\"],\"answer\":1,\"explain\":\"관례적으로 as pd 별칭을 붙입니다. import pandas도 문법상 되지만 이후 pandas.Series()처럼 길게 써야 하고, import pd와 from pandas는 잘못된 구문입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"Series를 가장 잘 설명한 것은?\",\"options\":[\"표 전체\",\"이름표(인덱스)가 붙은 1차원 데이터\",\"여러 개의 표\",\"그래프\"],\"answer\":1,\"explain\":\"Series는 각 값에 인덱스(라벨)가 붙은 1차원 데이터로, 엑셀의 한 열에 해당합니다. 표 전체(여러 열)는 다음 토픽의 DataFrame입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"다음 코드에서 인덱스를 지정하지 않으면 어떻게 되나요?\\n`s = pd.Series([7, 8, 9])`\",\"options\":[\"에러가 난다\",\"0, 1, 2가 자동으로 붙는다\",\"인덱스가 없다\",\"1, 2, 3이 붙는다\"],\"answer\":1,\"explain\":\"인덱스를 생략하면 0부터 시작하는 정수 인덱스가 자동으로 붙습니다. 리스트나 배열의 인덱싱과 같은 방식입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"s = pd.Series([10, 20], index=[\\\"a\\\", \\\"b\\\"])에서 s[\\\"a\\\"]의 값은?\",\"options\":[\"10\",\"20\",\"a\",\"에러\"],\"answer\":0,\"explain\":\"라벨 a는 첫 번째 값 10에 연결됩니다. 인덱스를 지정하면 위치 번호가 아니라 라벨로 값을 꺼냅니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"Series에 대한 설명으로 틀린 것은?\",\"options\":[\"통계 함수를 쓸 수 있다\",\"인덱스를 직접 지정할 수 있다\",\"딕셔너리로 만들 수 있다\",\"여러 개의 열을 담는다\"],\"answer\":3,\"explain\":\"Series는 1차원(한 열)입니다. 여러 열을 담는 것은 DataFrame입니다. 나머지는 모두 Series의 올바른 특징입니다.\"}]},\"faq\":[{\"q\":\"Series랑 리스트랑 뭐가 다른가요?\",\"a\":\"리스트는 값만 나열하지만, Series는 각 값에 인덱스(라벨)가 붙어 있어요. 그래서 영어 점수처럼 이름으로 값을 꺼낼 수 있고, 평균 같은 통계 함수도 바로 쓸 수 있습니다.\"},{\"q\":\"인덱스는 꼭 지정해야 하나요?\",\"a\":\"아니요. 생략하면 0, 1, 2처럼 자동으로 붙어요. 다만 국어, 영어, 수학처럼 의미 있는 라벨을 붙이면 데이터를 다루기 훨씬 편합니다.\"},{\"q\":\"Series는 왜 대문자로 시작하나요?\",\"a\":\"pandas에서 Series는 하나의 종류(클래스)라서 관례적으로 대문자로 시작해요. pd.series처

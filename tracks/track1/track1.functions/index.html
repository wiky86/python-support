"Navbar\"]\nd:I[1060,[],\"\"]\n5:T73f,## 함수란?\n\n함수는 자주 쓰는 코드에 이름을 붙여 재사용하는 도구입니다. 데이터 분석에서 \"평균 구하기\", \"데이터 정리하기\"처럼 반복되는 작업을 함수로 만들어 두면 필요할 때마다 이름만 불러 쓸 수 있습니다. 이미 써본 `print()`, `len()`, `type()`도 함수예요.\n\n## 함수 정의하기 — def\n\n```python\ndef greet():\n    print(\"안녕하세요\")\n```\n\n`def 함수이름():` 으로 정의하고, 들여쓴 곳에 실행할 코드를 씁니다. 정의만으로는 실행되지 않고, 이름을 불러야(호출) 실행됩니다.\n\n```python\ngreet()     # \"안녕하세요\" 출력\n```\n\n## 입력값 받기 — 매개변수\n\n괄호 안에 값을 받아 함수 안에서 활용할 수 있습니다.\n\n```python\ndef greet(name):\n    print(name + \"님 환영합니다\")\n\ngreet(\"홍길동\")    # \"홍길동님 환영합니다\"\n```\n\n`name`을 매개변수라 하고, 호출할 때 넣는 `\"홍길동\"`을 인자라고 합니다.\n\n## 결과 돌려주기 — return\n\n함수가 계산한 값을 밖으로 돌려줄 때 `return`을 씁니다. `print`는 화면에 보여줄 뿐이고, `return`은 값을 넘겨줘서 다시 활용"])</script><script>self.__next_f.push([1,"할 수 있게 합니다.\n\n```python\ndef add(a, b):\n    return a + b\n\nresult = add(3, 5)\nprint(result)      # 8\n```\n\n## 평균 구하는 함수 예시\n\n```python\ndef average(numbers):\n    return sum(numbers) / len(numbers)\n\nscores = [90, 80, 70]\nprint(average(scores))    # 80.0\n```\n\n`sum()`은 리스트 합계, `len()`은 개수를 구하는 내장 함수입니다.\n\n## print와 return의 차이\n\n`print`는 화면에 보여주기만 하고 값이 남지 않습니다. `return`은 값을 돌려줘서 변수에 담거나 다시 계산에 쓸 수 있습니다. 데이터 분석에서는 결과를 이어서 활용해야 하므로 `return`이 중요합니다.7:[\"trackId\",\"track1\",\"d\"]\n8:[\"topicId\",\"track1.functions\",\"d\"]\ne:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"Fj-Zf9J2vVgzoWwlDSDEs\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"tracks\",\"track1\",\"track1.functions\",\"\"],\"initialTree\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track1\",\"d\"],{\"children\":[[\"topicId\",\"track1.functions\",\"d\"],{\"children\":[\"__PAGE__?{\\\"trackId\\\":\\\"track1\\\",\\\"topicId\\\":\\\"track1.functions\\\"}\",{}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track1\",\"d\"],{\"children\":[[\"topicId\",\"track1.functions\",\"d\"],{\"children\":[\"__PAGE__

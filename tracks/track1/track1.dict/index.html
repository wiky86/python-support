수정입니다.\\n\\n```python\\nstudent[\\\"city\\\"] = \\\"서울\\\"    # 추가\\nstudent[\\\"age\\\"] = 21         # 수정\\n```\\n\\n## 키가 있는지 확인하기 — in\\n\\n```python\\n\\\"name\\\" in student    # True\\n\\\"phone\\\" in student   # False\\n```\\n\\n## 키와 값 전체 보기 — keys(), values()\\n\\n```python\\nstudent.keys()      # dict_keys(['name', 'age', 'score'])\\nstudent.values()    # dict_values(['홍길동', 21, 90])\\n```\\n\\n## 리스트 vs 딕셔너리\\n\\n| | 리스트 | 딕셔너리 |\\n|---|---|---|\\n| 묶는 기준 | 순서(인덱스) | 이름표(키) |\\n| 값 꺼내기 | `scores[0]` | `student[\\\"name\\\"]` |\\n| 적합한 데이터 | 같은 종류의 나열 | 항목마다 이름 있는 정보 |\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"딕셔너리 person에서 나이를 꺼내세요.\",\"code\":\"person = {\\\"name\\\": \\\"김철수\\\", \\\"age\\\": 30}\\nprint(person[______])\",\"answers\":[\"\\\"age\\\"\",\"'age'\"],\"output\":\"30\",\"explain\":\"딕셔너리는 대괄호에 키를 넣어 값을 꺼냅니다. person[\\\"age\\\"]는 age 키에 연결된 값 30을 반환합니다. 리스트가 순서 번호로 접근한다면 딕셔너리는 키(이름)로 접근합니다.\"},{\"id\":\"fb2\",\"prompt\":\"딕셔너리에 새 키 \\\"job\\\"에 값 \\\"개발자\\\"를 추가하세요.\",\"code\":\"person = {\\\"name\\\": \\\"김철수\\\", \\\"age\\\": 30}\\nperson[______] = \\\"개발자\\\"\",\"answers\":[\"\\\"job\\\"\",\"'job'\"],\"output\":\"\",\"explain\":\"존재하지 않는 키에 값을 지정하면 새 키-값 쌍이 추가됩니다. person[\\\"job\\\"] = \\\"개발자\\\"는 job이라는 새 키에 개발자를 넣습니다. 이미 있는 키에 쓰면 값이 덮어써집니다.\"},{\"id\":\"fb3\",\"prompt\":\"키 \\\"name\\\"이 딕셔너리에 있는지 확인하세요.\",\"code\":\"person = {\\\"name\\\": \\\"김철수\\\", \\\"age\\\": 30}\\nprint(\\\"name\\\" ______ person)\",\"answers\":[\"in\"],\"output\":\"True\",\"explain\":\"in 연산자는 특정 키가 딕셔너리에 있는지 True/False로 알려줍니다. \\\"name\\\"이 person에 있으므로 True입니다. 키 존재 여부를 확인해 에러를 방지할 때 유용합니다.\"},{\"id\":\"fb4\",\"prompt\":\"딕셔너리의 모든 키를 출력하세요.\",\"code\":\"data = {\\\"a\\\": 1, \\\"b\\\": 2}\\nprint(data.______())\",\"answers\":[\"keys\"],\"output\":\"dict_keys(['a', 'b'])\",\"explain\":\"keys()는 딕셔너리의 모든 키를 모아 보여줍니다. data.keys()는 dict_keys(['a', 'b'])를 반환합니다. 어떤 키들이 있는지 한눈에 확인할 때 씁니다.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요.\",\"code\":\"scores = {\\\"kor\\\": 90, \\\"eng\\\": 85}\\nscores[\\\"eng\\\"] = 95\\nprint(scores[\\\"eng\\\"])\",\"answers\":[\"95\"],\"output\":\"95\",\"explain\":\"이미 있는 키에 값을 다시 지정하면 기존 값이 새 값으로 바뀝니다. scores[\\\"eng\\\"] = 95로 85가 95로 덮어써져, 이후 scores[\\\"eng\\\"]는 95를 출력합니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"딕셔너리 d = {\\\"x\\\": 1, \\\"y\\\": 2}에서 d[\\\"y\\\"]의 값은?\",\"options\":[\"1\",\"2\",\"\\\"y\\\"\",\"에러\"],\"answer\":1,\"explain\":\"키 \\\"y\\\"에 연결된 값은 2입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"딕셔너리에서 값을 꺼내는 올바른 방법은?\",\"options\":[\"d[0]\",\"d.get(0)\",\"d[\\\"key\\\"]\",\"d(key)\"],\"answer\":2,\"explain\":\"딕셔너리는 키로 접근합니다. 숫자 인덱스가 아닙니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"다음 코드의 결과는?\\n`info = {\\\"a\\\": 1}`\\n`info[\\\"a\\\"] = 5`\\n`print(info[\\\"a\\\"])`\",\"options\":[\"1\",\"5\",\"에러\",\"{\\\"a\\\": 5}\"],\"answer\":1,\"explain\":\"이미 있는 키 \\\"a\\\"에 넣으면 값이 5로 수정됩니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"d = {\\\"name\\\": \\\"이영희\\\", \\\"age\\\": 25}일 때 \\\"age\\\" in d의 결과는?\",\"options\":[\"True\",\"False\",\"25\",\"에러\"],\"answer\":0,\"explain\":\"키 \\\"age\\\"가 존재하므로 True입니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"다음 중 딕셔너리를 올바르게 만든 것은?\",\"options\":[\"d = [\\\"a\\\": 1]\",\"d = {\\\"a\\\", 1}\",\"d = {\\\"a\\\": 1}\",\"d = (\\\"a\\\": 1)\"],\"answer\":2,\"explain\":\"중괄호 안에 키: 값 형태여야 합니다. 대괄호/소괄호나 콜론 없는 형태는 딕셔너리가 아닙니다.\"}]},\"faq\":[{\"q\":\"리스트랑 딕셔너리, 언제 뭘 써야 하나요?\",\"a\":\"값들이 단순히 나열된 거면 리스트, 각 값에 이름표가 필요하면 딕셔너리를 쓰면 됩니다.\"},{\"q\":\"키로 숫자도 쓸 수 있나요?\",\"a\":\"네, {1: \\\"일\\\", 2: \\\"이\\\"}처럼 숫자 키도 가능해요. 다만 데이터 분석에서는 보통 문자열 키를 많이 씁니다.\"},{\"q\":\"없는 키를 꺼내면 어떻게 되나요?\",\"a\":\"KeyError 에러가 납니다. 미리 \\\"키\\\" in 딕셔너리로 확인하거나, 나중에 배울 .get()을 쓰면 에러 없이 안전하게 꺼낼 수 있어요.\"},{\"q\":\"같은 키를 두 번 쓰면요?\",\"a\":\"{\\\"a\\\": 1, \\\"a\\\": 2}처럼 쓰면 뒤의 값(2)만 남아요. 키는 중복될 수 없습니다.\"}]},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.

 와 달리, 부분 일치를 찾습니다.\\n\\n## 와일드카드 — % 와 _\\n\\nLIKE는 두 가지 특수 기호(와일드카드)를 씁니다.\\n\\n- **`%`**: 0개 이상의 임의 문자. \\\"아무 글자나 몇 개든\\\"\\n- **`_`**: 정확히 1개의 임의 문자. \\\"아무 글자나 딱 하나\\\"\\n\\n## % 사용 예\\n\\n```sql\\nSELECT emp_name FROM employees WHERE emp_name LIKE '김%';\\n```\\n\\n'김'으로 **시작**하는 이름을 찾습니다. `김%` = 김 + 아무 글자. 결과: 김철수.\\n\\n```sql\\nSELECT emp_name FROM employees WHERE emp_name LIKE '%수';\\n```\\n\\n'수'로 **끝나는** 이름을 찾습니다. `%수` = 아무 글자 + 수. 결과: 김철수, 박민수.\\n\\n```sql\\nWHERE emp_name LIKE '%민%'\\n```\\n\\n'민'이 **포함된** 이름을 찾습니다. 앞뒤로 % 를 붙이면 '어디든 민이 들어간' 것을 찾습니다.\\n\\n## _ 사용 예\\n\\n```sql\\nWHERE emp_name LIKE '김__'\\n```\\n\\n'김' 다음에 정확히 두 글자가 오는 이름(세 글자 이름 중 김으로 시작). `_`는 글자 수를 정확히 맞춰야 할 때 씁니다.\\n\\n## NOT LIKE\\n\\n```sql\\nWHERE emp_name NOT LIKE '김%'  -- 김으로 시작하지 않는 이름\\n```\\n\\n## 정리\\n\\nLIKE는 패턴 검색입니다. `%`는 임의의 문자 여러 개, `_`는 임의의 문자 하나를 의미합니다. `'김%'`(김으로 시작), `'%수'`(수로 끝남), `'%민%'`(민 포함) 형태로 활용합니다.\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"이름이 '김'으로 시작하는 직원을 조회하세요. (패턴 검색 키워드)\",\"code\":\"SELECT emp_name FROM employees WHERE emp_name ______ '김%';\",\"answers\":[\"LIKE\"],\"ignoreCase\":true,\"output\":\"김철수\",\"explain\":\"LIKE는 패턴 검색 키워드입니다. '김%'는 '김'으로 시작하는 이름을 찾습니다.\"},{\"id\":\"fb2\",\"prompt\":\"이름이 '김'으로 시작하는 직원을 찾는 패턴을 완성하세요. '0개 이상의 임의 문자'를 뜻하는 와일드카드를 넣으세요.\",\"code\":\"SELECT emp_name FROM employees WHERE emp_name LIKE '김______';\",\"answers\":[\"%\"],\"ignoreCase\":true,\"output\":\"김철수 (김으로 시작하는 이름)\",\"explain\":\"%는 0개 이상의 임의 문자를 의미합니다. '김%'는 김 뒤에 어떤 글자가 몇 개 오든 상관없이 '김으로 시작'하는 이름을 찾습니다.\"},{\"id\":\"fb3\",\"prompt\":\"이름이 '수'로 끝나는 직원을 조회하세요. (패턴을 완성하세요)\",\"code\":\"SELECT emp_name FROM employees WHERE emp_name LIKE '______수';\",\"answers\":[\"%\"],\"ignoreCase\":true,\"output\":\"김철수, 박민수\",\"explain\":\"'%수'는 '수'로 끝나는 이름을 찾습니다. 앞에 어떤 글자가 오든 마지막이 '수'면 됩니다. 김철수, 박민수가 해당됩니다.\"},{\"id\":\"fb4\",\"prompt\":\"이름에 '민'이 포함된 직원을 조회하려 합니다. 패턴을 완성하세요.\",\"code\":\"SELECT emp_name FROM employees WHERE emp_name LIKE '%______%';\",\"answers\":[\"민\"],\"ignoreCase\":true,\"output\":\"박민수 (이름에 '민'이 들어간 직원)\",\"explain\":\"'%민%'는 이름 어디에든 '민'이 들어간 것을 찾습니다. 앞뒤 %가 '민'의 앞뒤에 어떤 글자든 허용합니다.\"},{\"id\":\"fb5\",\"prompt\":\"이름이 '김'으로 시작하지 '않는' 직원을 조회하세요. (부정 패턴 검색)\",\"code\":\"SELECT emp_name FROM employees WHERE emp_name ______ LIKE '김%';\",\"answers\":[\"NOT\"],\"ignoreCase\":true,\"output\":\"김철수를 제외한 나머지 7명\",\"explain\":\"NOT LIKE는 패턴에 맞지 '않는' 행을 조회합니다. '김%'에 맞지 않는(김으로 시작하지 않는) 직원이 나옵니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"값의 일부 패턴으로 검색할 때 사용하는 연산자는?\",\"options\":[\"=\",\"LIKE\",\"IN\",\"BETWEEN\"],\"answer\":1,\"explain\":\"LIKE가 패턴 검색 연산자입니다. =는 정확히 일치할 때만 씁니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"LIKE에서 `%` 와일드카드의 의미는?\",\"options\":[\"정확히 1개의 문자\",\"0개 이상의 임의 문자\",\"숫자만\",\"공백만\"],\"answer\":1,\"explain\":\"%는 0개 이상의 임의 문자를 의미합니다. 정확히 1개는 _(언더스코어)입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"`emp_name LIKE '%수'` 가 찾는 것은?\",\"options\":[\"'수'로 시작하는 이름\",\"'수'로 끝나는 이름\",\"'수'가 정확히 두 번째 글자인 이름\",\"이름이 정확히 '수'인 사람\"],\"answer\":1,\"explain\":\"'%수'는 앞에 어떤 글자가 오든 마지막이 '수'인 이름, 즉 '수'로 끝나는 이름을 찾습니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"이름에 '민'이 포함된 것을 찾는 패턴은?\",\"options\":[\"'민'\",\"'민%'\",\"'%민'\",\"'%민%'\"],\"answer\":3,\"explain\":\"'%민%'는 앞뒤에 어떤 글자든 허용하므로 이름 어디에든 '민'이 들어간 것을 찾습니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"LIKE의 `_`(언더스코어) 와일드카드의 의미는?\",\"options\":[\"0개 이상의 임의 문자\",\"정확히 1개의 임의 문자\",\"공백 문자\",\"숫자 1개\"],\"answer\":1,\"explain\":\"_(언더스코어)는 정확히 1개의 임의 문자를 의미합니다. 글자 수를 맞춰야 할 때 씁니다.\"}]},\"faq\":[{\"q\":\"% 와 _ 의 차이가 헷갈려요.\",\"a\":\"%는 '몇 글자든 상관없음'(0개 포함), _는 '정확히 한 글자'입니다. 예를 들어 '김%'는 김·김철수·김가나다 모두 맞지만, '김_'는 딱 두 글자(김+한글자)만 맞습니다.\"},{\"q\":\"실제 % 기호를 검색하려면 어떻게 하나요?\",\"a\":\"ESCAPE 문법을 써서 와일드카드를 일반 문자로 처리할 수 있습니다. 입문 단계에서는 자주 쓰지 않으니 이런 방법이 있다는 정도만 알아두세요.\"},{\"q\":\"LIKE는 대소문자를 구분하나요?\",\"a\":\"DBMS 설정에 따라 다릅니다. MySQL은 기본 설정에서 영문 대소문자를 구분하지 않는 경우가 많습니다. 한글은 해당 사항이 없습니다.\"}],\"courseId\":\"sql\"},\"allTracks\":[{\"id\":\"track1\",\"

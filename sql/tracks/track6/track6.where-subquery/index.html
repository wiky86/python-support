ovider\"]\nc:I[4783,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"336\",\"static/chunks/336-217394674e37e8c5.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-e667c4d5cb17daf4.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T79d,## 기준 값을 서브쿼리로\n\n가장 많이 쓰는 서브쿼리는 WHERE 절에서 **비교 기준 값**을 구하는 것입니다. '평균보다', '최고 급여와 같은', '특정 직원보다' 같은 조건에서 그 기준을 서브쿼리로 계산합니다.\n\n## 평균과 비교\n\n```sql\nSELECT emp_name, salary\nFROM employees\nWHERE salary \u003e (SELECT AVG(salary) FROM employees);\n```\n\n평균보다 많이 받는 직원. 서브쿼리가 평균(약 4163)을 구하고 그보다 큰 직원을 찾습니다.\n\n## 최댓값과 비교 — 최고 급여자 찾기\n\n```sql\nSELECT emp_name, salary\nFROM employees\nWHERE salary = (SELECT MAX(salary) FROM employees);\n```\n\n최고 급여자를 찾습니다. 서브쿼리가 최댓값(6000)을 구하고, 그와 같은 급여의 직원(김철수)을 찾습니다. `ORDER BY ... LIMIT 1`로도 최고 급여자를 찾을 수 있지만, 최고 급여가 여러 명일 때는 이 서브쿼리 방식이 그들을 모두 찾습니다.\n\n## 특정 직원 기준으로 비교\n\n```sql\nSELECT emp_name, salary\nFROM employees\nWHERE salary \u003e (SELECT sal"])</script><script>self.__next_f.push([1,"ary FROM employees WHERE emp_name = '정수진');\n```\n\n'정수진보다 많이 받는 직원'을 찾습니다. 서브쿼리가 정수진의 급여(3500)를 구하고, 그보다 큰 직원을 찾습니다.\n\n## 주의: 스칼라 서브쿼리는 값 하나여야\n\n`=`, `\u003e`, `\u003c` 같은 비교에 쓰는 서브쿼리는 **결과가 값 하나**여야 합니다. 만약 서브쿼리가 여러 행을 반환하면 오류가 납니다. 예를 들어 `WHERE salary = (SELECT salary FROM employees WHERE position='사원')` 는 사원이 여러 명이라 오류입니다. 이럴 때는 다음 토픽의 IN을 씁니다.\n\n## 정리\n\nWHERE 절 서브쿼리로 비교 기준 값을 동적으로 구합니다. 평균·최댓값·특정 직원의 값 등을 서브쿼리로 계산해 비교합니다. 단, `=`/`\u003e` 등 비교에는 결과가 값 하나(스칼라)여야 합니다.7:[\"courseId\",\"sql\",\"d\"]\n8:[\"trackId\",\"track6\",\"d\"]\n9:[\"topicId\",\"track6.where-subquery\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"IzFqQxyfmTFt-sY_8y5Aj\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"sql\",\"tracks\",\"track6\",\"track6.where-subquery\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"sql\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track6\",\"d\"],{\"children\":[[\"topicId\",\"trac :\"SELECT emp_name, salary FROM employees WHERE salary \u003e (SELECT salary FROM employees WHERE emp_name = ______);\",\"answers\":[\"'정수진'\"],\"ignoreCase\":true,\"output\":\"김철수, 박민수, 최지훈, 강다연, 임재현 (정수진 3500 초과)\",\"explain\":\"서브쿼리가 정수진의 급여(3500)를 구하고, 그보다 큰 직원을 찾습니다. 특정 대상을 기준으로 비교하는 패턴입니다.\"},{\"id\":\"fb4\",\"prompt\":\"최저 급여를 받는 직원을 찾으세요. 서브쿼리에 최솟값 집계 함수를 넣으세요.\",\"code\":\"SELECT emp_name, salary FROM employees WHERE salary = (SELECT ______(salary) FROM employees);\",\"answers\":[\"MIN\"],\"ignoreCase\":true,\"output\":\"윤서연(3000)\",\"explain\":\"서브쿼리 MIN(salary)이 최저 급여(3000)를 구하고, 그와 같은 급여의 직원(윤서연)을 찾습니다.\"},{\"id\":\"fb5\",\"prompt\":\"= 나 \u003e 같은 비교에 쓰는 서브쿼리는 결과가 몇 개의 값이어야 하나요? (숫자)\",\"code\":\"비교(=, \u003e) 서브쿼리의 결과 값 개수 = ______\",\"answers\":[\"1\",\"하나\",\"1개\"],\"ignoreCase\":true,\"output\":\"값 1개 (스칼라)\",\"explain\":\"=, \u003e 등 비교에 쓰는 스칼라 서브쿼리는 값이 하나여야 합니다. 여러 행을 반환하면 오류가 나며, 그럴 땐 IN을 씁니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"최고 급여자를 찾는 서브쿼리 방식으로 옳은 것은?\",\"options\":[\"WHERE salary = (SELECT MAX(salary) FROM employees)\",\"WHERE salary = MAX(salary)\",\"WHERE MAX(salary)\",\"WHERE salary IS MAX\"],\"answer\":0,\"explain\":\"서브쿼리로 최댓값을 구한 뒤 그와 같은 급여를 찾습니다. WHERE에는 집계 함수를 직접 쓸 수 없어 서브쿼리가 필요합니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"`WHERE salary \u003e (SELECT AVG(salary) FROM employees)` 의 의미는?\",\"options\":[\"평균과 같은 급여\",\"평균보다 많이 받는 직원\",\"평균보다 적게 받는 직원\",\"급여가 없는 직원\"],\"answer\":1,\"explain\":\"서브쿼리로 평균을 구하고 그보다 큰(\u003e) 직원을 찾습니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"WHERE 절에 집계 함수(AVG 등)를 직접 못 쓰고 서브쿼리로 감싸는 이유는?\",\"options\":[\"집계 함수는 WHERE에서 개별 행 조건으로 직접 쓸 수 없기 때문\",\"서브쿼리가 더 빠르기만 해서\",\"문법상 아무 이유 없음\",\"집계 함수는 SELECT에서만 되기 때문\"],\"answer\":0,\"explain\":\"WHERE는 개별 행을 평가하는 단계라 집계 함수를 직접 쓸 수 없습니다. 그래서 서브쿼리로 미리 값을 구해 비교합니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"스칼라 서브쿼리를 =로 비교할 때 여러 행이 반환되면?\",\"options\":[\"정상 동작한다\",\"오류가 난다\",\"첫 행만 쓴다\",\"모두 참이 된다\"],\"answer\":1,\"explain\":\"=, \u003e 같은 비교는 값 하나를 기대합니다. 서브쿼리가 여러 행을 반환하면 오류가 나며, IN 등을 써야 합니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"ORDER BY ... LIMIT 1 대신 서브쿼리(= MAX)로 최고 급여자를 찾는 것의 장점은?\",\"options\":[\"항상 더 빠르다\",\"최고 급여가 여러 명일 때 그들을 모두 찾는다\",\"정렬이 필요 없어진다는 것뿐\",\"차이가 전혀 없다\"],\"answer\":1,\"explain\":\"LIMIT 1은 한 명만 뽑지만, = (SELECT MAX...) 방식은 최고 급여가 동점인 경우 그들을 모두 찾습니다.\"}]},\"faq\":[{\"q\":\"서브쿼리와 ORDER BY+LIMIT 중 뭘 써야 하나요?\",\"a\":\"'상위 N개'가 목적이면 ORDER BY+LIMIT이 간단합니다. '기준 값(평균·최대)과 비교'가 목적이거나 동점을 모두 찾아야 하면 서브쿼리가 적합합니다.\"},{\"q\":\"서브쿼리 안에서도 WHERE를 쓸 수 있나요?\",\"a\":\"네. 서브쿼리도 완전한 SELECT 문이라 WHERE·GROUP BY 등을 쓸 수 있습니다. 예: 특정 부서의 평균만 구하는 서브쿼리.\"},{\"q\":\"서브쿼리가 매번 다시 실행되나요?\",\"a\":\"이 토픽의 서브쿼리는 바깥 행과 무관해 보통 한 번만 실행됩니다(값 하나 계산). 바깥 행마다 값이 달라지는 상관 서브쿼리는 EXISTS 토픽에서 다룹니다.\"}],\"courseId\":\"sql\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"데이터베이스와 SQL 입문\",\"description\":\"데이터베이스가 무엇인지, 테이블·행·열의 개념부터 SELECT 첫걸음까지. SQL을 처음 만나는 사람을 위한 출발점입니다.\",\"topicOrder\":[\"track1.what-is-db\",\"track1.table-structure\",\"track1.what-is-sql\",\"track1.select-basic\",\"track1.select-columns\",\"track1.comments-and-style\"],\"topicFiles\":[\"topics/t1-what-is-db.json\",\"topics/t2-table-structure.json\",\"topics/t3-what-is-sql.json\",\"topics/t4-select-basic.json\",\"topics/t5-select-columns.json\",\"topics/t6-comments-and-style.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track2\",\"order\":2,\"title\":\"데이터 조회 기초 — 조건 검색\",\"description\":\"WHERE로 원하는 조건의 데이터만 골라내는 법을 배웁니다. 비교·논리 연산자, 범위(BETWEEN), 목록(IN), 패턴(LIKE), NULL 처리, 중복 제거(DISTINCT)까지 조회의 핵심을 익힙니다.\",\"topicOrder\":[\"track2.where-basic\",\"track2.operators\",\"track2.between-in\",\"track2.like\",\"track2.null\",\"track2.distinct\"],\"topicFiles\":[\"topics/t1-where-basic.json\",\"topics/t2-operators.json\",\"topics/t3-between-in.json\",\"topics/t4-like.json\",\"topics/t5-null.json\",\"topics/t6-distinct.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track3\

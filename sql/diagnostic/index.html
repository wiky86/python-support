"description\":\"데이터베이스와 SQL의 기초부터 JOIN·서브쿼리·윈도우 함수 같은 실무 기술까지, 데이터를 다루는 질의 언어를 단계별로 익힙니다.\",\"theme\":\"sql\",\"accent\":\"#3b82f6\",\"icon\":\"database\",\"contentPath\":\"content/sql\",\"trackCount\":8},\"diagnostic\":{\"course\":\"sql\",\"title\":\"데이터베이스 활용 SQL 사전 진단\",\"description\":\"과정 시작 전, SQL과 데이터베이스에 대한 현재 나의 이해도를 확인합니다. 이 결과는 학습 순서를 바꾸지 않으며 참고용입니다. 학습은 트랙1부터 순서대로 진행됩니다. (MySQL 기준)\",\"instruction\":\"총 13문항입니다. 각 트랙의 핵심 개념을 묻습니다. 모르는 문항은 '모르겠음'을 선택해도 좋습니다(찍기보다 정확한 진단에 도움이 됩니다). 진단은 1회만 응시할 수 있습니다.\",\"allowDontKnow\":true,\"questions\":[{\"id\":\"diag.sql.1\",\"trackId\":\"track1\",\"type\":\"mcq\",\"q\":\"관계형 데이터베이스에서 데이터가 저장되는 기본 단위이며, 행과 열로 이루어진 것은?\",\"options\":[\"폴더\",\"테이블\",\"함수\",\"인덱스\"],\"answer\":1,\"explain\":\"관계형 데이터베이스는 데이터를 테이블(행과 열로 된 표) 형태로 저장합니다.\"},{\"id\":\"diag.sql.2\",\"trackId\":\"track1\",\"type\":\"mcq\",\"q\":\"employees 테이블의 모든 열과 모든 행을 조회하는 올바른 쿼리는?\",\"options\":[\"GET ALL FROM employees;\",\"SELECT * FROM employees;\",\"SHOW employees;\",\"SELECT ALL employees;\"],\"answer\":1,\"explain\":\"SELECT * FROM 테이블; 이 전체 조회입니다. *는 모든 열을 의미합니다.\"},{\"id\":\"diag.sql.3\",\"trackId\":\"track2\",\"type\":\"mcq\",\"q\":\"급여(salary)가 4000 이상인 직원만 조회하는 조건으로 옳은 것은?\",\"options\":[\"WHERE salary =\u003e 4000\",\"WHERE salary \u003e= 4000\",\"IF salary \u003e= 4000\",\"HAVING salary \u003e= 4000\"],\"answer\":1,\"explain\":\"조건은 WHERE 절에 쓰고, '이상'은 \u003e= 입니다. (=\u003e 는 잘못된 표기입니다.)\"},{\"id\":\"diag.sql.4\",\"trackId\":\"track2\",\"type\":\"mcq\",\"q\":\"값이 NULL인 행을 찾는 올바른 조건은?\",\"options\":[\"WHERE col = NULL\",\"WHERE col IS NULL\",\"WHERE col == NULL\",\"WHERE col EQUALS NULL\"],\"answer\":1,\"explain\":\"NULL은 =로 비교할 수 없어 IS NULL을 씁니다.\"},{\"id\":\"diag.sql.5\",\"trackId\":\"track3\",\"type\":\"mcq\",\"q\":\"급여가 높은 순으로 정렬하는 절은?\",\"options\":[\"ORDER BY salary ASC\",\"ORDER BY salary DESC\",\"SORT salary DOWN\",\"GROUP BY salary\"],\"answer\":1,\"explain\":\"ORDER BY salary DESC가 내림차순(높은 순) 정렬입니다. ASC는 오름차순입니다.\"},{\"id\":\"diag.sql.6\",\"trackId\":\"track3\",\"type\":\"mcq\",\"q\":\"급여 상위 3명만 조회할 때 MySQL에서 개수를 제한하는 키워드는?\",\"options\":[\"TOP 3\",\"LIMIT 3\",\"FIRST 3\",\"ROWNUM 3\"],\"answer\":1,\"explain\":\"MySQL은 LIMIT 3으로 개수를 제한합니다. ORDER BY와 함께 써야 '상위 3명'이 됩니다.\"},{\"id\":\"diag.sql.7\",\"trackId\":\"track4\",\"type\":\"mcq\",\"q\":\"'부서별 평균 급여'를 구할 때 그룹으로 묶는 절은?\",\"options\":[\"ORDER BY dept_id\",\"GROUP BY dept_id\",\"WHERE dept_id\",\"PARTITION dept_id\"],\"answer\":1,\"explain\":\"GROUP BY dept_id로 부서별로 묶은 뒤 AVG(salary)로 부서별 평균을 구합니다.\"},{\"id\":\"diag.sql.8\",\"trackId\":\"track4\",\"type\":\"mcq\",\"q\":\"그룹으로 묶은 뒤 '집계 결과'에 조건을 거는 절은? (예: 인원 2명 이상 부서)\",\"options\":[\"WHERE\",\"HAVING\",\"GROUP BY\",\"ON\"],\"answer\":1,\"explain\":\"집계 결과 조건은 HAVING을 씁니다. WHERE는 그룹화 전 개별 행 조건입니다.\"},{\"id\":\"diag.sql.9\",\"trackId\":\"track5\",\"type\":\"mcq\",\"q\":\"두 테이블을 연결해 조회할 때, 연결 조건을 지정하는 키워드는?\",\"options\":[\"IF\",\"ON\",\"AS\",\"WITH\"],\"answer\":1,\"explain\":\"JOIN ... ON 연결조건 형태로 두 테이블을 연결합니다. 예: ON e.dept_id = d.dept_id.\"},{\"id\":\"diag.sql.10\",\"trackId\":\"track5\",\"type\":\"mcq\",\"q\":\"왼쪽 테이블의 모든 행을 유지하고, 오른쪽에 짝이 없으면 NULL로 채우는 조인은?\",\"options\":[\"INNER JOIN\",\"LEFT JOIN\",\"CROSS JOIN\",\"SELF JOIN\"],\"answer\":1,\"explain\":\"LEFT JOIN은 왼쪽 테이블의 모든 행을 유지하고, 오른쪽에 짝이 없으면 NULL로 채웁니다.\"},{\"id\":\"diag.sql.11\",\"trackId\":\"track6\",\"type\":\"mcq\",\"q\":\"'평균보다 많이 받는 직원'을 찾을 때 쓰는, 쿼리 안의 쿼리는?\",\"options\":[\"조인\",\"서브쿼리\",\"인덱스\",\"트리거\"],\"answer\":1,\"explain\":\"서브쿼리로 평균을 먼저 구하고(WHERE salary \u003e (SELECT AVG(salary)...)), 그보다 큰 직원을 찾습니다.\"},{\"id\":\"diag.sql.12\",\"trackId\":\"track7\",\"type\":\"mcq\",\"q\":\"기존 데이터를 수정하는 명령은? (WHERE를 빠뜨리면 전체가 바뀌어 위험한 명령)\",\"options\":[\"SELECT\",\"UPDATE\",\"CREATE\",\"DROP\"],\"answer\":1,\"explain\":\"UPDATE가 기존 행을 수정합니다. WHERE 없이 쓰면 모든 행이 수정되므로 주의해야 합니다.\"},{\"id\":\"diag.sql.13\",\"trackId\":\"track8\",\"type\":\"mcq\",\"q\":\"행을 합치지 않고 각 행을 유지하면서 순위나 집계를 붙이는 함수는? (OVER 절 사용)\",\"options\":[\"집계 함수(GROUP BY)\",\"윈도우 함수\",\"문자열 함수\",\"날짜 함수\"],\"answer\":1,\"explain\":\"윈도우 함수는 OVER 절을 써서 각 행을 유지한 채 순위·집계를 붙입니다. GROUP BY와 달리 개별 행이 사라지지 않습니다.\"}]},\"tracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"데이터베이스와 SQL 입문\",\"description\":\"데이터베이스가 무엇인지, 테이블·행·열의 개념부터 SELECT 첫걸음까지. SQL을 처음 만나는 사람을 위한 출발점입니다.\",\"topicOrder\":[\"track1.what-is-db\",\"track1.table-structure\",\"track1.what-is-sql\",\"track1.select-basic\",\"track1.select-columns\",\"track1.comments-and-style\"],\"topicFiles\":[\"topics/t1-what-is-db.json\",\"topics/t2-table-structure.json\",\"topics/t3-what-is-sql.json\",\"topics/t4-select-basic.json\",\"topics/t5-select-columns.json\",\"topics/t6-comments-and-style.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track2\",\"order\":2,\"title\":\"데이터 조회 기초 — 조건 검색\",\"description\":\"WHERE로 원하는 조건의 데이터만 골라내는 법을 배웁니다. 비교·논리 연산자, 범위(BETWEEN), 목록(IN), 패턴(LIKE), NULL 처리, 중복 제거(DISTINCT)까지 조회의 핵심을 익힙니다.\",\"topicOrder\":[\"track2.where-basic\",\"track2.operators\",\"track2.between-in\",\"track2.like\",\"track2.null\",\"track2.distinct\"],\"topicFiles\":[\"topics/t1-where-basic.json\",\"topics/t2-operators.json\",\"topics/t3-between-in.json\",\"topics/t4-like.json\",\"topics/t5-null.json\",\"topics/t6-distinct.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track3\",\"order\":3,\"title\":\"정렬과 함수\",\"description\":\"조회 결과를 원하는 순서로 정렬(ORDER BY)하고 상위 N개만 뽑는 법(LIMIT), 그리고 문자열·숫자·날짜를 다루는 함수들을 배웁니다. 데이터를 보기 좋게 가공하는 기술입니다.\",\"topicOrder\":[\"track3.order-by\",\"track3.order-limit\",\"track3.string-func\",\"track3.number-func\",\"track3.date-func\",\"track3.func-combine\"],\"topicFiles\":[\"topics/t1-order-by.json\",\"topics/t2-order-limit.json\",\"topics/t3-string-func.json\",\"topics/t4-number-func.json\",\"topics/t5-date-func.json\",\"topics/t6-func-combine.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track4\",\"order\":4,\"title\":\"집계와 그룹화\",\"description\":\"데이터를 요약하는 집계 함수(COUNT·SUM·AVG·MAX·MIN)와, 그룹별로 나눠 집계하는 GROUP BY, 그룹에 조건을 거는 HAVING을 배웁니다. '부서별 평균 급여'처럼 데이터에서 인사이트를 뽑는 핵심 기술입니다.\",\"topicOrder\":[\"track4.aggregate-basic\",\"track4.count-null\",\"track4.group-by\",\"track4.group-multi\",\"track4.having\",\"track4.aggregate-combine\"],\"topicFiles\":[\"topics/t1-aggregate-basic.json\",\"topics/t2-count-null.json\",\"topics/t3-group-by.json\",\"topics/t4-group-multi.json\",\"topics/t5-having.json\",\"topics/t6-aggregate-combine.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track5\",\"order\":5,\"title\":\"여러 테이블 다루기 — JOIN\",\"description\":\"두 개 이상의 테이블을 연결해 조회하는 JOIN을 배웁니다. INNER JOIN, LEFT JOIN의 차이, 조인과 집계의 결합, 자기 자신과의 조인까지. 관계형 데이터베이스의 진짜 힘을 활용하는 핵심 기술입니다.\",\"topicOrder\":[\"track5.join-intro\",\"track5.inner-join\",\"track5.join-alias\",\"track5.outer-join\",\"track5.join-aggregate\",\"track5.self-join\"],\"topicFiles\":[\"topics/t1-join-intro.json\",\"topics/t2-inner-join.json\",\"topics/t3-join-alias.json\",\"topics/t4-outer-join.json\",\"topics/t5-join-aggregate.json\",\"topics/t6-self-join.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track6\",\"order\":6,\"title\":\"서브쿼리와 고급 조회\",\"description\":\"쿼리 안에 또 다른 쿼리를 넣는 서브쿼리를 배웁니다. '평균보다 많이 받는 직원'처럼 한 번에 풀기 어려운 문제를 단계적으로 해결하고, IN·EXISTS·뷰(VIEW)까지 익혀 조회의 표현력을 크게 넓힙니다.\",\"topicOrder\":[\"track6.subquery-intro\",\"track6.where-subquery\",\"track6.in-subquery\",\"track6.select-from-subquery\",\"track6.exists\",\"track6.view\"],\"topicFiles\":[\"topics/t1-subquery-intro.json\",\"topics/t2-where-subquery.json\",\"topics/t3-in-subquery.json\",\"topics/t4-select-from-subquery.json\",\"topics/t5-exists.json\",\"topics/t6-view.json\"],\"projectFile\":\"project.json\",\"courseId\":\"sql\"},{\"id\":\"track7\",\"order\":7,\"title\":\"데이터 조작과 정의\",\"description\":\"데이터를 추가(INSERT)·수정(UPDATE)·삭제(DELETE)하고, 테이블을 만들고(CREATE) 구조를 바꾸는(ALTER) 법을 배웁니다. 조회를 넘어 데이터베이스를 직접 변경하는 명령들로, 실수하면 데이터가 손상될 수 있어 안전 수칙도 함께 익힙니다.\",\"topicOrder\":[\"track7.insert\",\"track7.update\",\"t

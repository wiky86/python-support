:text-white">이 토픽은 아직 잠겨 있습니다</h2><p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto">이전 토픽의 복습 퀴즈를 통과하면 다음 토픽이 자동으로 열립니다.</p></div><div class="flex items-center justify-center gap-4 pt-4"><a class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition-colors" href="/python-support/finance/">과목 학습 지도로 돌아가기</a></div></div></main><footer class="py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400 w-full"><div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2"><span>© 2026 UBION. All rights reserved.</span><span class="font-mono text-[11px]">Next.js • React • Supabase</span></div></footer><script src="/python-support/_next/static/chunks/webpack-bf84006d145baec9.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/python-support/_next/static/css/72cc07c818b0d08a.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"2:I[2846,[],\"\"]\n4:I[4922,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"44\",\"static/chunks/44-c3178d8f0dbf8251.js\",\"803\",\"static/chunks/803-e6c639b913392d25.js\",\"452\",\"static/chunks/452-c01e5b9372da4c1f.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"754\",\"static/chunks/754-f909b3d8066643b3.js\",\"775\",\"static/chunks/app/%5BcourseId%5D/tracks/%5BtrackId%5D/%5BtopicId%5D/page-a18095c710efe369.js\"],\"TopicView\"]\n6:I[4707,[],\"\"]\na:I[6423,[],\"\"]\nb:I[7766,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"44\",\"static/chunks/44-c3178d8f0dbf8251.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"AuthProvider\"]\nc:I[4783,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"44\",\"static/chunks/44-c3178d8f0dbf8251.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:Ta48,"])</script><script>self.__next_f.push([1,"## 기술적 분석 다시 보기\n\n토픽 1에서 기술적 분석을 '차트로 미래 가격을 예측하는 방법'으로 소개했습니다. 여기서는 실전에서 가장 기본이 되는 개념들을 배웁니다. 기술적 분석은 **가격은 모든 정보를 반영하고, 추세는 지속되며, 역사는 반복된다**는 세 가정 위에 서 있습니다.\n\n## 추세\n\n**추세(Trend)**는 주가가 일정 방향으로 움직이는 흐름입니다.\n\n| 추세 | 방향 |\n|------|------|\n| 상승추세 | 고점과 저점이 점점 높아짐 |\n| 하락추세 | 고점과 저점이 점점 낮아짐 |\n| 횡보(박스권) | 일정 범위에서 오르내림 |\n\n\"추세는 친구다\"라는 격언처럼, 기술적 분석은 추세를 확인하고 그 방향에 따르려 합니다.\n\n## 지지선과 저항선\n\n- **지지선(Support)**: 주가가 내려갈 때 잘 안 뚫리고 반등하는 가격대 (수요가 몰리는 바닥)\n- **저항선(Resistance)**: 주가가 올라갈 때 잘 못 넘는 가격대 (매도가 몰리는 천장)\n\n주가가 지지선에서 반등하거나 저항선에서 눌리는 경향을 이용합니다. 저항선을 강하게 뚫으면(**돌파**) 그 저항선이 새로운 지지선이 되기도 합니다.\n\n## 이동평균선\n\n**이동평균선(MA)**은 일정 기간의 평균 주가를 이은 선입니다. 예를 들어 20일 이동평균선은 최근 20일 종가의 평균입니다. 하루하루의 등락을 완만하게 만들어 추세를 보여줍니다.\n\n- 단기 이평선이 장기 이평선을 아래에서 위로 뚫으면 **골든크로스**(상승 신호로 해석)\n- 단기 이평선이 장기 이평선을 위에서 아래로 뚫으면 **데드크로스**(하락 신호로 해석)\n\n## 거래량\n\n**거래량**은 일정 기간 거래된 주식 수입니다. \"거래량은 주가에 선행한다\"는 말처럼, 가격 변화에 거래량이 실렸는지가 신호의 신뢰도를 높입니다. 거래량이 크게 늘며 저항선을 돌파하면 더 신뢰할 만한 신호로 봅니다.\n\n## 한계와 주의\n\n기술적 분석은 확률적 경향일 뿐 확정된 예측이 아닙니다. 같은 차트도 다르게 해석될 수 있고, 모두가 같은 신호를 보면 효과가 사라지기도 합니다. 기본적 분석과 함께, 보조적으로 활용하는 것이 바람직합니다.\n\n## 왜 중요한가\n\n기술적 분석의 기본 용어(추세·지지·저항·이평선·거래량)는 투자 뉴스와 리포트에 자주 등장합니다. 개념을 알면 매매 타이밍 논의를 이해하고, 기본적 분석과 균형 있게 활용할 수 있습니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"finance\",\"d\"]\n8:[\"trackId\",\"track4\",\"d\"]\n9:[\"topicId\",\"track4.technical-analysis\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ZTGZ0yjmR-pFsmwSalRjv\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"finance\",\"tracks\",\"track4\",\"track4.technical-analysis\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track4\",\"d\"],{\"children\":[[\"topicId\",\"track4.technical-analysis\"  넘고 눌리는 천장 가격대를 ______(이)라고 한다.\",\"answers\":[\"저항선\",\"저항\",\"resistance\",\"저항대\"],\"output\":\"저항선\",\"explain\":\"저항선(Resistance)은 주가가 올라갈 때 매도가 몰려 잘 못 넘는 가격대(천장)입니다. 강하게 돌파하면 이후 지지선으로 바뀌기도 합니다.\"},{\"id\":\"fb4\",\"prompt\":\"단기 이동평균선이 장기 이동평균선을 아래에서 위로 뚫는, 상승 신호로 해석되는 현상을 넣으세요.\",\"code\":\"단기 이동평균선이 장기 이동평균선을 아래에서 위로 돌파하는 것을 ______(이)라고 하며 상승 신호로 본다.\",\"answers\":[\"골든크로스\",\"골든 크로스\",\"golden cross\"],\"output\":\"골든크로스\",\"explain\":\"골든크로스는 단기 이동평균선이 장기 이동평균선을 아래에서 위로 뚫는 현상으로, 상승 전환 신호로 해석됩니다. 반대는 데드크로스입니다.\"},{\"id\":\"fb5\",\"prompt\":\"일정 기간 거래된 주식 수로, '주가에 선행한다'고 여겨지는 지표를 넣으세요.\",\"code\":\"일정 기간 거래된 주식 수를 ______(이)라고 하며, 신호에 이것이 실렸는지가 신뢰도를 높인다.\",\"answers\":[\"거래량\",\"거래 량\",\"volume\"],\"output\":\"거래량\",\"explain\":\"거래량은 일정 기간 거래된 주식 수입니다. '거래량은 주가에 선행한다'는 말처럼, 가격 변화에 거래량이 실렸는지가 기술적 신호의 신뢰도를 높입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"기술적 분석의 기본 가정으로 보기 어려운 것은?\",\"options\":[\"가격은 모든 정보를 반영한다\",\"추세는 지속되는 경향이 있다\",\"역사(패턴)는 반복된다\",\"재무제표가 주가를 결정한다\"],\"answer\":3,\"explain\":\"재무제표로 가치를 따지는 것은 기본적 분석입니다. 기술적 분석은 '가격은 정보를 반영, 추세는 지속, 역사는 반복'이라는 가정에 기반합니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"지지선(Support)에 대한 설명으로 옳은 것은?\",\"options\":[\"주가가 올라갈 때 잘 못 넘는 천장\",\"주가가 내려갈 때 수요가 몰려 반등하는 바닥\",\"거래량의 평균선\",\"배당을 주는 가격\"],\"answer\":1,\"explain\":\"지지선은 주가가 하락할 때 수요가 몰려 잘 안 뚫리고 반등하는 바닥 가격대입니다. 천장 역할을 하는 것은 저항선입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"20일 이동평균선이 의미하는 것으로 알맞은 것은?\",\"options\":[\"최근 20일간 종가의 평균을 이은 선\",\"20일 후의 예상 주가\",\"20일간 거래량 합계\",\"20번째로 높은 주가\"],\"answer\":0,\"explain\":\"20일 이동평균선은 최근 20일 종가의 평균을 이은 선입니다. 하루하루 등락을 완만하게 만들어 추세를 보여줍니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"단기 이평선이 장기 이평선을 '위에서 아래로' 뚫는 현상과 그 해석은?\",\"options\":[\"골든크로스 - 상승 신호\",\"데드크로스 - 하락 신호\",\"골든크로스 - 하락 신호\",\"데드크로스 - 상승 신호\"],\"answer\":1,\"explain\":\"단기 이평선이 장기 이평선을 위에서 아래로 뚫으면 데드크로스로, 하락 전환 신호로 해석됩니다. 반대(아래→위)는 골든크로스(상승 신호)입니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"기술적 분석을 대하는 바람직한 태도는?\",\"options\":[\"확정된 예측이므로 100% 신뢰한다\",\"확률적 경향일 뿐이므로 기본적 분석과 함께 보조적으로 활용한다\",\"거래량은 볼 필요가 없다\",\"차트만 보면 손실이 절대 없다\"],\"answer\":1,\"explain\":\"기술적 분석은 확정 예측이 아니라 확률적 경향입니다. 같은 차트도 달리 해석될 수 있으므로, 기본적 분석과 함께 보조적으로 활용하는 것이 바람직합니다.\"}]},\"faq\":[{\"q\":\"골든크로스가 뜨면 반드시 오르나요?\",\"a\":\"아닙니다. 골든크로스는 상승 신호로 '해석되는' 경향일 뿐, 보장이 아닙니다. 이동평균선은 과거 데이터의 평균이라 후행적이고, 거짓 신호도 자주 나옵니다. 거래량 등 다른 근거와 함께 판단해야 합니다.\"},{\"q\":\"저항선을 돌파하면 왜 지지선이 되나요?\",\"a\":\"이전에 매물이 쏟아지던 저항 가격대를 강한 거래량으로 넘어서면, 그 가격이 이제는 '싸게 느껴지는' 기준이 되어 하락 시 매수세가 유입되는 경향이 있습니다. 그래서 돌파된 저항선이 새로운 지지선 역할을 하기도 합니다.\"},{\"q\":\"기본적 분석과 기술적 분석 중 무엇이 우월한가요?\",\"a\":\"우열의 문제가 아닙니다. 기본적 분석은 '무엇을 살지', 기술적 분석은 '언제 살지'에 강점이 있어 상호보완적입니다. 다만 초보자는 가치를 이해하는 기본적 분석을 토대로 삼고, 기술적 분석을 타이밍 참고용으로 쓰는 것이 안전합니다.\"}],\"courseId\":\"finance\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"디지털 뱅킹 \u0026 AI 리터러시\",\"description\":\"전통 금융이 어떻게 디지털·데이터·AI 기반으로 바뀌고 있는지 큰 그림을 잡습니다. 디지털 뱅킹의 진화부터 핀테크, 마이데이터, 금융 AI, 리스크·규제, 디지털 자산까지 오늘날 금융의 지형을 이해합니다.\",\"topicOrder\":[\"track1.digital-banking-evolution\",\"track1.fintech-innovation\",\"track1.mydata\",\"track1.financial-ai\",\"track1.risk-regulation\",\"track1.digital-assets\"],\"topicFiles\":[\"topics/t1-digital-banking-evolution.json\",\"topics/t2-fintech-innovation.json\",\"topics/t3-mydata.json\",\"topics/t4-financial-ai.json\",\"topics/t5-risk-regulation.json\",\"topics/t6-digital-assets.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track2\",\"order\":2,\"title\":\"Finance 입문\",\"description\":\"금융의 가장 기초가 되는 개념을 다집니다. 돈과 금융의 의미부터 금리, 화폐의 시간가치, 금융시장 구조, 금융기관·상품, 위험과 수익까지 모든 금융 학습의 토대를 세웁니다.\",\"topicOrder\":[\"track2.money-basics\",\"track2.interest-rate\",\"track2.time-value\",\"track2.financial-market\",\"track2.institutions-products\",\"track2.risk-return\"],\"topicFiles\":[\"topics/t1-money-basics.json\",\"topics/t2-interest-rate.json\",\"topics/t3-time-value.json\",\"topics/t4-financial-market.json\",\"topics/t5-institutions-products.json\",\"topics/t6-risk-return.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track3\",\"order\":3,\"title\":\"거시경제 매커니즘 이해\",\"description\":\"시장 전체를 움직이는 큰 그림을 읽습니다. GDP와 성장률, 물가와 인플레이션, 통화정책과 재정정책, 경기순환과 경제지표, 환율과 국제수지까지 거시경제가 어떻게 맞물려 돌아가는지 이해합니다.\",\"topicOrder\":[\"track3.gdp-basics\",\"track3.inflation\",\"track3.monetary-policy\",\"track3.fiscal-policy\",\"track3.business-cycle\",\"track3.exchange-rate\"],\"topicFiles\":[\"topics/t1-gdp-basics.json\",\"topics/t2-inflation.json\",\"topics/t3-monetary-policy.json\",\"topics/t4-fiscal-policy.json\",\"topics/t5-business-cycle.json\",\"topics/t6-exchange-rate.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track4\",\"order\":4,\"title\":\"증권분석·기업가치평가\",\"description\":\"주식과 채권을 분석하고 기업 가치를 매기는 법을 배웁니다. 기본적·기술적 분석, 재무제표 읽기, PER·PBR 등 투자지표, 상대·절대 가치평가, 채권과 금리, 기술적 분석 기초까지 실전 증권분석의 뼈대를 세웁니다.\",\"topicOrder\":[\"track4.analysis-approaches\",\"track4.financial-statements\",\"track4.valuation-metrics\",\"track4.valuation-methods\",\"track4.bonds\",\"track4.technical-analysis\"],\"topicFiles\":[\"topics/t1-analysis-approaches.json\",\"topics/t2-financial-statements.json\",\"topics/t3-valuation-metrics.json\",\"topics/t4-valuation-methods.json\",\"topics/t5-bonds.json\",\"topics/t6-technical-analysis.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track5\",\"order\":5,\"title\":\"퀀트투자·자산배분\",\"description\":\"개별 종목을 넘어 여러 자산을 조합해 투자하는 법을 배웁니다. 포트폴리오와 분산, 기대수익률·위험 측정, 자산배분 원리와 대표 전략, 퀀트투자와 팩터·스마트베타까지 데이터 기반 투자의 뼈대를 세웁니다.\",\"topicOrder\":[\"track5.portfolio-basics\",\"track5.return-risk-measure\",\"track5.asset-allocation\",\"track5.allocation-strategies\",\"track5.quant-investing\",\"track5.factors-smartbeta\"],\"topicFiles\":[\"topics/t1-portfolio-basics.json\",\"topics/t2-return-risk-measure.json\",\"topics/t3-asset-allocation.json\",\"topics/t4-allocation-strategies.json\",\"topics/t5-quant-investing.json\",\"topics/t6-factors-smartbeta.json\"],\"pr

",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T9d6,"])</script><script>self.__next_f.push([1,"## 기업가치평가란\n\n**기업가치평가(Valuation)**는 기업이 얼마짜리인지 그 가치를 매기는 작업입니다. 크게 두 가지 접근이 있습니다.\n\n| 구분 | 상대가치평가 | 절대가치평가 |\n|------|-------------|-------------|\n| 방법 | 비슷한 기업과 비교 | 미래 현금흐름을 직접 계산 |\n| 대표 도구 | PER, PBR 등 배수 | DCF(현금흐름할인법) |\n| 장점 | 간단·직관적 | 이론적으로 정교 |\n| 단점 | 비교 대상에 좌우 | 가정에 민감 |\n\n## 상대가치평가\n\n**상대가치평가**는 비슷한 기업(동종 업계)의 지표와 비교해 가치를 매깁니다. 앞서 배운 PER·PBR이 여기에 쓰입니다.\n\n- 예: 동종 업계 평균 PER이 15배인데, A기업 PER이 10배라면 상대적으로 저평가\n- 방식: 대상 기업의 EPS × 업종 평균 PER = 적정 주가 추정\n\n간단하고 빠르지만, 비교 대상 선정과 시장 분위기에 결과가 좌우되는 한계가 있습니다.\n\n## 절대가치평가와 DCF\n\n**절대가치평가**는 비교 없이 그 기업이 **미래에 벌어들일 현금흐름**을 바탕으로 가치를 직접 계산합니다. 대표적인 방법이 **DCF(현금흐름할인법, Discounted Cash Flow)**입니다.\n\nDCF의 핵심 논리는 앞서 배운 **화폐의 시간가치**입니다.\n\n1. 기업이 미래에 벌 현금흐름을 추정한다\n2. 그 미래 현금을 **할인율로 현재가치로 환산**한다\n3. 현재가치를 모두 더하면 기업가치\n\n즉 \"이 기업이 앞으로 벌 돈을 다 현재가치로 바꾸면 지금 얼마\"인지를 구하는 것입니다.\n\n## 할인율의 역할\n\nDCF에서 **할인율**은 결과를 크게 좌우합니다. 위험이 큰 기업일수록 높은 할인율을 적용해 미래 현금을 더 보수적으로 평가합니다. 할인율이 높으면 기업가치는 낮게 계산됩니다.\n\n## 어떤 방법이 정답인가\n\n정답은 없습니다. 실무에서는 여러 방법을 함께 써서 가치의 '범위'를 추정합니다. 상대가치로 빠르게 감을 잡고, DCF로 본질 가치를 검증하는 식으로 병행합니다. 평가는 정밀과학이 아니라 합리적 추정임을 이해하는 것이 중요합니다.\n\n## 왜 중요한가\n\n가치평가는 기본적 분석의 종착점입니다. 상대가치와 절대가치의 논리를 이해하면, 애널리스트 리포트의 '목표주가'가 어떻게 나오는지, 그 숫자를 어떻게 받아들여야 하는지 알 수 있습니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"finance\",\"d\"]\n8:[\"trackId\",\"track4\",\"d\"]\n9:[\"topicId\",\"track4.valuation-methods\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ZTGZ0yjmR-pFsmwSalRjv\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"finance\",\"tracks\",\"track4\",\"track4.valuation-methods\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track4\",\"d\"],{\"children\":[[\"topicId\",\"track4.valuation-methods\",\"d\" 세요.\",\"code\":\"미래 현금흐름을 현재가치로 할인해 더하는 대표적 가치평가법을 ______(현금흐름할인법)(이)라고 한다.\",\"answers\":[\"DCF\",\"dcf\",\"현금흐름할인법\",\"현금흐름할인\"],\"output\":\"DCF\",\"explain\":\"DCF(Discounted Cash Flow, 현금흐름할인법)는 기업의 미래 현금흐름을 할인율로 현재가치화해 모두 더함으로써 기업가치를 구하는 절대가치평가법입니다.\"},{\"id\":\"fb4\",\"prompt\":\"DCF의 바탕이 되는, 미래의 돈을 현재가치로 환산하는 근거가 되는 개념을 넣으세요. (Track 2에서 학습)\",\"code\":\"DCF는 미래의 돈을 현재가치로 바꾸는 화폐의 ______ 개념에 기반한다.\",\"answers\":[\"시간가치\",\"시간 가치\",\"Time Value\"],\"output\":\"시간가치\",\"explain\":\"DCF는 화폐의 시간가치 개념에 기반합니다. 미래에 벌 현금을 할인율로 현재가치화하는 것이 핵심이며, 이는 Track 2에서 배운 현재가치 계산과 같은 원리입니다.\"},{\"id\":\"fb5\",\"prompt\":\"DCF에서 위험이 클수록 높게 적용해 미래 현금을 보수적으로 평가하게 하는 값을 넣으세요.\",\"code\":\"DCF에서 미래 현금흐름을 현재가치로 바꿀 때 쓰는 ______(이)가 높을수록 기업가치는 낮게 계산된다.\",\"answers\":[\"할인율\",\"discount rate\"],\"output\":\"할인율\",\"explain\":\"할인율은 미래 현금흐름을 현재가치로 환산할 때 쓰는 비율입니다. 위험이 큰 기업일수록 높은 할인율을 적용하며, 할인율이 높을수록 기업가치는 낮게 계산됩니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"상대가치평가에 대한 설명으로 옳은 것은?\",\"options\":[\"미래 현금흐름을 직접 계산한다\",\"비슷한 기업의 PER·PBR 등과 비교해 가치를 매긴다\",\"할인율을 반드시 사용한다\",\"비교 대상이 필요 없다\"],\"answer\":1,\"explain\":\"상대가치평가는 동종 업계 기업의 지표(PER·PBR 등)와 비교해 가치를 매기는 방식입니다. 간단하지만 비교 대상 선정에 좌우됩니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"DCF(현금흐름할인법)의 핵심 논리로 알맞은 것은?\",\"options\":[\"과거 주가 패턴을 분석한다\",\"미래 현금흐름을 할인율로 현재가치화해 더한다\",\"동종 업계 평균과 비교한다\",\"배당금만으로 가치를 정한다\"],\"answer\":1,\"explain\":\"DCF는 기업이 미래에 벌 현금흐름을 추정하고, 이를 할인율로 현재가치화해 모두 더해 기업가치를 구합니다. 화폐의 시간가치가 그 바탕입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"동종 업계 평균 PER이 15배이고 A기업의 PER이 10배라면 상대적 판단은?\",\"options\":[\"A기업이 상대적으로 고평가\",\"A기업이 상대적으로 저평가\",\"정확히 적정 가격\",\"비교할 수 없다\"],\"answer\":1,\"explain\":\"업계 평균(15배)보다 A기업 PER(10배)이 낮으므로, 이익 대비 주가가 상대적으로 싼 저평가로 볼 수 있습니다(다른 조건이 비슷하다는 전제).\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"DCF에서 할인율을 '높게' 적용하면 기업가치는 어떻게 되는가?\",\"options\":[\"높게 계산된다\",\"낮게 계산된다\",\"변하지 않는다\",\"항상 0이 된다\"],\"answer\":1,\"explain\":\"할인율이 높으면 미래 현금을 더 크게 할인(나눗셈)하므로 현재가치가 작아지고, 결과적으로 기업가치는 낮게 계산됩니다. 위험이 큰 기업에 높은 할인율을 적용합니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"실무에서 기업가치를 평가하는 바람직한 태도는?\",\"options\":[\"한 가지 방법의 단일 숫자만 신뢰한다\",\"여러 방법을 병행해 가치의 범위로 추정한다\",\"평가는 완벽한 정밀과학이라 여긴다\",\"가정은 중요하지 않다\"],\"answer\":1,\"explain\":\"가치평가는 정밀과학이 아니라 합리적 추정입니다. 상대가치·절대가치 등 여러 방법을 병행해 가치의 범위를 추정하고 서로 검증하는 것이 바람직합니다.\"}]},\"faq\":[{\"q\":\"애널리스트의 '목표주가'는 어떻게 나오나요?\",\"a\":\"대개 상대가치(업종 PER·PBR 적용)나 절대가치(DCF) 등의 방법으로 산출합니다. 예를 들어 예상 EPS에 목표 PER을 곱해 목표주가를 제시합니다. 다만 가정에 따라 달라지므로, 숫자 자체보다 그 근거와 가정을 확인하는 것이 중요합니다.\"},{\"q\":\"DCF가 더 정교하다면 상대가치평가는 왜 쓰나요?\",\"a\":\"DCF는 미래 현금흐름·할인율 등 가정이 많아 입력값에 매우 민감합니다. 상대가치평가는 빠르고 직관적이라 현실에서 널리 쓰입니다. 둘은 우열이 아니라 용도가 다르며, 함께 쓰면 서로의 약점을 보완합니다.\"},{\"q\":\"적자 기업도 가치평가가 가능한가요?\",\"a\":\"가능하지만 방법을 달리해야 합니다. 이익이 없어 PER을 못 쓰면 PBR, 매출 대비 지표(PSR), 또는 미래 흑자 전환을 가정한 DCF 등을 활용합니다. 특히 성장 초기 기업은 미래 성장성에 초점을 둔 평가가 필요합니다.\"}],\"courseId\":\"finance\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"디지털 뱅킹 \u0026 AI 리터러시\",\"description\":\"전통 금융이 어떻게 디지털·데이터·AI 기반으로 바뀌고 있는지 큰 그림을 잡습니다. 디지털 뱅킹의 진화부터 핀테크, 마이데이터, 금융 AI, 리스크·규제, 디지털 자산까지 오늘날 금융의 지형을 이해합니다.\",\"topicOrder\":[\"track1.digital-banking-evolution\",\"track1.fintech-innovation\",\"track1.mydata\",\"track1.financial-ai\",\"track1.risk-regulation\",\"track1.digital-assets\"],\"topicFiles\":[\"topics/t1-digital-banking-evolution.json\",\"topics/t2-fintech-innovation.json\",\"topics/t3-mydata.json\",\"topics/t4-financial-ai.json\",\"topics/t5-risk-regulation.json\",\"topics/t6-digital-assets.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track2\",\"order\":2,\"title\":\"Finance 입문\",\"description\":\"금융의 가장 기초가 되는 개념을 다집니다. 돈과 금융의 의미부터 금리, 화폐의 시간가치, 금융시장 구조, 금융기관·상품, 위험과 수익까지 모든 금융 학습의 토대를 세웁니다.\",\"topicOrder\":[\"track2.money-basics\",\"track2.interest-rate\",\"track2.time-value\",\"track2.financial-market\",\"track2.institutions-products\",\"track2.risk-return\"],\"topicFiles\":[\"topics/t1-money-basics.json\",\"topics/t2-interest-rate.json\",\"t

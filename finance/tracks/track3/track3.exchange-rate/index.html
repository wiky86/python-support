",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T917,"])</script><script>self.__next_f.push([1,"## 환율이란?\n\n**환율**은 한 나라 돈과 다른 나라 돈의 교환 비율입니다. 우리나라에서는 보통 '1달러 = 몇 원'의 형태로 표시합니다. 예를 들어 환율이 1,300원이면 1달러를 사는 데 1,300원이 든다는 뜻입니다.\n\n## 환율 상승과 하락 (주의: 헷갈리기 쉬움)\n\n환율은 '원화의 가격'이 아니라 '외화(달러)의 가격'이라는 점이 핵심입니다.\n\n| 표현 | 의미 | 원화 가치 |\n|------|------|-----------|\n| 환율 상승 (1,300→1,400) | 달러가 비싸짐 | 원화 가치 하락(약세) |\n| 환율 하락 (1,300→1,200) | 달러가 싸짐 | 원화 가치 상승(강세) |\n\n**환율이 오르면 원화 가치는 떨어지고(원화 약세), 환율이 내리면 원화 가치는 오릅니다(원화 강세).** 방향이 반대라 헷갈리기 쉬우니 주의해야 합니다.\n\n- **평가절하(원화 약세)**: 원화 가치 하락 = 환율 상승\n- **평가절상(원화 강세)**: 원화 가치 상승 = 환율 하락\n\n## 환율이 경제에 미치는 영향\n\n### 환율 상승(원화 약세)일 때\n- **수출**: 유리 (달러로 받은 돈을 원화로 바꾸면 더 많아짐, 가격경쟁력↑)\n- **수입**: 불리 (수입품 원화 가격 상승)\n- **물가**: 수입 물가 상승으로 국내 물가 상승 압력\n\n### 환율 하락(원화 강세)일 때\n- **수출**: 불리\n- **수입**: 유리\n- **해외여행·유학**: 유리 (같은 원화로 더 많은 달러)\n\n## 국제수지\n\n**국제수지**는 일정 기간 한 나라가 외국과 주고받은 모든 경제적 거래를 기록한 것입니다. 그중 가장 많이 언급되는 것이 **경상수지**입니다.\n\n- **경상수지**: 상품·서비스 수출입, 소득 등의 수지 (흑자면 번 외화 \u003e 쓴 외화)\n\n경상수지가 흑자면 외화가 들어와 대체로 원화 강세(환율 하락) 요인이 되고, 적자면 반대 방향으로 작용하는 경향이 있습니다.\n\n## 왜 중요한가\n\n환율은 수출입, 물가, 여행, 투자까지 광범위하게 영향을 줍니다. 특히 '환율 상승 = 원화 약세'라는 반대 방향 관계를 정확히 잡아두면, 환율 뉴스를 헷갈리지 않고 해석할 수 있습니다. 이 트랙에서 배운 금리·물가·경기와도 모두 맞물리는 종합 지표입니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"finance\",\"d\"]\n8:[\"trackId\",\"track3\",\"d\"]\n9:[\"topicId\",\"track3.exchange-rate\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ZTGZ0yjmR-pFsmwSalRjv\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"finance\",\"tracks\",\"track3\",\"track3.exchange-rate\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track3\",\"d\"],{\"children\":[[\"topicId\",\"track3.exchange-rate\",\"d\"],{\"children\":[\"__PAGE__?{\\\"courseId\\\":\\\"finance\\\",\\\"trackId 많아지고, 가격 경쟁력도 높아지기 때문입니다. 반대로 수입은 불리해집니다.\"},{\"id\":\"fb4\",\"prompt\":\"일정 기간 한 나라가 외국과 주고받은 모든 경제적 거래를 기록한 것을 넣으세요.\",\"code\":\"일정 기간 한 나라가 외국과 주고받은 모든 경제적 거래를 기록한 것을 ______(이)라고 한다.\",\"answers\":[\"국제수지\",\"국제 수지\",\"balance of payments\"],\"output\":\"국제수지\",\"explain\":\"국제수지는 일정 기간 한 나라가 외국과 행한 모든 경제적 거래를 기록한 것입니다. 그중 상품·서비스 수출입 등을 담은 경상수지가 가장 많이 언급됩니다.\"},{\"id\":\"fb5\",\"prompt\":\"국제수지 중 상품·서비스 수출입과 소득 등의 수지를 담는, 가장 많이 언급되는 항목을 넣으세요.\",\"code\":\"국제수지 중 상품·서비스 수출입과 소득 등을 기록하는 항목을 ______(이)라고 한다.\",\"answers\":[\"경상수지\",\"경상 수지\",\"current account\"],\"output\":\"경상수지\",\"explain\":\"경상수지는 상품·서비스 수출입, 소득 등의 수지를 담는 국제수지의 핵심 항목입니다. 흑자면 번 외화가 쓴 외화보다 많다는 뜻입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"원/달러 환율이 1,300원에서 1,400원으로 올랐다면?\",\"options\":[\"원화 가치가 올랐다(원화 강세)\",\"원화 가치가 떨어졌다(원화 약세)\",\"달러 가치가 떨어졌다\",\"원화와 달러 가치가 모두 올랐다\"],\"answer\":1,\"explain\":\"환율 상승은 달러가 비싸진 것으로, 원화 가치가 떨어진 원화 약세(평가절하)입니다. 환율과 원화 가치는 반대로 움직입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"환율 상승(원화 약세)이 유리하게 작용하는 쪽은?\",\"options\":[\"수출 기업\",\"수입 기업\",\"해외여행객\",\"해외 유학생\"],\"answer\":0,\"explain\":\"환율 상승 시 수출 기업이 유리합니다. 달러로 받은 대금이 원화로 더 많아지고 가격 경쟁력도 높아집니다. 수입·해외여행·유학은 불리해집니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"환율 하락(원화 강세)일 때 유리해지는 경우로 알맞은 것은?\",\"options\":[\"수출 기업\",\"해외여행이나 수입\",\"외화로 빚을 갚아야 하는 기업이 더 불리해짐\",\"수입 물가가 상승함\"],\"answer\":1,\"explain\":\"환율 하락(원화 강세) 시 같은 원화로 더 많은 달러를 살 수 있어 해외여행·유학·수입이 유리합니다. 반대로 수출은 불리해집니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"환율 상승(원화 약세)이 국내 물가에 주는 일반적 영향은?\",\"options\":[\"수입품 가격이 내려 물가가 하락한다\",\"수입품 원화 가격이 올라 물가 상승 압력이 생긴다\",\"물가에 아무 영향이 없다\",\"물가가 반드시 안정된다\"],\"answer\":1,\"explain\":\"환율이 오르면 수입품의 원화 가격이 올라 수입 물가가 상승하고, 이것이 국내 물가 상승 압력으로 작용합니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"경상수지가 흑자일 때 환율에 주는 일반적인 영향은?\",\"options\":[\"외화가 들어와 원화 강세(환율 하락) 요인이 된다\",\"외화가 빠져나가 원화 약세 요인이 된다\",\"환율과 전혀 무관하다\",\"환율을 정부가 고정시킨다\"],\"answer\":0,\"explain\":\"경상수지 흑자는 외화가 국내로 들어오는 것이므로, 외화 공급이 늘어 대체로 원화 강세(환율 하락) 요인으로 작용합니다.\"}]},\"faq\":[{\"q\":\"환율은 누가 정하나요?\",\"a\":\"우리나라는 기본적으로 외환시장에서 수요와 공급에 따라 환율이 결정되는 변동환율제를 채택합니다. 다만 급격한 변동 시에는 정부·중앙은행이 시장 안정을 위해 개입하기도 합니다.\"},{\"q\":\"'환율 상승=원화 약세'가 왜 헷갈리나요?\",\"a\":\"환율 숫자(원)가 '오르는데' 원화 가치는 '떨어지기' 때문입니다. 핵심은 환율이 '달러의 가격'이라는 점입니다. 달러 가격이 오른다(환율 상승)는 건 상대적으로 원화가 싸졌다(약세)는 뜻입니다. '달러의 값'으로 생각하면 방향이 명확해집니다.\"},{\"q\":\"환율이 오르면 수출이 유리한데 왜 마냥 좋지 않나요?\",\"a\":\"환율 상승은 수출에 유리하지만, 동시에 수입 물가를 올려 국내 물가 상승과 원자재 비용 증가를 부릅니다. 또 외화 부채가 있는 기업은 상환 부담이 커집니다. 그래서 환율은 어느 한 방향이 무조건 좋다기보다 균형과 안정이 중요합니다.\"}],\"courseId\":\"finance\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"디지털 뱅킹 \u0026 AI 리터러시\",\"description\":\"전통 금융이 어떻게 디지털·데이터·AI 기반으로 바뀌고 있는지 큰 그림을 잡습니다. 디지털 뱅킹의 진화부터 핀테크, 마이데이터, 금융 AI, 리스크·규제, 디지털 자산까지 오늘날 금융의 지형을 이해합니다.\",\"topicOrder\":[\"track1.digital-banking-evolution\",\"track1.fintech-innovation\",\"track1.mydata\",\"track1.financial-ai\",\"track1.risk-regulation\",\"track1.digital-assets\"],\"topicFiles\":[\"topics/t1-digital-banking-evolution.json\",\"topics/t2-fintech-innovation.json\",\"topics/t3-mydata.json\",\"topics/t4-financial-ai.json\",\"topics/t5-risk-regulation.json\",\"topics/t6-digital-assets.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track2\",\"order\":2,\"title\":\"Finance 입문\",\"description\":\"금융의 가장 기초가 되는 개념을 다집니다. 돈과 금융의 의미부터 금리, 화폐의 시간가치, 금융시장 구조, 금융기관·상품, 위험과 수익까지 모든 금융 학습의 토대를 세웁니다.\",\"topicOrder\":[\"track2.money-basics\",\"track2.interest-rate\",\"track2.time-value\",\"track2.financial-market\",\"track2.institutions-products\",\"track2.risk-return\"],\"topicFiles\":[\"topics/t1-money-basics.json\",\"topics/t2-interest-rate.json\",\"topics/t3-time-value.json\",\"topics/t4-financial-market.json\",\"topics/t5-institutions-products.json\",\"topics/t6-risk-return.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track3\",\"order\":3,\"title\":\"거시경제 매커니즘 이해\",\"description\":\"시장 전체를 움직이는 큰 그림을 읽습니다. GDP와 성장률, 물가와 인플레이션,

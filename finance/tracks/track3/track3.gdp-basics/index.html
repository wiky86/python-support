:text-white">이 토픽은 아직 잠겨 있습니다</h2><p class="text-sm text-slate-500 dark:text-slate-400 max-w-md mx-auto">이전 토픽의 복습 퀴즈를 통과하면 다음 토픽이 자동으로 열립니다.</p></div><div class="flex items-center justify-center gap-4 pt-4"><a class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition-colors" href="/python-support/finance/">과목 학습 지도로 돌아가기</a></div></div></main><footer class="py-6 border-t border-slate-200 dark:border-slate-800 text-center text-xs text-slate-500 dark:text-slate-400 w-full"><div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2"><span>© 2026 UBION. All rights reserved.</span><span class="font-mono text-[11px]">Next.js • React • Supabase</span></div></footer><script src="/python-support/_next/static/chunks/webpack-bf84006d145baec9.js" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0]);self.__next_f.push([2,null])</script><script>self.__next_f.push([1,"1:HL[\"/python-support/_next/static/css/72cc07c818b0d08a.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"2:I[2846,[],\"\"]\n4:I[4922,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"44\",\"static/chunks/44-c3178d8f0dbf8251.js\",\"803\",\"static/chunks/803-e6c639b913392d25.js\",\"452\",\"static/chunks/452-c01e5b9372da4c1f.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"754\",\"static/chunks/754-f909b3d8066643b3.js\",\"775\",\"static/chunks/app/%5BcourseId%5D/tracks/%5BtrackId%5D/%5BtopicId%5D/page-a18095c710efe369.js\"],\"TopicView\"]\n6:I[4707,[],\"\"]\na:I[6423,[],\"\"]\nb:I[7766,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"44\",\"static/chunks/44-c3178d8f0dbf8251.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"AuthProvider\"]\nc:I[4783,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"44\",\"static/chunks/44-c3178d8f0dbf8251.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T9a7,"])</script><script>self.__next_f.push([1,"## 미시경제 vs 거시경제\n\n경제학은 보는 범위에 따라 둘로 나뉩니다.\n\n| 구분 | 관점 | 예시 질문 |\n|------|------|-----------|\n| 미시경제 | 개별 가계·기업·시장 | 이 상품 가격은 어떻게 정해지나? |\n| 거시경제 | 국가 경제 전체 | 우리나라 경제는 성장하고 있나? |\n\n**거시경제(Macroeconomics)**는 나무가 아니라 숲을 봅니다. 한 나라의 생산·물가·고용·금리 같은 **경제 전체의 흐름**을 다룹니다.\n\n## GDP란?\n\n거시경제의 가장 중요한 지표는 **GDP(국내총생산)**입니다. GDP는 **일정 기간 한 나라 안에서 새로 생산된 모든 최종 재화·서비스의 시장가치 합계**입니다.\n\n핵심 포인트를 뜯어보면:\n- **일정 기간**: 보통 1년 또는 분기\n- **한 나라 안에서(국내)**: 생산 주체의 국적과 무관, 영토 기준\n- **최종 재화**: 중간재는 제외 (이중계산 방지)\n- **시장가치**: 시장에서 거래된 가격 기준\n\n## 경제성장률\n\n**경제성장률**은 GDP가 전년 대비 얼마나 늘었는지를 %로 나타낸 것입니다. 한 나라 경제가 커지고 있는지 판단하는 대표 지표입니다.\n\n- 계산식: **경제성장률 = (금년 실질GDP − 전년 실질GDP) ÷ 전년 실질GDP × 100**\n\n## 명목 GDP vs 실질 GDP\n\nGDP를 계산할 때 물가 변동을 어떻게 처리하느냐에 따라 둘로 나뉩니다.\n\n| 구분 | 기준 가격 | 특징 |\n|------|-----------|------|\n| 명목 GDP | 그 해의 시장가격 | 물가 상승분이 섞여 있음 |\n| 실질 GDP | 기준연도 가격 | 물가 영향 제거, 진짜 생산량 |\n\n생산량은 그대로인데 물가만 올라도 명목 GDP는 커집니다. 그래서 경제가 진짜로 성장했는지 보려면 물가 영향을 뺀 **실질 GDP**를 봐야 합니다. 경제성장률도 실질 GDP로 계산합니다.\n\n## GDP의 한계\n\nGDP는 유용하지만 완벽하지 않습니다. 시장에서 거래되지 않는 가사노동·봉사활동은 빠지고, 환경오염 같은 삶의 질 저하는 반영하지 못합니다. 그래서 GDP만으로 국민의 행복이나 복지를 완전히 측정할 수는 없습니다.\n\n## 왜 중요한가\n\nGDP와 경제성장률은 뉴스에 매일 등장하는 거시경제의 기본 언어입니다. 명목과 실질의 차이를 이해하면, '성장률'이라는 숫자가 실제로 무엇을 말하는지 정확히 읽을 수 있습니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"finance\",\"d\"]\n8:[\"trackId\",\"track3\",\"d\"]\n9:[\"topicId\",\"track3.gdp-basics\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ZTGZ0yjmR-pFsmwSalRjv\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"finance\",\"tracks\",\"track3\",\"track3.gdp-basics\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track3\",\"d\"],{\"children\":[[\"topicId\",\"track3.gdp-basics\",\"d\"],{\"children\":[\"__PAGE__?{\\\"courseId\\\":\\\"finance\\\",\\\"trackId\\\":\\\"track3\\\",\\\"topicId\\\":\\\"track3.gdp-basics\\\"}\",{}]}]}]}]}]},\"$undefined\",\"$undefined\",true],\"initialSeedData\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track3\",\"d\"],{\"children\":[[\"topicId\",\"track3.gdp-basics\",\"d\"],{\"children\":[\"__PAGE__\",{},[[\"$L3\",[\"$\",\"$L4\",null,{\"track\":{\"id\":\"track3\",\"order\":3,\"title\":\"거시경제 매커니즘 이해\",\"description\":\"시장 전체를 움직이는 큰 그림을 읽습니다. GDP와 성장률, 물가와 인플레이션, 통화정책과 재정정책, 경기순환과 경제지표, 환율과 국제수지까지 거시경제가 어떻게 맞물려 돌아가는지 이해합니다.\",\"topicOrder\":[\"track3.gdp-basics\",\"track3.inflation\",\"track3.monetary-policy\",\"track3.fiscal-policy\",\"track3.business-cycle\",\"track3.exchange-rate\"],\"topicFiles\":[\"topics/t1-gdp-basics.json\",\"topics/t2-inflation.json\",\"topics/t3-monetary-policy.json\",\"topics/t4-fiscal-policy.json\",\"topics/t5-business-cycle.json\",\"topics/t6-exchange-rate.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},\"topic\":{\"id\":\"track3.gdp-basics\",\"trackId\":\"track3\",\"order\":1,\"title\":\"거시경제의 기초와 GDP\",\"content\":\"$5\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"국가 경제 전체의 생산·물가·고용 흐름을 다루는 경제학 분야를 넣으세요.\",\"code\":\"개별 시장이 아니라 국가 경제 전체의 흐름을 다루는 경제학 분야를 ______경제라고 한다.\",\"answers\":[\"거시\",\"거시경제\",\"macro\",\"Macroeconomics\"],\"output\":\"거시\",\"explain\":\"거시경제(Macroeconomics)는 개별 가계·기업이 아니라 국가 경제 전체의 생산·물가·고용·금리 흐름을 다루는 분야입니다. '숲을 보는' 관점입니다.\"},{\"id\":\"fb2\",\"prompt\":\"일정 기간 한 나라 안에서 생산된 모든 최종 재화·서비스의 시장가치 합계를 뜻하는 지표의 약자를 넣으세요.\",\"code\":\"일정 기간 한 나라 안에서 생산된 최종 재화·서비스의 시장가치 합계를 ______(국내총생산)(이)라고 한다.\",\"answers\":[\"GDP\",\"gdp\",\"국내총생산\"],\"output\":\"GDP\",\"explain\":\"GDP(Gross Domestic Product, 국내총생산)는 일정 기간 한 나라 영토 안에서 생산된 모든 최종 재화·서비스의 시장가치 합계입니다. 거시경제의 가장 대표적인 지표입니다.\"},{\"id\":\"fb3\",\"prompt\":\"물가 변동의 영향을 제거해 진짜 생산량 변화를 보여주는 GDP를 넣으세요.\",\"code\":\"기준연도 가격으로 계산해 물가 영향을 제거한 GDP를 ______ GDP라고 하며, 경제성장률 계산에 쓰인다.\",\"answers\":[\"실질\",\"실질GDP\",\"real\"],\"output\":\"실질\",\"explain\":\"실질 GDP는 기준연도 가격으로 계산해 물가 상승분을 제거한 GDP입니다. 물가가 아닌 실제 생산량의 변화를 보여주므로 경제성장률 계산에 사용됩니다.\"},{\"id\":\"fb4\",\"prompt\":\"그 해의 시장가격으로 계산해 물가 상승분이 섞여 있는 GDP를 넣으세요.\",\"code\":\"그 해의 시장가격 그대로 계산해 물가 상승분이 포함된 GDP를 ______ GDP라고 한다.\",\"answers\":[\"명목\",\"명목GDP\",\"nominal\"],\"output\":\"명목\",\"explain\":\"명목 GDP는 그 해의 시장가격으로 계산한 GDP로, 물가 상승분이 그대로 포함됩니다. 생산량이 같아도 물가가 오르면 명목 GDP는 커집니다.\"},{\"id\":\"fb5\",\"prompt\":\"GDP가 전년 대비 얼마나 늘었는지를 %로 나타낸 지표를 넣으세요.\",\"code\":\"실질 GDP가 전년보다 얼마나 증가했는지를 %로 나타낸 것을 ______(이)라고 한다.\",\"answers\":[\"경제성장률\",\"성장률\",\"경제 성장률\"],\"output\":\"경제성장률\",\"explain\":\"경제성장률은 실질 GDP가 전년 대비 얼마나 늘었는지를 백분율로 나타낸 지표입니다. 한 나라 경제가 커지고 있는지를 판단하는 대표 지표입니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"거시경제학이 다루는 주제로 가장 알맞은 것은?\",\"options\":[\"특정 카페의 커피 가격 결정\",\"한 나라 전체의 경제성장률과 물가\",\"한 소비자의 점심 메뉴 선택\",\"개별 기업의 광고 전략\"],\"answer\":1,\"explain\":\"거시경제는 국가 경제 전체의 흐름(성장률·물가·고용 등)을 다룹니다. 개별 상품 가격이나 소비자 선택은 미시경제의 영역입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"GDP(국내총생산)에 대한 설명으로 옳은 것은?\",\"options\":[\"중간재까지 모두 합산한다\",\"일정 기간 한 나라 안에서 생산된 최종 재화·서비스의 시장가치 합계다\",\"국민의 국적을 기준으로 계산한다\",\"과거에 생산된 재고까지 포함한다\"],\"answer\":1,\"explain\":\"GDP는 일정 기간 한 나라 영토 안에서 새로 생산된 최종 재화·서비스의 시장가치 합계입니다. 중간재는 이중계산을 막기 위해 제외합니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"명목 GDP와 실질 GDP의 차이를 바르게 설명한 것은?\",\"options\":[\"명목 GDP는 물가 영향을 제거, 실질 GDP는 포함한다\",\"명목 GDP는 그 해 가격, 실질 GDP는 기준연도 가격으로 계산한다\",\"둘은 항상 같은 값이다\",\"실질 GDP가 명목 GDP보다 항상 크다\"],\"answer\":1,\"explain\":\"명목 GDP는 그 해의 시장가격으로, 실질 GDP는 기준연도 가격으로 계산합니다. 실질 GDP는 물가 영향을 제거해 진짜 생산량 변화를 보여줍니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"경제가 실제로 성장했는지 판단할 때 실질 GDP를 사용하는 이유는?\",\"options\":[\"계산이 더 간단하기 때문\",\"물가 상승분을 제거해 진짜 생산량 변화를 보기 위해서\",\"명목 GDP는 측정할 수 없기 때문\",\"실질 GDP가 항상 더 크기 때문\"],\"answer\":1,\"explain\":\"생산량이 그대로여도 물가만 오르면 명목 GDP는 커집니다. 물가 영향을 제거한 실질 GDP를 봐야 경제가 진짜 성장했는지 알 수 있습니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"GDP의 한계로 지적되는 것으로 알맞은 것은?\",\"options\":[\"시장에서 거래되지 않는 가사노동이나 환경오염을 반영하지 못한다\",\"물가를 전혀 고려할 수 없다\",\"1년 단위로만 계산할 수 있다\",\"선진국에서는 사용할 수 없다\"],\"answer\":0,\"explain\":\"GDP는 시장에서 거래된 것만 집계하므로 가사노동·봉사활동이 빠지고, 환경오염 같은 삶의 질 저하도 반영하지 못합니다. 그래서 복지·행복의 완전한 척도는 아닙니다.\"}]},\"faq\":[{\"q\":\"GDP와 GNP는 어떻게 다른가요?\",\"a\":\"GDP(국내총생산)는 '영토' 기준으로, 국적과 관계없이 한 나라 안에서 생산된 것을 집계합니다. GNP(국민총생산)는 '국적' 기준으로, 자국민이 국내외에서 생산한 것을 집계합니다. 오늘날에는 국경 간 생산이 활발해 GDP를 더 많이 사용합니다.\"},{\"q\":\"1인당 GDP는 무엇인가요?\",\"a\":\"GDP를 그 나라 인구로 나눈 값으로, 국민 한 사람당 평균 생산액을 나타냅니다. 국가 간 생활 수준을 비교할 때 총 GDP보다 1인당 GDP가 더 유용합니다. 다만 평균값이라 소득 분배 상태는 보여주지 못합니다.\"},{\"q\":\"실질 GDP가 마이너스 성장이면 어떤 의미인가요?\",\"a\":\"전년보다 실질 생산량이 줄었다는 뜻으로, 경기가 위축되고 있음을 시사합니다. 실질 GDP가 2개 분기 연속 감소하면 일반적으로 '경기침체(recession)'로 판단하는 기준으로 자주 인용됩니다.\"}],\"courseId\":\"finance\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"디지털 뱅킹 \u0026 AI 리터러시\",\"description\":\"전통 금융이 어떻게 디지털·데이터·AI 기반으로 바뀌고 있는지 큰 그림을 잡습니다. 디지털 뱅킹의 진화부터 핀테크, 마이데이터, 금융 AI, 리스크·규제, 디지털 자산까지 오늘날 금융의 지형을 이해합니다.\",\"topicOrder\":[\"track1.digital-banking-evolution\",\"track1.fintech-innovation\",\"track1.mydata\",\"track1.financial-ai\",\"track1.risk-regulation\",\"track1.digital-assets\"],\"topicFiles\":[\"topics/t1-digital-banking-evolution.json\",\"topics/t2-fintech-innovation.json\",\"topics/t3-mydata.json\",\"topics/t4-financial-ai.json\",\"topics/t5-risk-regulation.json\",\"topics/t6-digital-assets.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track2\",\"order\":2,\"title\":\"Finance 입문\",\"description\":\"금융의 가장 기초가 되는 개념을 다집니다. 돈과 금융의 의미부터 금리, 화폐의 시간가치, 금융시장 구조, 금융기관·상품, 위험과 수익까지 모든 금융 학습의 토대를 세웁니다.\",\"topicOrder\":[\"track2.money-basics\",\"track2.interest-rate\",\"track2.time-value\",\"track2.financial-market\",\"track2.institutions-products\",\"track2.risk-return\"],\"topicFiles\":[\"topics/t1-money-basics.json\",\"topics/t2-interest-rate.json\",\"topics/t3-time-value.json\",\"topics/t4-financial-market.json\",\"topics/t5-institutions-products.json\",\"topics/t6-risk-return.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track3\",\"order\":3,\"title\":\"거시경제 매커니즘 이해\",\"description\":\"시장 전체를 움직이는 큰 그림을 읽습니다. GDP와 성장률, 물가와 인플레이션, 통화정책과 재정정책, 경기순환과 경제지표, 환율과 국제수지까지 거시경제가 어떻게 맞물려 돌아가는지 이해합니다.\",\"topicOrder\":[\"track3.gdp-basics\",\"track3.inflation\",\"track3.monetary-policy\",\"track3.fiscal-policy\",\"track3.business-cycle\",\"track3.exchange-rate\"],\"topicFiles\":[\"topics/t1-gdp-basics.json\",\"topics/t2-inflation.json\",\"topics/t3-monetary-policy.json\",\"topics/t4-fiscal-policy.json\",\"topics/t5-business-cycle.json\",\"topics/t6-exchange-rate.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track4\",\"order\":4,\"title\":\"증권분석·기업가치평가\",\"description\":\"주식과 채권을 분석하고 기업 가치를 매기는 법을 배웁니다. 기본적·기술적 분석, 재무제표 읽기, PER·PBR 등 투자지표, 상대·절대 가치평가, 채권과 금리, 기술적 분석 기초까지 실전 증권분석의 뼈대를 세웁니다.\",\"topicOrder\":[\"track4.analysis-approaches\",\"track4.financial-statements\",\"track4.valuation-metrics\",\"track4.valuation-methods\",\"track4.bonds\",\"track4.technical-analysis\"],\"topicFiles\":[\"topics/t1-analysis-approaches.json\",\"topics/t2-financial-statements.json\",\"topics/t3-valuation-metrics.json\",\"topics/t4-valuation-methods.json\",\"topics/t5-bonds.json\",\"topics/t6-technical-analysis.json\"],\"projectFile\":\"project.json\",\"courseId\":\"finance\"},{\"id\":\"track5\",\"order\":5,\"title\":\"퀀트투자·자산배분\",\"description\":\"개별 종목을 넘어 여러 자산을 조합해 투자하는 법을 배웁니다. 포트폴리오와 분산, 기대수익률·위험 측정, 자산배분 원리와 대표 전략, 퀀트투자와 팩터·스마트베타까지 데이터 기반 투자의 뼈대를 세웁니다.\",\"topicOrder\":[\"track5.portfolio-basics\",\"track5.return-risk-measure\",\"track5.asset-allocation\",\"track5.allocation-strategies\",\"track5.quant-investing\",\"track5.factors-smartbeta\"],\"topicFiles\":[\"topics/t1-portfolio-basics.json\",\"topics/t2-return-risk-measure.json\",\"topics/t3-asset-allocation.json\",\"topics/t4-allocation-strategies.json\",\

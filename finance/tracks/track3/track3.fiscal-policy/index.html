",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T9d9,"])</script><script>self.__next_f.push([1,"## 재정정책이란\n\n**재정정책**은 정부가 **세금(조세)과 정부지출을 조절해 경기를 안정시키는 정책**입니다. 통화정책이 중앙은행의 몫이라면, 재정정책은 정부의 몫입니다.\n\n정부 재정은 크게 두 축으로 이뤄집니다.\n\n- **세입(수입)**: 주로 세금(조세)\n- **세출(지출)**: 복지, 사회간접자본(SOC), 국방 등\n\n## 확장적 재정정책 vs 긴축적 재정정책\n\n| 유형 | 상황 | 수단 | 효과 |\n|------|------|------|------|\n| 확장적 재정정책 | 경기 침체 | 지출 확대, 세금 인하 | 총수요 증가, 경기 부양 |\n| 긴축적 재정정책 | 경기 과열 | 지출 축소, 세금 인상 | 총수요 감소, 과열 억제 |\n\n경기가 침체되면 정부는 지출을 늘리고 세금을 줄여 사람들의 소비 여력을 키웁니다(**확장적**). 경기가 과열되면 반대로 지출을 줄이고 세금을 늘립니다(**긴축적**).\n\n## 재정수지: 흑자와 적자\n\n정부의 수입과 지출을 비교한 것이 **재정수지**입니다.\n\n- **재정흑자**: 세입 \u003e 세출 (거둔 돈이 쓴 돈보다 많음)\n- **재정적자**: 세입 \u003c 세출 (쓴 돈이 거둔 돈보다 많음)\n\n경기 부양을 위해 지출을 늘리면 흔히 **재정적자**가 발생합니다. 정부는 이 부족분을 **국채 발행**으로 메웁니다.\n\n## 국가채무\n\n**국가채무**는 정부가 진 빚의 총합입니다. 재정적자가 쌓이면 국가채무가 늘어납니다. 적정 수준의 국가채무는 경기 대응에 필요하지만, 지나치면 이자 부담과 국가 신용도 하락으로 이어질 수 있어 관리가 중요합니다.\n\n## 재정정책의 시차\n\n재정정책은 국회의 예산 심의 등 절차를 거쳐야 해서 **결정과 집행에 시간이 걸립니다.** 반면 통화정책은 상대적으로 신속하게 결정할 수 있습니다. 이 '시차' 차이가 두 정책의 중요한 특징입니다.\n\n## 정책 조합\n\n실제로는 통화정책과 재정정책을 함께 씁니다. 예를 들어 심각한 경기 침체 시에는 중앙은행의 금리 인하(완화적 통화정책)와 정부의 지출 확대(확장적 재정정책)를 동시에 동원해 경기를 부양합니다.\n\n## 왜 중요한가\n\n재정정책은 세금과 복지, 국가채무처럼 우리 삶과 직결된 이슈입니다. 통화정책과 함께 이해하면, 정부와 중앙은행이 경기 국면마다 어떤 카드를 꺼내는지 큰 그림으로 볼 수 있습니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"finance\",\"d\"]\n8:[\"trackId\",\"track3\",\"d\"]\n9:[\"topicId\",\"track3.fiscal-policy\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ZTGZ0yjmR-pFsmwSalRjv\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"finance\",\"tracks\",\"track3\",\"track3.fiscal-policy\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track3\",\"d\"],{\"children\":[[\"topicId\",\"track3.fiscal-policy\",\"d\"],{\"children\":[\"__PAGE__?{\\\"co 상태입니다. 경기 부양을 위해 지출을 늘리면 흔히 발생하며, 정부는 부족분을 국채 발행으로 메웁니다.\"},{\"id\":\"fb4\",\"prompt\":\"정부가 재정적자를 메우기 위해 발행하는, 국가가 진 빚의 증서를 넣으세요.\",\"code\":\"정부는 재정적자로 부족한 돈을 ______(을)를 발행해 조달한다.\",\"answers\":[\"국채\",\"국고채\",\"국가채권\"],\"output\":\"국채\",\"explain\":\"국채는 정부가 자금을 조달하기 위해 발행하는 채권입니다. 재정적자가 발생하면 정부는 국채를 발행해 부족분을 메우며, 이것이 쌓이면 국가채무가 됩니다.\"},{\"id\":\"fb5\",\"prompt\":\"정부가 진 빚의 총합을 뜻하는 용어를 넣으세요.\",\"code\":\"재정적자가 누적되어 늘어나는, 정부가 진 빚의 총합을 ______(이)라고 한다.\",\"answers\":[\"국가채무\",\"국가 채무\",\"나라빚\",\"국가부채\"],\"output\":\"국가채무\",\"explain\":\"국가채무는 정부가 진 빚의 총합입니다. 재정적자가 쌓이면 늘어나며, 지나치면 이자 부담과 국가 신용도 하락으로 이어질 수 있어 관리가 필요합니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"재정정책의 주체와 수단으로 올바른 것은?\",\"options\":[\"중앙은행이 금리를 조절\",\"정부가 세금과 지출을 조절\",\"은행이 대출을 조절\",\"기업이 임금을 조절\"],\"answer\":1,\"explain\":\"재정정책은 정부가 주체가 되어 세금(조세)과 정부지출을 조절하는 정책입니다. 금리·통화량 조절은 중앙은행의 통화정책입니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"경기 침체 시 시행하는 확장적 재정정책의 예로 알맞은 것은?\",\"options\":[\"정부지출 축소, 세금 인상\",\"정부지출 확대, 세금 인하\",\"금리 인상\",\"지급준비율 인상\"],\"answer\":1,\"explain\":\"확장적 재정정책은 경기 침체 시 정부지출을 늘리고 세금을 줄여 총수요를 키우고 경기를 부양합니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"재정적자가 발생했을 때 정부가 부족분을 메우는 일반적인 방법은?\",\"options\":[\"화폐를 직접 발행한다\",\"국채를 발행해 자금을 조달한다\",\"기준금리를 인하한다\",\"지급준비율을 조정한다\"],\"answer\":1,\"explain\":\"정부는 재정적자로 부족한 돈을 국채 발행으로 조달합니다. 화폐 발행은 중앙은행의 권한이며, 금리·지준율 조정은 통화정책 수단입니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"통화정책과 비교한 재정정책의 특징으로 옳은 것은?\",\"options\":[\"국회 예산 심의 등으로 결정·집행에 시간이 더 걸린다\",\"중앙은행이 단독으로 즉시 결정한다\",\"세금과 무관하다\",\"경기와 상관없이 항상 일정하다\"],\"answer\":0,\"explain\":\"재정정책은 국회의 예산 심의 등 절차를 거쳐야 해서 결정·집행에 시간이 걸립니다. 반면 통화정책은 상대적으로 신속하게 결정할 수 있습니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"심각한 경기 침체에 대응하는 일반적인 정책 조합으로 알맞은 것은?\",\"options\":[\"금리 인상 + 정부지출 축소\",\"금리 인하 + 정부지출 확대\",\"금리 인상 + 세금 인상\",\"통화량 감소 + 세금 인상\"],\"answer\":1,\"explain\":\"심각한 침체 시에는 완화적 통화정책(금리 인하)과 확장적 재정정책(지출 확대)을 함께 동원해 총수요를 키우고 경기를 부양합니다.\"}]},\"faq\":[{\"q\":\"국가채무는

",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-49ac3746f184544d.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T963,"])</script><script>self.__next_f.push([1,"## 금리란?\n\n**금리(이자율)**는 돈을 빌린 대가로 지불하는 '돈의 사용료'입니다. 원금에 대해 몇 %의 이자를 주고받는지를 나타냅니다. 돈을 빌려주는 사람에게는 수익률이고, 빌리는 사람에게는 비용입니다.\n\n## 단리와 복리\n\n이자를 계산하는 방식은 크게 두 가지입니다.\n\n### 단리(單利)\n**단리**는 **처음 원금에 대해서만** 이자를 계산합니다.\n\n- 계산식: 이자 = 원금 × 금리 × 기간\n- 예: 100만원을 연 10% 단리로 3년 → 매년 10만원씩, 3년간 30만원 이자\n\n### 복리(複利)\n**복리**는 **이자에도 다시 이자가 붙는** 방식입니다. 원금에 붙은 이자가 다음 기간의 원금에 포함됩니다.\n\n- 예: 100만원을 연 10% 복리로 3년 → 1년 후 110만원, 2년 후 121만원, 3년 후 133.1만원\n\n복리는 시간이 길어질수록 단리보다 훨씬 큰 차이를 만듭니다. 이것이 '복리의 마법'이라 불리는 이유입니다.\n\n## 명목금리와 실질금리\n\n| 구분 | 의미 |\n|------|------|\n| 명목금리 | 겉으로 표시된 금리 (물가 반영 전) |\n| 실질금리 | 명목금리에서 물가상승률(인플레이션)을 뺀 금리 |\n\n- 계산식: **실질금리 ≈ 명목금리 − 물가상승률**\n- 예: 명목금리 5%, 물가상승률 3% → 실질금리는 약 2%\n\n실질금리는 물가를 고려한 **진짜 구매력의 증가**를 보여줍니다. 명목금리가 높아도 물가가 더 많이 오르면 실질적으로는 손해일 수 있습니다.\n\n## 기준금리\n\n**기준금리**는 한 나라의 **중앙은행이 정하는 정책금리**입니다. 우리나라에서는 한국은행 금융통화위원회가 결정합니다. 기준금리는 시중의 모든 금리(예금·대출 금리 등)의 출발점이 되어, 경제 전체에 영향을 줍니다.\n\n- 기준금리 인상 → 시중 금리 상승 → 대출 부담 증가, 소비·투자 위축 (경기 과열·물가 억제)\n- 기준금리 인하 → 시중 금리 하락 → 대출 부담 감소, 소비·투자 촉진 (경기 부양)\n\n## 왜 중요한가\n\n금리는 '돈의 가격'으로, 저축·대출·투자 모든 의사결정의 기준이 됩니다. 금리를 이해하면 왜 중앙은행의 금리 결정이 뉴스 headlines를 장식하는지, 내 예금과 대출에 어떤 영향을 주는지 알 수 있습니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"finance\",\"d\"]\n8:[\"trackId\",\"track2\",\"d\"]\n9:[\"topicId\",\"track2.interest-rate\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"ZTGZ0yjmR-pFsmwSalRjv\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"finance\",\"tracks\",\"track2\",\"track2.interest-rate\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"finance\",\"d\"],{\"children\":[\"tracks\",{\"children\":[[\"trackId\",\"track2\",\"d\"],{\"children\":[[\"topicId\",\"track2.interest-rate\",\"d\"],{\"children\":[\"__PAGE__?{\\\"courseId\\\":\\\"finance\\\",\\\"trackId\\\ 나 마이너스가 될 수 있습니다.\"},{\"id\":\"fb4\",\"prompt\":\"중앙은행이 결정하는 정책금리로, 시중 모든 금리의 출발점이 되는 것을 넣으세요.\",\"code\":\"______금리는 중앙은행(한국은행)이 정하는 정책금리로, 시중의 예금·대출 금리에 영향을 준다.\",\"answers\":[\"기준\",\"기준금리\",\"정책\"],\"output\":\"기준\",\"explain\":\"기준금리는 중앙은행이 결정하는 정책금리입니다. 우리나라는 한국은행 금융통화위원회가 정하며, 시중의 모든 금리의 기준점이 되어 경제 전반에 영향을 줍니다.\"},{\"id\":\"fb5\",\"prompt\":\"물가 반영 전, 겉으로 표시된 금리를 부르는 말을 넣으세요.\",\"code\":\"은행 상품에 표시된, 물가를 반영하기 전의 금리를 ______금리라고 한다.\",\"answers\":[\"명목\",\"명목금리\",\"nominal\"],\"output\":\"명목\",\"explain\":\"명목금리는 물가상승률을 반영하기 전, 겉으로 표시된 금리입니다. 여기서 물가상승률을 빼면 실질금리가 됩니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"단리와 복리의 차이를 바르게 설명한 것은?\",\"options\":[\"단리는 이자에 이자가 붙고, 복리는 원금에만 이자가 붙는다\",\"단리는 원금에만, 복리는 이자에도 다시 이자가 붙는다\",\"단리와 복리는 계산 결과가 항상 같다\",\"복리는 기간이 짧을수록 유리하다\"],\"answer\":1,\"explain\":\"단리는 최초 원금에만 이자를 계산하고, 복리는 이자에도 다시 이자가 붙습니다. 기간이 길수록 복리가 단리보다 훨씬 유리해집니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"100만원을 연 10% 복리로 2년간 예치하면 2년 후 금액은?\",\"options\":[\"120만원\",\"121만원\",\"110만원\",\"130만원\"],\"answer\":1,\"explain\":\"복리이므로 1년 후 110만원(100×1.1), 2년 후 121만원(110×1.1)이 됩니다. 단리라면 120만원이지만 복리는 이자에 이자가 붙어 121만원입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"명목금리가 5%, 물가상승률이 3%일 때 실질금리는 약 얼마인가?\",\"options\":[\"약 8%\",\"약 5%\",\"약 2%\",\"약 15%\"],\"answer\":2,\"explain\":\"실질금리 ≈ 명목금리 − 물가상승률 = 5% − 3% = 약 2%입니다. 실질금리는 물가를 고려한 실제 구매력의 증가를 나타냅니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"우리나라의 기준금리를 결정하는 곳은?\",\"options\":[\"기획재정부\",\"한국은행 금융통화위원회\",\"금융감독원\",\"국회\"],\"answer\":1,\"explain\":\"우리나라의 기준금리는 한국은행의 금융통화위원회가 결정합니다. 기준금리는 시중 금리의 출발점이 되어 경제 전반에 영향을 줍니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"중앙은행이 기준금리를 인상할 때 나타나는 일반적인 효과는?\",\"options\":[\"시중 금리 하락으로 소비·투자가 촉진된다\",\"시중 금리 상승으로 대출 부담이 늘고 소비·투자가 위축된다\",\"물가가 더 빠르게 오른다\",\"예금 금리만 내려간다\"],\"answer\":1,\"explain\":\"기준금리를 올리면 시중 금리가 따라 올라 대출 부담이 커지고 소비·투자가 위축됩니다. 이는 경기 과열과 물가 상승을 억제하는 효과가 있습니다.\"}]},\"faq\":[{\"q\":\"복리가 항상 단리보다 유리한가요?\",\"a\":\"같은 금리라면 예치·투자

thProvider\"]\nc:I[4783,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"336\",\"static/chunks/336-217394674e37e8c5.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-e667c4d5cb17daf4.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T783,## 환율도 변동률로\n\n주가에서 수익률을 구했듯, 환율도 **변동률**(전월 대비 몇 % 변했나)을 구합니다. 공식은 똑같습니다.\n\n```\n변동률(%) = (이번 달 - 지난 달) / 지난 달 × 100\n```\n\n```python\nrates = [1300, 1320, 1290, ...]\nchanges = []\nfor i in range(1, len(rates)):\n    c = (rates[i] - rates[i-1]) / rates[i-1] * 100\n    changes.append(round(c, 2))\nprint(changes)\n# [1.54, -2.27, 4.65, 2.22, -2.9, -2.24, 3.82, 2.94, -2.14, 3.65, -2.11]\n```\n\n- 양수(+1.54): 환율 상승 = 원화 약세\n- 음수(-2.27): 환율 하락 = 원화 강세\n\n## 환율 변동성\n\n환율도 표준편차로 변동성을 잽니다.\n\n```python\nimport statistics\nvolatility = statistics.pstdev(changes)\nprint(round(volatility, 2))   # 2.84\n```\n\n변동성이 **2.84** 입니다. 환율 변동성이 크면 수출입 기업의 계획이 불확실해지고, 환위험 관리가 중요해집니다. 금융 과목에서 배운 '환위험 헤지'가 바로 이 변동성에 대응하는 것입니다.\n\n## 원화 강세였던 달 세기\n\n환율이 하락한(원화"])</script><script>self.__next_f.push([1,"가 강해진) 달이 몇 개월인지 세봅시다.\n\n```python\nwon_strong = len([c for c in changes if c \u003c 0])\nprint(won_strong)   # 5\n```\n\n변동률이 음수인(환율 하락 = 원화 강세) 달은 5개월입니다. 11개월 중 5개월은 원화 강세, 6개월은 약세였습니다.\n\n## 전체 기간 변동\n\n```python\ntotal = (rates[-1] - rates[0]) / rates[0] * 100\nprint(round(total, 2))   # 6.92\n```\n\n1월(1300)에서 12월(1390)까지 환율이 약 6.92% 올랐습니다. 1년간 전반적으로 원화가 약세였다고 읽을 수 있습니다.\n\n## 정리\n\n환율 변동률은 주가 수익률과 같은 공식으로 구하고, 표준편차로 변동성을 잽니다. 변동률 양수는 원화 약세, 음수는 강세입니다. 환율 변동성은 환위험과 직결되어 기업의 리스크 관리에서 중요합니다.7:[\"courseId\",\"findata\",\"d\"]\n8:[\"trackId\",\"track2\",\"d\"]\n9:[\"topicId\",\"track2.exchange-analysis\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"IzFqQxyfmTFt-sY_8y5Aj\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"findata\",\"tracks\",\"track2\",\"track2.exchange-analysis\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"courseId\",\"findata\",\"d\"],{\"c  분석이 거의 같네요?\",\"a\":\"맞습니다. 그게 핵심입니다. 금융 데이터는 종류가 달라도 '변화율 → 평균 → 변동성 → 해석'이라는 분석 틀이 같습니다. 한 번 익히면 여러 데이터에 응용할 수 있습니다.\"},{\"q\":\"환위험 헤지가 뭔가요?\",\"a\":\"환율 변동으로 인한 손실 위험을 줄이는 것입니다. 예를 들어 미래의 환율을 미리 고정하는 거래(선물환) 등을 씁니다. 금융 과목의 파생상품·리스크관리 트랙에서 다룹니다.\"},{\"q\":\"변동성 2.84는 큰 건가요 작은 건가요?\",\"a\":\"절대 기준보다 '비교'로 판단합니다. 같은 기간 다른 통화나 주가의 변동성과 비교해야 크고 작음을 알 수 있습니다. 분석에서는 항상 비교 대상이 중요합니다.\"}],\"courseId\":\"findata\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"주가 데이터 분석\",\"description\":\"가상 회사의 월별 주가 데이터로 수익률과 변동성을 계산해, 이 주식이 어땠는지를 숫자로 읽어봅니다. 금융 데이터 분석의 가장 기본인 주가 분석을 체험하는 트랙입니다.\",\"topicOrder\":[\"track1.finance-data-intro\",\"track1.returns\",\"track1.summary-stats\"],\"topicFiles\":[\"topics/t1-finance-data-intro.json\",\"topics/t2-returns.json\",\"topics/t3-summary-stats.json\"],\"projectFile\":\"project.json\",\"courseId\":\"findata\"},{\"id\":\"track2\",\"order\":2,\"title\":\"환율 데이터 분석\",\"description\":\"원/달러 환율 1년치 데이터를 분석합니다. 환율이 오르고 내리는 것이 무엇을 의미하는지, 변동률과 변동성을 구해 '환율이 얼마나 출렁였는지'를 숫자로 읽어봅니다. 주가와는 또 다른 금융 데이터를 다뤄보는 트랙입니다.\",\"topicOrder\":[\"track2.exchange-intro\",\"track2.exchange-analysis\"],\"topicFiles\":[\"topics/t1-exchange-intro.json\",\"topics/t2-exchange-analysis.json\"],\"projectFile\":\"project.json\",\"courseId\":\"findata\"},{\"id\":\"track3\",\"order\":3,\"title\":\"가계부 지출 분석\",\"description\":\"한 달 가계부 데이터를 분석합니다. 카테고리별 지출을 딕셔너리로 다루며, 총지출·비중·최대 지출 항목을 구해 '돈이 어디에 쓰였는지'를 파악합니다. 주가·환율(리스트)과 달리 딕셔너리 데이터를 다루는, 가장 일상적인 금융 데이터 분석입니다.\",\"topicOrder\":[\"track3.budget-intro\",\"track3.budget-analysis\"],\"topicFiles\":[\"topics/t1-budget-intro.json\",\"topics/t2-budget-analysis.json\"],\"projectFile\":\"project.json\",\"courseId\":\"findata\"}],\"allBadges\":[{\"id\":\"gl_multi_learner\",\"scope\":\"global\",\"name\":\"멀티 러너\",\"desc\":\"두 개 이상의 과목을 학습하기 시작했어요\",\"icon\":\"layers\",\"condition\":{\"type\":\"courses_started\",\"gte\":2}},{\"id\":\"gl_all_started\",\"scope\":\"global\",\"name\":\"전 과목 개척자\",\"desc\":\"모든 과목을 학습하기 시작했어요\",\"ic

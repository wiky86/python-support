3500]\\n# 인덱스 0=1월 ... 11=12월\"},\"missions\":[{\"id\":\"m1\",\"prompt\":\"먼저 데이터를 확인합니다. 최고 주가를 구하세요. (최댓값 함수)\",\"code\":\"prices = [10000, 10500, 10200, 11000, 11500, 11200, 12000, 11800, 12500, 13000, 12700, 13500]\\nprint(______(prices))\",\"answers\":[\"max\"],\"ignoreCase\":false,\"output\":\"13500\",\"explain\":\"max(prices)로 최고 주가 13500(12월)을 확인합니다. 분석의 첫걸음은 데이터 파악입니다.\"},{\"id\":\"m2\",\"prompt\":\"1년 전체 수익률(%)을 구하세요. 마지막 주가를 가리키는 인덱스를 넣으세요.\",\"code\":\"total_return = (prices[______] - prices[0]) / prices[0] * 100\\nprint(round(total_return, 2))\",\"answers\":[\"-1\",\"11\"],\"ignoreCase\":false,\"output\":\"35.0\",\"explain\":\"(12월 주가 - 1월 주가)/1월 주가 × 100 = 35.0%. 1년간 35% 상승했습니다.\"},{\"id\":\"m3\",\"prompt\":\"월별 수익률의 평균을 구하세요. (합계 함수) returns는 앞서 계산된 월별 수익률 리스트입니다.\",\"code\":\"returns = [5.0, -2.86, 7.84, 4.55, -2.61, 7.14, -1.67, 5.93, 4.0, -2.31, 6.3]\\navg_return = ______(returns) / len(returns)\\nprint(round(avg_return, 2))\",\"answers\":[\"sum\"],\"ignoreCase\":false,\"output\":\"2.85\",\"explain\":\"sum/len으로 평균 월수익률 2.85%를 구합니다. 매달 평균 2.85%씩 올랐다는 뜻입니다.\"},{\"id\":\"m4\",\"prompt\":\"변동성(표준편차)을 구하세요. statistics 모듈을 가져오는 키워드를 넣으세요.\",\"code\":\"______ statistics\\nvolatility = statistics.pstdev(returns)\\nprint(round(volatility, 2))\",\"answers\":[\"import\"],\"ignoreCase\":false,\"output\":\"4.08\",\"explain\":\"import statistics 후 pstdev로 변동성 4.08을 구합니다. 수익률이 평균에서 얼마나 출렁였는지(위험)를 나타냅니다.\"},{\"id\":\"m5\",\"prompt\":\"상승한(수익률 \u003e 0) 달의 수를 세세요. 조건을 완성하세요.\",\"code\":\"up_months = len([r for r in returns if r ______ 0])\\nprint(up_months)\",\"answers\":[\"\u003e\"],\"ignoreCase\":false,\"output\":\"7\",\"explain\":\"r \u003e 0 조건으로 상승한 달을 셉니다. 11개월 중 7개월 상승으로, 오른 달이 더 많았습니다.\"}],\"report\":{\"title\":\"미래테크 주가 1년 분석 리포트\",\"template\":\"【분석 결과】\\n분석 기간: 1~12월 (12개월)\\n시작 주가: {startPrice}원 → 종료 주가: {endPrice}원\\n전체 수익률: {totalReturn}%\\n평균 월수익률: {avgReturn}%\\n변동성(표준편차): {volatility}\\n최고 월수익률: {maxReturn}% / 최저 월수익률: {minReturn}%\\n상승한 달: {upMonths}개월 / 하락한 달: {downMonths}개월\\n\\n【한 줄 해석】\\n미래테크는 1년간 {totalReturn}% 상승했고, 매달 평균 {avgReturn}%씩 올랐습니다. 변동성 {volatility}로 중간중간 출렁임은 있었지만, 11개월 중 {upMonths}개월이 상승해 전반적으로 꾸준한 상승세였습니다.\",\"computedValues\":{\"startPrice\":10000,\"endPrice\":13500,\"totalReturn\":35,\"avgReturn\":2.85,\"volatility\":4.08,\"maxReturn\":7.84,\"minReturn\":-2.86,\"upMonths\":7,\"downMonths\":4},\"conclusion\":{\"title\":\"이 프로젝트가 가르쳐준 것, 그리고 실무와의 연결\",\"body\":\"이번 프로젝트에서 여러분은 '숫자 나열'에 불과했던 주가 데이터를 의미 있는 지표로 바꿔냈습니다. 각 단계가 무엇을 위한 것이었는지, 그리고 실무에서 어떻게 쓰이는지 정리하면 다음과 같습니다.\\n\\n① 수익률 계산 — 금융 데이터 분석의 출발점\\n'500원 올랐다'가 아니라 '5% 올랐다'로 바꾸는 것이 수익률입니다. 수준이 다른 자산도 공정하게 비교할 수 있게 해주죠. 실무에서 모든 투자 성과 평가는 이 수익률에서 시작합니다. 펀드·주식·부동산 수익률 비교가 전부 같은 원리입니다.\\n\\n② 평균 수익률 — 추세 읽기\\n여러 달의 수익률을 하나로 요약해 '전반적으로 오르는 추세인가'를 봅니다. 실무에서는 종목·포트폴리오의 기대수익률을 가늠하는 기본 지표가 됩니다.\\n\\n③ 변동성(표준편차) — 위험 측정\\n금융에서 가장 중요한 개념 중 하나입니다. 수익이 아무리 높아도 변동성이 크면 위험한 투자입니다. 실무의 리스크 관리, 그리고 금융 과목에서 배운 샤프지수(수익÷위험)가 모두 이 변동성 위에 세워집니다. '수익만 보지 말고 위험도 함께 보라'는 금융의 핵심 원칙을 숫자로 체험한 것입니다.\\n\\n④ 상승/하락 달 세기, 최고·최저 — 데이터를 해석으로\\n숫자를 '꾸준한 상승세였다', '출렁임이 있었다' 같은 말로 바꾸는 과정입니다. 분석의 진짜 목적은 계산이 아니라, 숫자에서 의미를 읽어 의사결정으로 잇는 것입니다.\\n\\n정리하면, 이 작은 프로젝트는 실제 금융 데이터 분석의 축소판입니다. 데이터 불러오기 → 수익률 계산 → 요약 통계(평균·변동성) → 해석이라는 흐름은, 수억 건의 실제 거래 데이터를 다루는 퀀트 분석가의 작업과 본질적으로 같습니다. 여러분은 방금 그 첫걸음을 완주했습니다.\"},\"conceptsUsed\":[\"리스트/인덱싱\",\"수익률 계산\",\"반복문\",\"평균(sum/len)\",\"변동성(표준편차)\",\"컴프리헨션 조건\",\"데이터 해석\"]},\"courseId\":\"findata\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"주가 데이터 분석\",\"description\":\"가상 회사의 월별 주가 데이터로 수익률과 변동성을 계산해, 이 주식이 어땠는지를 숫자로 읽어봅니다. 금융 데이터 분석의 가장 기본인 주가 분석을 체험하는 트랙입니다.\",\"topicOrder\":[\"track1.finance-data-intro\",\"track1.returns\",\"track1.summary-stats\"],\"topicFiles\":[\"topics/t1-finance-data-intro.json\",\"topics/t2-returns.json\",\"topics/t3-summary-stats.json\"],\"projectFile\":\"project.json\",\"courseId\":\"findata\"},{\"id\":\"track2\",\"order\":2,\"title\":\"환율 데이터 분석\",\"description\":\"원/달러 환율 1년치 데이터를 분석합니다. 환율이 오르고 내리는 것이

thProvider\"]\nc:I[4783,[\"762\",\"static/chunks/44530001-792177c4c52bbd93.js\",\"336\",\"static/chunks/336-217394674e37e8c5.js\",\"766\",\"static/chunks/766-ddbb416c19218f56.js\",\"185\",\"static/chunks/app/layout-e667c4d5cb17daf4.js\"],\"Navbar\"]\ne:I[1060,[],\"\"]\n5:T803,"])</script><script>self.__next_f.push([1,"## 비중 — 어디에 많이 썼나\n\n총지출만으로는 부족합니다. '어느 항목이 얼마나 큰 비중을 차지하는지' 봐야 소비 패턴을 알 수 있습니다. 비중은 '항목 금액 / 총지출 × 100'으로 구합니다.\n\n```python\nexpenses = {'식비': 450000, '교통': 120000, '주거': 600000, '여가': 180000, '기타': 150000}\ntotal = sum(expenses.values())\n\nfor category, amount in expenses.items():\n    percent = amount / total * 100\n    print(category, round(percent, 1))\n# 식비 30.0 / 교통 8.0 / 주거 40.0 / 여가 12.0 / 기타 10.0\n```\n\n`items()`로 카테고리와 금액을 함께 꺼내 각 비중을 계산합니다. 주거가 40%로 가장 큰 비중입니다.\n\n## 최대 지출 항목 찾기\n\n'어디에 가장 많이 썼나'를 한 줄로 찾을 수 있습니다.\n\n```python\ntop = max(expenses, key=expenses.get)\nprint(top)   # 주거\n```\n\n`max(expenses, key=expenses.get)` 은 값(금액)이 가장 큰 키(카테고리)를 반환합니다. 주거(60만 원)가 최대 지출 항목입니다. 트랙(파이썬)에서 배운 max의 key 옵션이 여기서 쓰입니다.\n\n## 특정 기준 넘는 항목 찾기\n\n```python\nbig = [c for c, a in expenses.items() if a \u003e= 200000]\nprint(big)   # ['식비', '주거']\n```\n\n20만 원 이상 쓴 항목만 골라냅니다. 컴프리헨션과 조건으로 '큰 지출' 항목을 추립니다.\n\n## 숫자를 해석으로\n\n- 주거 40% + 식비 30% = 70%를 두 항목이 차지 → '고정비·필수 지출 비중이 높다'\n- 여가 12% → '여가 지출은 적은 편'\n\n이렇게 비중을 보면 '어디를 줄일 수 있을지' 같은 판단으로 이어집니다. 가계부 분석의 목적은 숫자를 소비 습관 개선으로 잇는 것입니다.\n\n## 정리\n\n비중은 '항목/총지출 × 100'으로 구하고, items()로 카테고리와 금액을 함께 다룹니다. max(key=get)로 최대 지출 항목을, 컴프리헨션으로 특정 기준 넘는 항목을 찾습니다. 비중 분석은 소비 패턴 파악과 개선으로 이어집니다."])</script><script>self.__next_f.push([1,"7:[\"courseId\",\"findata\",\"d\"]\n8:[\"trackId\",\"track3\",\"d\"]\n9:[\"topicId\",\"track3.budget-analysis\",\"d\"]\nf:[]\n"])</script><script>self.__next_f.push([1,"0:[\"$\",\"$L2\",null,{\"buildId\":\"IzFqQxyfmTFt-sY_8y5Aj\",\"assetPrefix\":\"/python-support\",\"urlParts\":[\"\",\"findata\",\"tracks\",\"track3\",\"track3.budget-analysis\",\"\"],\"initialTree\":[\"\",{\"children\":[[\"c

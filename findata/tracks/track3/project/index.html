셔너리의 값들을 꺼내는 메서드를 넣으세요.\",\"code\":\"expenses = {'식비': 450000, '교통': 120000, '주거': 600000, '여가': 180000, '기타': 150000}\\ntotal = sum(expenses.______())\\nprint(total)\",\"answers\":[\"values\"],\"ignoreCase\":false,\"output\":\"1500000\",\"explain\":\"sum(expenses.values())로 모든 카테고리 지출을 더합니다. 한 달 총지출 150만 원입니다.\"},{\"id\":\"m2\",\"prompt\":\"주거비 지출액을 조회하세요. 키로 값을 조회하는 형태를 완성하세요. (여는 기호)\",\"code\":\"print(expenses______'주거'])\",\"answers\":[\"[\"],\"ignoreCase\":false,\"output\":\"600000\",\"explain\":\"expenses['주거']로 주거비 60만 원을 조회합니다.\"},{\"id\":\"m3\",\"prompt\":\"식비 비중(%)을 구하세요. 분모(총지출)를 넣으세요.\",\"code\":\"percent = expenses['식비'] / ______ * 100\\nprint(round(percent, 1))\",\"answers\":[\"total\"],\"ignoreCase\":false,\"output\":\"30.0\",\"explain\":\"식비 비중 = 450000 / 1500000 × 100 = 30.0%입니다.\"},{\"id\":\"m4\",\"prompt\":\"가장 많이 쓴 항목을 찾으세요. max에 값 기준 옵션을 완성하세요.\",\"code\":\"top = max(expenses, ______=expenses.get)\\nprint(top)\",\"answers\":[\"key\"],\"ignoreCase\":false,\"output\":\"주거\",\"explain\":\"max(expenses, key=expenses.get)로 금액이 가장 큰 항목(주거, 60만 원)을 찾습니다.\"},{\"id\":\"m5\",\"prompt\":\"20만 원 이상 쓴 항목을 골라내세요. 조건을 완성하세요.\",\"code\":\"big = [c for c, a in expenses.items() if a ______ 200000]\\nprint(big)\",\"answers\":[\"\u003e=\"],\"ignoreCase\":false,\"output\":\"['식비', '주거']\",\"explain\":\"a \u003e= 200000 으로 20만 원 이상 쓴 항목(식비·주거)을 추립니다. 큰 지출을 한눈에 봅니다.\"}],\"report\":{\"title\":\"한 달 가계부 분석 리포트\",\"template\":\"【분석 결과】\\n총지출: {total}원 (5개 카테고리)\\n항목별 비중: 주거 {housing}%, 식비 {food}%, 여가 {leisure}%, 기타 {etc}%, 교통 {transport}%\\n최대 지출 항목: {topCategory} ({topAmount}원)\\n20만 원 이상 지출 항목: {bigItems}\\n항목당 평균: {avg}원\\n\\n【한 줄 해석】\\n한 달 총 {total}원을 썼고, 주거({housing}%)와 식비({food}%)가 전체의 70%를 차지했습니다. 필수·고정 지출 비중이 높고, 여가는 {leisure}%로 적은 편입니다.\",\"computedValues\":{\"total\":1500000,\"housing\":40,\"food\":30,\"leisure\":12,\"etc\":10,\"transport\":8,\"topCategory\":\"주거\",\"topAmount\":600000,\"bigItems\":\"식비, 주거\",\"avg\":300000},\"conclusion\":{\"title\":\"이 프로젝트가 가르쳐준 것, 그리고 실무와의 연결\",\"body\":\"이번 프로젝트는 세 가지 면에서 의미가 있습니다.\\n\\n① 딕셔너리로 금융 데이터 다루기 — 데이터 구조의 선택\\n주가·환율은 리스트(시계열)였지만, 가계부는 '항목별 금액'이라 딕셔너리가 맞았습니다. 데이터의 성격에 맞는 구조를 고르는 것이 분석의 첫 단추입니다. 실무에서도 '이 데이터를 어떻게 담을까'가 분석의 출발점입니다.\\n\\n② 비중 분석 — 모든 재무 분석의 기본\\n'어디에 얼마나 쓰는가'를 비중으로 보는 것은 개인 가계부뿐 아니라 기업 비용 구조 분석, 예산 편성, 포트폴리오 자산 배분과 똑같은 원리입니다. 금융 과목의 자산배분 트랙에서 '어떤 자산에 몇 % 투자할까'를 다루는데, 그것이 바로 이 비중 분석입니다.\\n\\n③ 숫자를 행동으로 — 분석의 진짜 목적\\n주거 40%, 식비 30%라는 숫자는 '필수 지출이 크다', '줄이려면 어디를 봐야 하나' 같은 판단으로 이어집니다. 분석은 숫자를 뽑는 데서 끝나지 않고, 의사결정과 행동으로 연결될 때 가치가 생깁니다.\\n\\n정리하면, 이 과목의 세 프로젝트(주가·환율·가계부)를 통해 여러분은 서로 다른 금융 데이터를 같은 분석 틀로 다뤄봤습니다. 시계열이든 항목별이든, '데이터 구조 선택 → 계산 → 비중·요약 → 해석'이라는 흐름은 같습니다. 이것이 금융 데이터 분석의 본질이고, 파이썬과 금융 지식이 만나는 지점입니다. 이 작은 경험들이 실무 데이터 분석의 탄탄한 출발점이 됩니다.\"},\"conceptsUsed\":[\"딕셔너리 다루기\",\"총지출(sum/values)\",\"비중 계산\",\"최대 지출(max/key)\",\"조건으로 추리기\",\"소비 패턴 해석\"]},\"courseId\":\"findata\"},\"allTracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"주가 데이터 분석\",\"description\":\"가상 회사의 월별 주가 데이터로 수익률과 변동성을 계산해, 이 주식이 어땠는지를 숫자로 읽어봅니다. 금융 데이터 분석의 가장 기본인 주가 분석을 체험하는 트랙입니다.\",\"topicOrder\":[\"track1.finance-data-intro\",\"track1.returns\",\"track1.summary-stats\"],\"topicFiles\":[\"topics/t1-finance-data-intro.json\",\"topics/t2-returns.json\",\"topics/t3-summary-stats.json\"],\"projectFile\":\"project.json\",\"courseId\":\"findata\"},{\"id\":\"track2\",\"order\":2,\"title\":\"환율 데이터 분석\",\"description\":\"원/달러 환율 1년치 데이터를 분석합니다. 환율이 오르고 내리는 것이 무엇을 의미하는지, 변동률과 변동성을 구해 '환율이 얼마나 출렁였는지'를 숫자로 읽어봅니다. 주가와는 또 다른 금융 데이터를 다뤄보는 트랙입니다.\",\"topicOrder\":[\"track2.exchange-intro\",\"track2.exchange-analysis\"],\"topicFiles\":[\"topics/t1-exchange-intro.json\",\"topics/t2-exchange-analysis.json\"],\"projectFile\":\"project.json\",\"courseId\":\"findata\"},{\"id\":\"track3\",\"order\":3,\"title\":\"가계부 지출 분석\",\"description\":\"한 달 가계부 데이터를 분석합니다. 카테고리별 지출을 딕셔너리로 다루며, 총지출·비중·최대 지출 항목을 구해 '돈이 어디에 쓰였는지'를 파악합니다. 주가·환율(리스트)과 달리 딕셔너리 데이터를 다루는, 가장 일상적인 금융 데이터 분석입니다.\",\"topicOrder\":[\"track3.budget-intro\",

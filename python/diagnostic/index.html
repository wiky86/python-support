DataFrame은 행(row)과 열(column)로 이뤄진 2차원 표 형태 자료구조로, 엑셀 시트와 유사합니다. 데이터 분석의 핵심 도구입니다.\"},{\"id\":\"diag.py.6\",\"trackId\":\"track3\",\"type\":\"mcq\",\"q\":\"CSV 파일을 DataFrame으로 읽어오는 pandas 함수는?\",\"options\":[\"pd.open_csv()\",\"pd.read_csv()\",\"pd.load_csv()\",\"pd.csv()\"],\"answer\":1,\"explain\":\"pd.read_csv('파일경로')로 CSV 파일을 DataFrame으로 불러옵니다. 데이터 분석의 가장 흔한 시작점입니다.\"},{\"id\":\"diag.py.7\",\"trackId\":\"track4\",\"type\":\"mcq\",\"q\":\"DataFrame에서 결측치(비어 있는 값)를 특정 값으로 채우는 메서드는?\",\"options\":[\"df.dropna()\",\"df.fillna()\",\"df.isna()\",\"df.append()\"],\"answer\":1,\"explain\":\"fillna()는 결측치를 지정한 값으로 채웁니다. dropna()는 결측치가 있는 행/열을 제거하고, isna()는 결측 여부를 True/False로 표시합니다.\"},{\"id\":\"diag.py.8\",\"trackId\":\"track4\",\"type\":\"mcq\",\"q\":\"다음 중 'df에서 age가 20 이상인 행만 골라내는' 올바른 코드는?\",\"options\":[\"df[df['age'] \u003e= 20]\",\"df(age \u003e= 20)\",\"df.filter(20)\",\"df['age' \u003e= 20]\"],\"answer\":0,\"explain\":\"불리언 인덱싱입니다. df['age'] \u003e= 20이 True/False 시리즈를 만들고, df[...]가 True인 행만 반환합니다.\"},{\"id\":\"diag.py.9\",\"trackId\":\"track5\",\"type\":\"mcq\",\"q\":\"'부서별 평균 급여'처럼 그룹으로 묶어 집계할 때 사용하는 pandas 메서드는?\",\"options\":[\"df.sort_values()\",\"df.groupby()\",\"df.merge()\",\"df.reset_index()\"],\"answer\":1,\"explain\":\"groupby()로 특정 열을 기준으로 그룹을 나눈 뒤 mean(), sum() 등으로 집계합니다. 예: df.groupby('부서')['급여'].mean().\"},{\"id\":\"diag.py.10\",\"trackId\":\"track5\",\"type\":\"mcq\",\"q\":\"다음 코드의 의미로 가장 적절한 것은?\\n```python\\ndf.groupby('지점')['매출'].sum()\\n```\",\"options\":[\"전체 매출의 평균\",\"지점별 매출 합계\",\"매출이 가장 큰 지점 하나\",\"지점 개수\"],\"answer\":1,\"explain\":\"'지점'으로 그룹을 나눈 뒤 각 그룹의 '매출'을 합산합니다. 결과는 지점별 매출 합계 시리즈입니다.\"},{\"id\":\"diag.py.11\",\"trackId\":\"track6\",\"type\":\"mcq\",\"q\":\"파이썬에서 데이터를 그래프로 시각화할 때 가장 널리 쓰이는 기본 라이브러리는?\",\"options\":[\"requests\",\"matplotlib\",\"os\",\"datetime\"],\"answer\":1,\"explain\":\"matplotlib은 파이썬의 대표적 시각화 라이브러리로, 선/막대/산점도 등 다양한 그래프를 그립니다. pandas도 내부적으로 이를 활용합니다.\"},{\"id\":\"diag.py.12\",\"trackId\":\"track7\",\"type\":\"mcq\",\"q\":\"데이터 분석에서 '탐색적 데이터 분석(EDA)' 단계의 목적으로 가장 적절한 것은?\",\"options\":[\"코드를 배포용으로 최적화하는 것\",\"데이터의 분포·패턴·이상치를 살펴 특징을 파악하는 것\",\"데이터를 삭제하는 것\",\"웹사이트를 만드는 것\"],\"answer\":1,\"explain\":\"EDA는 본격 분석 전에 데이터의 분포, 상관관계, 이상치, 결측 등을 요약·시각화하며 데이터의 성격을 이해하는 단계입니다. describe(), info(), value_counts() 등을 활용합니다.\"}]},\"tracks\":[{\"id\":\"track1\",\"order\":1,\"title\":\"파이썬 기초 다지기\",\"description\":\"데이터 분석에 필요한 최소한의 파이썬 문법을 익힙니다.\",\"topicOrder\":[\"track1.variables\",\"track1.lists\",\"track1.dict\",\"track1.conditions\",\"track1.loops\",\"track1.functions\",\"track1.comprehension\"],\"topicFiles\":[\"topics/t1-variables.json\",\"topics/t2-lists.json\",\"topics/t3-dict.json\",\"topics/t4-conditions.json\",\"topics/t5-loops.json\",\"topics/t6-functions.json\",\"topics/t7-comprehension.json\"],\"projectFile\":\"project.json\",\"courseId\":\"python\"},{\"id\":\"track2\",\"order\":2,\"title\":\"NumPy로 수치 다루기\",\"description\":\"pandas 이해의 토대가 되는 NumPy 배열과 수치 연산을 익힙니다.\",\"topicOrder\":[\"track2.ndarray\",\"track2.indexing\",\"track2.vectorized\",\"track2.broadcasting\",\"track2.statistics\",\"track2.boolean\"],\"topicFiles\":[\"topics/t1-ndarray.json\",\"topics/t2-indexing.json\",\"topics/t3-vectorized.json\",\"topics/t4-broadcasting.json\",\"topics/t5-statistics.json\",\"topics/t6-boolean.json\"],\"projectFile\":\"project.json\",\"courseId\":\"python\"},{\"id\":\"track3\",\"order\":3,\"title\":\"pandas 핵심 - 데이터 구조\",\"description\":\"데이터 분석의 중심 도구인 pandas의 Series와 DataFrame을 익힙니다.\",\"topicOrder\":[\"track3.series\",\"track3.dataframe\",\"track3.loading\",\"track3.selection\",\"track3.filtering\",\"track3.columns\",\"track3.sorting\"],\"topicFiles\":[\"topics/t1-series.json\",\"topics/t2-dataframe.json\",\"topics/t3-loading.json\",\"topics/t4-selection.json\",\"topics/t5-filtering.json\",\"topics/t6-columns.json\",\"topics/t7-sorting.json\"],\"projectFile\":\"project.json\",\"courseId\":\"python\"},{\"id\":\"track4\",\"order\":4,\"title\":\"pandas 실전 - 데이터 가공\",\"description\

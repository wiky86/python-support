\n\\n## 슬라이싱도 동일\\n\\n`[시작:끝]`으로 잘라내며, 시작은 포함·끝은 불포함입니다.\\n\\n```python\\narr = np.array([10, 20, 30, 40, 50])\\narr[1:4]    # [20 30 40]\\narr[:3]     # [10 20 30]\\narr[2:]     # [30 40 50]\\n```\\n\\n## 여러 값 한 번에 바꾸기\\n\\n리스트와 달리, 배열은 슬라이싱한 범위에 값을 한 번에 지정할 수 있습니다.\\n\\n```python\\narr = np.array([10, 20, 30, 40, 50])\\narr[1:4] = 0\\nprint(arr)     # [10  0  0  0 50]\\n```\\n\\n`arr[1:4] = 0` 한 줄로 1~3번 위치가 모두 0이 됩니다. 이것을 브로드캐스팅이라 하며, 뒤 토픽에서 더 다룹니다.\\n\\n## 팬시 인덱싱 — 원하는 위치만 골라 꺼내기\\n\\n인덱스 여러 개를 리스트로 넣으면, 그 위치의 값만 모아 새 배열로 꺼냅니다.\\n\\n```python\\narr = np.array([10, 20, 30, 40, 50])\\narr[[0, 2, 4]]     # [10 30 50]\\n```\\n\\n0번, 2번, 4번 값만 골라낸 것입니다. 특정 행들만 뽑을 때 유용합니다.\\n\\n## 리스트 인덱싱과 다른 점 정리\\n\\n기본 인덱싱·슬라이싱은 리스트와 같지만, 배열은 슬라이스에 값을 한 번에 대입하거나(`arr[1:4] = 0`), 여러 위치를 한꺼번에 골라내는(`arr[[0,2,4]]`) 기능이 추가로 있습니다.\",\"fillBlanks\":[{\"id\":\"fb1\",\"prompt\":\"배열의 세 번째 값을 꺼내세요.\",\"code\":\"import numpy as np\\narr = np.array([10, 20, 30, 40])\\nprint(arr[______])\",\"answers\":[\"2\"],\"output\":\"30\",\"explain\":\"인덱스는 0부터 시작하므로 세 번째 값은 2번입니다(0-\u003e10, 1-\u003e20, 2-\u003e30). 리스트의 인덱싱과 완전히 동일한 규칙입니다.\"},{\"id\":\"fb2\",\"prompt\":\"배열의 마지막 값을 꺼내세요.\",\"code\":\"import numpy as np\\narr = np.array([5, 10, 15, 20])\\nprint(arr[______])\",\"answers\":[\"-1\"],\"output\":\"20\",\"explain\":\"음수 인덱스는 뒤에서부터 셉니다. -1은 맨 마지막, -2는 뒤에서 두 번째입니다. 배열의 길이를 몰라도 마지막 값을 꺼낼 수 있어 편리합니다.\"},{\"id\":\"fb3\",\"prompt\":\"배열에서 1번부터 3번까지 잘라내세요.\",\"code\":\"import numpy as np\\narr = np.array([10, 20, 30, 40, 50])\\nprint(arr[______])\",\"answers\":[\"1:4\"],\"output\":\"[20 30 40]\",\"explain\":\"[1:4]는 1번을 포함하고 4번은 제외하므로 1, 2, 3번 값(20, 30, 40)을 가져옵니다. 끝 불포함 규칙은 리스트 슬라이싱과 같습니다.\"},{\"id\":\"fb4\",\"prompt\":\"0번, 2번 값만 골라 꺼내세요. (팬시 인덱싱)\",\"code\":\"import numpy as np\\narr = np.array([100, 200, 300, 400])\\nprint(arr[______])\",\"answers\":[\"[0, 2]\",\"[0,2]\"],\"output\":\"[100 300]\",\"explain\":\"대괄호 안에 인덱스 리스트 [0, 2]를 넣으면 그 위치의 값만 모아 새 배열로 반환합니다. 이것을 팬시 인덱싱이라 하며, 연속되지 않은 특정 위치들만 골라낼 때 씁니다. 바깥 대괄호는 인덱싱 기호, 안쪽 대괄호는 인덱스 목록이라 대괄호가 두 겹인 점에 주의하세요.\"},{\"id\":\"fb5\",\"prompt\":\"다음 코드의 출력을 예측하세요.\",\"code\":\"import numpy as np\\narr = np.array([1, 2, 3, 4, 5])\\narr[0:2] = 9\\nprint(arr)\",\"answers\":[\"[9 9 3 4 5]\"],\"output\":\"[9 9 3 4 5]\",\"explain\":\"arr[0:2] = 9는 0~1번 위치(1, 2)를 모두 9로 한 번에 바꿉니다. 리스트에서는 슬라이스에 값 하나를 대입할 수 없지만, 배열에서는 브로드캐스팅 덕분에 가능합니다. 3번 이후 값(3, 4, 5)은 그대로 남습니다.\"}],\"quiz\":{\"passThreshold\":0.8,\"questions\":[{\"id\":\"q1\",\"type\":\"mcq\",\"q\":\"배열 arr = np.array([7, 8, 9])에서 arr[1]의 값은?\",\"options\":[\"7\",\"8\",\"9\",\"에러\"],\"answer\":1,\"explain\":\"인덱스 1은 두 번째 값 8입니다. 배열의 기본 인덱싱은 리스트와 같습니다.\"},{\"id\":\"q2\",\"type\":\"mcq\",\"q\":\"arr = np.array([10, 20, 30, 40, 50])에서 arr[2:]의 결과는?\",\"options\":[\"[10 20]\",\"[30 40 50]\",\"[20 30 40]\",\"[10 20 30]\"],\"answer\":1,\"explain\":\"시작 인덱스만 쓰고 끝을 생략하면 그 위치부터 끝까지 가져옵니다. 2번(30)부터 마지막까지입니다.\"},{\"id\":\"q3\",\"type\":\"mcq\",\"q\":\"팬시 인덱싱 arr[[0, 3]]이 하는 일은? (arr = np.array([1, 2, 3, 4]))\",\"options\":[\"0부터 3까지 슬라이싱\",\"0번과 3번 값만 골라냄\",\"에러\",\"0과 3을 더함\"],\"answer\":1,\"explain\":\"인덱스 리스트를 넣으면 해당 위치들의 값만 모읍니다. 결과는 [1 4]입니다. 슬라이싱(arr[0:3])과 달리 연속되지 않은 위치를 고를 수 있습니다.\"},{\"id\":\"q4\",\"type\":\"mcq\",\"q\":\"다음 코드의 결과는?\\n`arr = np.array([1, 2, 3, 4])`\\n`arr[1:3] = 0`\\n`print(arr)`\",\"options\":[\"[0 0 0 0]\",\"[1 0 0 4]\",\"[1 2 3 4]\",\"에러\"],\"answer\":1,\"explain\":\"1~2번 위치(2, 3)가 0으로 바뀌고 나머지는 유지됩니다. 슬라이스 범위 전체에 값 하나를 한 번에 대입할 수 있는 것이 배열의 특징입니다.\"},{\"id\":\"q5\",\"type\":\"mcq\",\"q\":\"배열 슬라이싱과 리스트 슬라이싱의 공통점으로 옳은 것은?\",\"options\":[\"둘 다 끝 인덱스를 포함한다\",\"둘 다 0부터 시작하고 끝은 불포함\",\"둘 다 팬시 인덱싱이 된다\",\"둘 다 슬라이스에 값 하나를 대입할 수 있다\"],\"answer\":1,\"explain\":\"인덱스가 0부터 시작하고 끝이 불포함인 규칙은 공통입니다. 팬시 인덱싱과 슬라이스 일괄 대입은 배열에만 있는 기능입니다.\"}]},\"faq\":[{\"q\":\"배열 인덱싱이 리스트랑 똑같나요?\",\"a\":\"기본은 같아요. 0부터 시작하고, 음수 인덱스와 슬라이싱도 동일합니다. 다만 배열에는 팬시 인덱싱, 슬라이스 일괄 대입 같은 추가 기능이 있습니다.\"},{\"q\":\"arr[[0, 2]]에서 대괄호가 왜 두 개인가요?\",\"a\":\"바깥 대괄호는 인덱싱한다는 기호이고, 안쪽 대괄호는 0번과 2번이라는 인덱스 목록이에요. 그래서 대괄
